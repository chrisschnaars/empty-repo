      type: object
      description: >
        Overrides the Global Watchlist filters configured in Admin Dashboard.

        > **Note**: This feature is applicable only to the [legacy Global
        Watchlist
        settings](/docs/id-plus/modules/global-watchlist/configuration/settings/legacy-watchlist-settings#override-default-search-settings).
      properties:
        matchingCriteria:
          type: object
          properties:
            nameDob:
              type: boolean
              description: >
                Overrides the default match criteria settings requiring the
                consumer's name and date of birth to match.
              default: true
              example: true
            nameFuzzinessTolerance:
              type: number
              description: >
                Determines the match threshold for the consumer's name. Valid
                values are any number between 0 and 1 with decimal precision.

                Zero (0) is an exact match, while one (1) allows for a broad
                match.
                  > **Note**: If not specified explicitly in the request, the default value for this field will use the value set in the [Global Watchlist Settings](/docs/id-plus/modules/global-watchlist/configuration/settings/global-watchlist-settings).
              default: 0.5
              example: 0.5
            dobMatchLogic:
              type: string
              description: >
                Overrides the default match criteria settings requiring the date
                of birth to be within a 1-year radius or exact on YYYY/MM/DD or
                YYYY

                when the date of birth is provided at the following match
                levels: `exact_yyyy_mm_dd`, `one_year_radius_yyyy_mm_dd`,
                `exact_yyyy`, `one_year_radius_yyyy`.
              example: one_year_radius_yyyy
        limit:
          type: integer
          description: >
            The maximum number of entities returned with each query. Specify any
            value between 1-100.
          default: 30
          example: 30
        countries:
          description: >
            The countries from which to pull PEP and adverse media results.
            Values should be entered in a two-letter ISO 3166-1 alpha-2 format.
          type: array
          items:
            type: string
          example:
            - US
            - CA
