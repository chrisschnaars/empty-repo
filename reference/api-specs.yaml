    EmailRiskResponse:
      title: Email Risk
      description: >
        Returns email risk and correlation scores. Conditional parameters are
        email.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        nameEmailCorrelation:
          description: Contains the email correlation value and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I123
                - I456
                - I789
            score:
              description: >-
                Indicates the strength of the relationship between the email
                address and the consumer's `firstName` and `surName`.
              type: number
              example: 0.9953
        emailRisk:
          description: Contains the email risk score and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I123
                - I456
            score:
              description: >-
                The primary email risk score. A higher score indicates a greater
                likelihood of fraud. Values range from 0.0 to 1.0.
              type: number
              example: 0.56
            scores:
              description: A list of risk scores for this transaction.
              type: array
              items:
                type: object
                properties:
                  name:
                    description: The risk module's name.
                    type: string
                    example: Email Risk Model (US) Norm
                  version:
                    description: The risk module's version.
                    type: string
                    example: '7.0'
                  score:
                    description: >-
                      Represents the level of risk associated with an email
                      address. A higher score indicates a greater likelihood of
                      fraud.
                    type: number
                    example: 0.56
            signals:
              type: object
              description: Signals returned by the Email Risk product.
              properties:
                email:
                  type: object
                  description: The `email` primary key.
                  properties:
                    domain:
                      type: string
                      description: The domain of the email address.
                      example: gmail.com
                    topLevelDomain:
                      type: string
                      description: The top-level part of the email domain.
                      example: com
                    isDeliverable:
                      type: boolean
                      description: >-
                        Whether the corresponding mailbox is active and emails
                        can be delivered to it.
                      example: true
                    isPrivateRelay:
                      type: boolean
                      description: Whether the email domain is a private relay domain.
                      example: false
                    perplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        non-sensical patterns in the email handle; range
                        0.0–1.0.
                      example: 0.09
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the email address matches a list of commonly
                        used filler values.
                      example: false
                    countNonEndingHandleDigits:
                      type: integer
                      description: >-
                        The number of digits in the email handle that are not at
                        the end of the handle.
                      example: 3
                    handleTypingDistance:
                      type: number
                      description: >-
                        A measure of how much distance exists between the
                        subsequent keys used to type the email handle on a
                        QWERTY keyboard.
                      example: 2.943
                    countUniqueEducationInstitutes:
                      type: integer
                      description: >-
                        The number of unique education institutes that the email
                        address is tied to.
                      example: 1
