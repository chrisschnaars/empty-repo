openapi: 3.1.0
info:
  title: Socure API Reference
  version: 1.0.0
  license:
    name: Socure Proprietary
  contact:
    name: Socure Support
    url: https://www.socure.com/support
  description: >-
    Real-time, modular REST API for identity verification and fraud prediction.
    For setup and integration guides, see the [ID+
    documentation](https://help.socure.com/idplus/docs).
servers:
  - description: Production
    url: https://service.socure.com
  - description: Sandbox
    url: https://sandbox.socure.com
security:
  - SocureApiKey: []
tags:
  - name: ID+
    description: >
      ID+ is the primary endpoint of the Socure API. The `modules` parameter in
      the request body determines which ID+ services are called.
  - name: Predictive Document Verification
    description: >
      Predictive Document Verification (DocV) confirms the authenticity of a
      government-issued ID, matches the Personal Identifiable Information (PII)
      extracted from the ID against the input information, and matches the ID
      headshot to a consumer-submitted selfie using facial biometric analysis.

      The DocV APIs in this section allow you to integrate DocV services into
      your application.
  - name: One-Time Passcode Verification
    description: >
      The One-Time Passcode Verification APIs allow you to securely verify user
      identities.
  - name: Reason Code
    description: >
      Reason Codes are a series of alphanumeric codes returned by the ID+
      endpoint that help explain what predictors were used to determine a score.
  - name: Transaction Details
    description: >
      The Transaction Details API allows you to use the reference ID of a
      previous transaction to view response data.

      **Note**: The Transaction Details API is only available in the
      Certification and Production environments.
  - name: Feedback
    description: >
      The Feedback API allows you to send labeled transaction data in real-time.
      This information should be sent for all ID+ transactions when the
      following occurs:


      * The moment final application decisions are made.

      * The moment account status changes on the Fraud Outcome or Delinquency
      buckets.
  - name: Custom Watchlist
    description: >
      The Custom Watchlist API allows you to add, update, or remove records from
      a custom watchlist.
  - name: Events
    description: >
      The Events API allows you to manage webhook events for Global Watchlist
      and Predictive DocV transactions.
  - name: Webhooks
    description: >
      Webhooks allow you to receive real-time notifications when an event
      occurs. Details about the event are sent via 

      an HTTP `POST` request to the URL you specify.


      When you receive a new event, you must return a `200` HTTP status code. If
      you do not send a `200` response, Socure attempts to redeliver the event.
      After five failed attempts over two days, the event delivery is marked as
      a failure and the webhook is disabled.

      **Note**: For auto-enrolled transactions, Socure attempts to redeliver the
      notification until it is successfully received.
  - name: Webhook Secret Key
    description: >-
      A webhook secret key is a user-defined token that allows you to verify
      that events sent to your endpoint are legitimate. Secret keys are
      configured at the account-level and apply to all environments. Only one
      secret key can be active at a time per subscription type.
paths:
  /api/3.0/EmailAuthScore:
    servers:
      - description: Production
        url: https://service.socure.com
      - description: Certification
        url: https://service.socure.com
      - description: Sandbox
        url: https://sandbox.socure.com
    post:
      operationId: ID+
      summary: Create a transaction
      description: >-
        Evaluates the consumer's PII using the ID+ modules specified in the
        `modules` parameter.
      tags:
        - ID+
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/AccountIntelligence'
                - $ref: '#/components/schemas/AccountIntelligencePremier'
                - $ref: '#/components/schemas/AddressRisk'
                - $ref: '#/components/schemas/AlertList'
                - $ref: '#/components/schemas/DeceasedCheck'
                - $ref: '#/components/schemas/Decision'
                - $ref: '#/components/schemas/SigmaDevice'
                - $ref: '#/components/schemas/DigitalIntelligence'
                - $ref: '#/components/schemas/eCBSV'
                - $ref: '#/components/schemas/EmailRisk'
                - $ref: '#/components/schemas/WatchlistStandard'
                - $ref: '#/components/schemas/WatchlistPlus'
                - $ref: '#/components/schemas/WatchlistPremier'
                - $ref: '#/components/schemas/GraphIntelligence'
                - $ref: '#/components/schemas/NegPosList'
                - $ref: '#/components/schemas/PhoneRisk'
                - $ref: '#/components/schemas/DocumentVerification'
                - $ref: '#/components/schemas/Prefill'
                - $ref: '#/components/schemas/SecondaryDocumentCapture'
                - $ref: '#/components/schemas/SelfieReverification'
                - $ref: '#/components/schemas/SigmaFirstPartyFraud'
                - $ref: '#/components/schemas/SigmaIdentityFraud'
                - $ref: '#/components/schemas/SigmaSyntheticFraud'
                - $ref: '#/components/schemas/KYC'
                - $ref: '#/components/schemas/KYCPlus'
            examples:
              Account Intelligence:
                $ref: '#/components/examples/AccountIntelligenceRequest'
              Account Intelligence Premier:
                $ref: '#/components/examples/AccountIntelligencePremierRequest'
              Address Risk:
                $ref: '#/components/examples/AddressRiskRequest'
              Alert List:
                $ref: '#/components/examples/AlertListRequest'
              Deceased Check:
                $ref: '#/components/examples/DeceasedCheckRequest'
              Decision:
                $ref: '#/components/examples/DecisionRequest'
              Device Risk:
                $ref: '#/components/examples/DeviceRiskRequest'
              Digital Intelligence:
                $ref: '#/components/examples/DigitalIntelligenceRequest'
              eCBSV:
                $ref: '#/components/examples/EcbsvRequest'
              Email Risk:
                $ref: '#/components/examples/EmailRiskRequest'
              First-Party Fraud:
                $ref: '#/components/examples/FirstPartyFraudRequest'
              Graph Intelligence:
                $ref: '#/components/examples/GraphIntelligenceRequest'
              KYC Plus:
                $ref: '#/components/examples/KYCPlusRequest'
              KYC:
                $ref: '#/components/examples/KYCRequest'
              Negative Positive List:
                $ref: '#/components/examples/NegativePostiveListRequest'
              Phone Risk:
                $ref: '#/components/examples/PhoneRiskRequest'
              Predictive DocV:
                $ref: '#/components/examples/PredictiveDocVRequest'
              Prefill:
                $ref: '#/components/examples/PrefillRequest'
              Secondary Document Capture:
                $ref: '#/components/examples/SecondaryDocumentCaptureRequest'
              Selfie Reverification:
                $ref: '#/components/examples/SelfieReverificationRequest'
              Sigma Identity Fraud:
                $ref: '#/components/examples/SigmaIdentityFraudRequest'
              Sigma Synthetic Fraud:
                $ref: '#/components/examples/SigmaSynethticeFraudRequest'
              Watchlist Plus:
                $ref: '#/components/examples/WatchlistPlusRequest'
              Watchlist Premier:
                $ref: '#/components/examples/WatchlistPremierRequest'
              Watchlist Standard:
                $ref: '#/components/examples/WatchlistStandardRequest'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AccountIntelligenceResponse'
                  - $ref: '#/components/schemas/AccountIntelligencePremierResponse'
                  - $ref: '#/components/schemas/AddressRiskResponse'
                  - $ref: '#/components/schemas/AlertListResponse'
                  - $ref: '#/components/schemas/DeceasedCheckResponse'
                  - $ref: '#/components/schemas/DecisionResponse'
                  - $ref: '#/components/schemas/SigmaDeviceResponse'
                  - $ref: '#/components/schemas/DigitalIntelligenceResponse'
                  - $ref: '#/components/schemas/eCBSVResponse'
                  - $ref: '#/components/schemas/EmailRiskResponse'
                  - $ref: '#/components/schemas/WatchlistStandardResponse'
                  - $ref: '#/components/schemas/WatchlistPlusResponse'
                  - $ref: '#/components/schemas/WatchlistPremierResponse'
                  - $ref: '#/components/schemas/GraphIntelligenceResponse'
                  - $ref: '#/components/schemas/NegPosListResponse'
                  - $ref: '#/components/schemas/PhoneRiskResponse'
                  - $ref: '#/components/schemas/DocVResponse'
                  - $ref: '#/components/schemas/PrefillResponse'
                  - $ref: '#/components/schemas/AdvancedPrefillResponse'
                  - $ref: '#/components/schemas/SecondaryDocumentCaptureResponse'
                  - $ref: '#/components/schemas/SelfieReverificationResponse'
                  - $ref: '#/components/schemas/SigmaFirstPartyFraudResponse'
                  - $ref: '#/components/schemas/SigmaIdentityFraudResponse'
                  - $ref: '#/components/schemas/SigmaSyntheticFraudResponse'
                  - $ref: '#/components/schemas/KYCResponse'
                  - $ref: '#/components/schemas/KYCPlusResponse'
              examples:
                Account Intelligence:
                  $ref: '#/components/examples/AccountIntelligenceResponse'
                Account Intelligence Premier:
                  $ref: '#/components/examples/AccountIntelligencePremierResponse'
                Address Risk:
                  $ref: '#/components/examples/AddressRiskResponse'
                Alert List:
                  $ref: '#/components/examples/AlertListResponse'
                Deceased Check:
                  $ref: '#/components/examples/DeceasedCheckResponse'
                Decision:
                  $ref: '#/components/examples/DecisionResponse'
                Device Risk:
                  $ref: '#/components/examples/DeviceRiskResponse'
                Digital Intelligence:
                  $ref: '#/components/examples/DigitalIntelligenceResponse'
                eCBSV:
                  $ref: '#/components/examples/EcbsvResponse'
                Email Risk:
                  $ref: '#/components/examples/EmailRiskResponse'
                First-Party Fraud:
                  $ref: '#/components/examples/FirstPartyFraudResponse'
                Graph Intelligence:
                  $ref: '#/components/examples/GraphIntelligenceResponse'
                KYC Plus:
                  $ref: '#/components/examples/KYCPlusResponse'
                KYC:
                  $ref: '#/components/examples/KYCResponse'
                Negative Positive List:
                  $ref: '#/components/examples/NegativePostiveListResponse'
                Phone Risk:
                  $ref: '#/components/examples/PhoneRiskResponse'
                Predictive DocV:
                  $ref: '#/components/examples/PredictiveDocVResponse'
                Prefill:
                  $ref: '#/components/examples/PrefillResponse'
                Secondary Document Capture:
                  $ref: '#/components/examples/SecondaryDocumentCaptureResponse'
                Selfie Reverification:
                  $ref: '#/components/examples/SelfieReverificationResponse'
                Sigma Identity Fraud:
                  $ref: '#/components/examples/SigmaIdentityFraudResponse'
                Sigma Synthetic Fraud:
                  $ref: '#/components/examples/SigmaSynethticeFraudResponse'
                Watchlist Plus:
                  $ref: '#/components/examples/WatchlistPlusResponse'
                Watchlist Premier:
                  $ref: '#/components/examples/WatchlistPremierResponse'
                Watchlist Standard:
                  $ref: '#/components/examples/WatchlistStandardResponse'
        '400':
          description: Bad Request - The request was invalid or cannot be otherwise served.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error400-missingParameters'
                  - $ref: '#/components/schemas/Error400-missingPermissions'
                  - $ref: '#/components/schemas/Error400-missingModules'
        '401':
          description: Unauthorized - No valid API key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Access denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error403-invalidKey'
                  - $ref: '#/components/schemas/Error403-invalidDomain'
        '404':
          description: Not Found - The requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '429':
          description: Too Many Requests - Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
  /api/1.0/watchlist/custom/data:
    post:
      operationId: UpdateCustomWatchlist
      summary: Update a custom watchlist
      description: Adds, updates, or removes records from a custom watchlist.
      tags:
        - Custom Watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomWatchlist'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCustomWatchlistResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/3.0/reasoncodes:
    get:
      operationId: ReasonCodes
      summary: List all reason codes
      description: Returns every reason code in ID+, optionally grouped by module.
      parameters:
        - name: group
          in: query
          description: Group reason codes by module.
          schema:
            type: boolean
          example: true
      tags:
        - Reason Code
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonCodesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/3.0/transaction:
    servers:
      - description: Production
        url: https://service.socure.com
    get:
      operationId: getTransactionDetails
      summary: Retrieve a transaction
      description: Returns the full response payload for a completed transaction.
      parameters:
        - name: referenceId
          in: query
          required: true
          description: >-
            The `referenceId` parameter returned in the API response of a
            completed transaction.
          schema:
            type: string
            format: uuid
      tags:
        - Transaction Details
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/5.0/documents/request:
    servers:
      - description: Production
        url: https://service.socure.com
      - description: Certification
        url: https://service.socure.com
      - description: Sandbox
        url: https://service.socure.com
    post:
      operationId: DocumentRequestV5
      summary: Document Request endpoint version 5
      description: >-
        Generates a session URL that launches the Capture App for document
        capture.
      tags:
        - Predictive Document Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequestEndpointV5'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRequestResponseV5'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ImageRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/3.0/documents/request:
    servers:
      - description: Production
        url: https://service.socure.com
      - description: Certification
        url: https://service.socure.com
      - description: Sandbox
        url: https://service.socure.com
    post:
      operationId: DocumentRequestV3
      summary: Document Request endpoint version 3
      description: >-
        **Deprecated.** Use the [v5
        endpoint](/docs/document-request_endpoints-and-apis) instead.
      tags:
        - Predictive Document Verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRequestEndpointV3'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRequestResponseV3'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ImageRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/5.0/documents/{referenceId}:
    servers:
      - description: Production
        url: https://upload.socure.com
    get:
      operationId: ImageRequestV5
      summary: Image Request endpoint version 5
      description: Returns a ZIP file of the consumer's uploaded ID and selfie images.
      parameters:
        - name: referenceId
          in: path
          required: true
          description: >-
            The unique reference ID for the DocV transaction. Retrieve this
            value from the ID+ API response after you call the Predictive
            Document Verification module.
          schema:
            type: string
          example: 8bef03f4-92be-4c5c-9fd7-87ff5efbe1fc
        - name: type
          in: query
          description: >-
            Returns the specified image only. If omitted, the API returns all
            images.
          schema:
            type: string
            enum:
              - documentfront
              - documentback
              - profileimage
      tags:
        - Predictive Document Verification
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ImageRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401ImageRequest'
  /api/3.0/documents/{uuid}:
    servers:
      - description: Production
        url: https://upload.socure.com
    get:
      operationId: ImageRequestV3
      summary: Image Request endpoint version 3
      description: >-
        **Deprecated.** Use the [v5 endpoint](/docs/image_request_endpoint)
        instead.
      parameters:
        - name: uuid
          in: path
          required: true
          description: >-
            The unique identifier associated with the uploaded images. The
            ``uuid`` is returned in the response when you upload an ID using the
            Document Upload endpoint.
          schema:
            type: string
          example: 123ab45d-5e07-4813-be6c-6bd3b602371a
        - name: imagequality
          in: query
          description: >
            The quality of the retrieved images.


            The API returns the original images by default. Specify
            ``optimized`` to retrieve copies of the images that are compressed
            to a smaller file size. Only images above 650 DPI are optimized.


            > **Note**: Retrieve the original images for best results.
          schema:
            type: string
            enum:
              - original
              - optimized
            default: original
        - name: type
          in: query
          description: >-
            Returns the specified image only. If omitted, the API returns all
            images.
          schema:
            type: string
            enum:
              - documentfront
              - documentback
              - profileimage
      tags:
        - Predictive Document Verification
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400ImageRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401ImageRequest'
  /api/5.0/documents/expiresession:
    servers:
      - description: Production
        url: https://service.socure.com
    post:
      operationId: ExpireSession
      summary: Expire a DocV session
      description: >-
        Invalidates the transaction token so no further document captures can
        occur.
      tags:
        - Predictive Document Verification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                docvTransactionToken:
                  type: string
                  format: uuid
                  description: >
                    The transaction token retrieved from the API response of the
                    Document Request endpoint v5.
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  referenceId:
                    type: string
                    format: uuid
                    maxLength: 36
                    minLength: 36
                    description: A unique reference ID for the transaction.
                    example: 7b3c2c04-0e7e-46e4-afe8-b905cdf91833
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error400-invalidToken'
                  - $ref: '#/components/schemas/Error400-tokenExpired'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/1.0/otp/send:
    servers:
      - description: Production
        url: https://service.socure.com
    post:
      operationId: OtpSend
      summary: Send a one-time passcode
      description: Delivers a verification code via SMS, voice, or email.
      tags:
        - One-Time Passcode Verification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - destination
                - channel
              properties:
                destination:
                  description: >-
                    The user's phone number (E.164 format) or email address
                    where the OTP is sent. International phone numbers are
                    supported.
                  type: string
                  example: '+15034700244'
                channel:
                  description: >-
                    The delivery method, which can be `sms`, `voice`, or
                    `email`.
                  type: string
                  enum:
                    - sms
                    - voice
                    - email
                  example: sms
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSendResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/1.0/otp/verify:
    servers:
      - description: Production
        url: https://service.socure.com
    post:
      operationId: OtpVerify
      summary: Verify a one-time passcode
      description: Verify the one-time passcode entered by the user.
      tags:
        - One-Time Passcode Verification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationId
                - otp
              properties:
                verificationId:
                  description: >-
                    The unique identifier returned from the OTP send request.
                    This connects the verification attempt to the specific OTP
                    that was sent.
                  type: string
                  example: '+15034700244'
                otp:
                  description: >-
                    The 6-digit numerical code entered by the user. This should
                    be the exact code received by the user via SMS, voice, or
                    email.
                  type: string
                  example: '123456'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /api/1.0/feedback:
    post:
      operationId: Feedback
      summary: Submit feedback
      description: >-
        Sends labeled transaction data for application decisions or account
        status changes.
      tags:
        - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/FeedbackRequestSAI'
                - $ref: '#/components/schemas/FeedbackRequestDeviceRisk'
                - $ref: '#/components/schemas/FeedbackRequestDocV'
                - $ref: '#/components/schemas/FeedbackRequestFraud'
                - $ref: '#/components/schemas/FeedbackRequestKYC'
                - $ref: '#/components/schemas/FeedbackRequestSynthetic'
            examples:
              Account Intelligence:
                $ref: '#/components/examples/FeedbackAccountIntelligenceRequest'
              Device Risk:
                $ref: '#/components/examples/FeedbackDeviceRiskRequest'
              Predictive DocV:
                $ref: '#/components/examples/FeedbackDocVRequest'
              Sigma Identity Fraud:
                $ref: '#/components/examples/FeedbackFraudRequest'
              Socure Verify (KYC):
                $ref: '#/components/examples/FeedbackKYCRequest'
              Sigma Synthetic:
                $ref: '#/components/examples/FeedbackSyntheticRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
              examples:
                Account Intelligence:
                  $ref: '#/components/examples/FeedbackAccountIntelligenceResponse'
                Device Risk:
                  $ref: '#/components/examples/FeedbackDeviceRiskResponse'
                Predictive DocV:
                  $ref: '#/components/examples/FeedbackDocVResponse'
                Sigma Identity Fraud:
                  $ref: '#/components/examples/FeedbackFraudResponse'
                Socure Verify (KYC):
                  $ref: '#/components/examples/FeedbackKYCResponse'
                Sigma Synthetic:
                  $ref: '#/components/examples/FeedbackSyntheticResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
  /events/key:
    servers:
      - description: Production
        url: https://service.socure.com/api
      - description: Sandbox
        url: https://sandbox.socure.com/api/3.0
    post:
      operationId: WebhookSecretKey
      summary: Create a webhook secret key
      description: >-
        Adds a secret key for verifying that webhook events sent to your
        endpoint are legitimate.
      tags:
        - Webhook Secret Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSecretKey'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEventsResponse'
        '401':
          description: Unauthorized
  /events:
    servers:
      - description: Production
        url: https://service.socure.com/api/3.0/events
      - description: Sandbox
        url: https://sandbox.socure.com/api/3.0/events
    post:
      operationId: WatchlistManage
      summary: Manage watchlist monitoring
      description: >-
        Subscribe, unsubscribe, suppress, or unsuppress entity matches for a
        transaction.
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/WatchlistSubscribe'
                - $ref: '#/components/schemas/WatchlistUnsubscribe'
                - $ref: '#/components/schemas/WatchlistSuppress'
                - $ref: '#/components/schemas/WatchlistUnsuppress'
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEventsResponse'
        '401':
          description: Unauthorized
    get:
      operationId: GetWatchlist
      summary: Retrieve watchlist details
      description: >-
        Returns monitoring status, active subscriptions, or transaction snapshot
        data for Global Watchlist transactions.
      parameters:
        - name: filters
          in: query
          schema:
            type: object
            oneOf:
              - $ref: '#/components/schemas/WatchlistSubscriptionStatus'
              - $ref: '#/components/schemas/WatchlistActiveSubscriptions'
              - $ref: '#/components/schemas/TransactionSnapshotWatchlist'
      tags:
        - Events
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WatchlistSubscriptionStatusResponse'
                  - $ref: '#/components/schemas/WatchlistAllSubscriptionsResponse'
                  - $ref: '#/components/schemas/WatchlistTransactionSnapshot'
        '401':
          description: Unauthorized
  /api/events:
    servers:
      - description: Production
        url: https://service.socure.com
    get:
      operationId: RetrieveDocVTransactionDetails
      summary: Retrieve DocV transaction events
      description: >-
        Returns event details and snapshot data for a DocV Web SDK or Document
        Request transaction.
      parameters:
        - name: referenceId
          in: query
          schema:
            type: string
          required: true
          description: The reference ID of the DocV transaction.
          example: 5d3249b4-0c0f-4fb8-a655-8fdc8982906d
        - name: subscriptionType
          in: query
          schema:
            type: string
          required: true
          description: The subscription type.
          example: documentverification
        - name: snapshot
          in: query
          schema:
            type: boolean
          required: true
          description: Indicates whether to return snapshot details for the transaction.
          example: true
      tags:
        - Events
      security:
        - SocureApiKey: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocVTransactionSnapshot'
        '401':
          description: Unauthorized
webhooks:
  watchlist:
    post:
      operationId: WatchlistEvent
      summary: New Watchlist Event
      security: []
      description: >
        A new event is observed for a monitored transaction, such as the
        addition or removal of a person or non-person entity from a sanctions
        list.
      tags:
        - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistEvent'
            examples:
              SearchUpdated:
                summary: Watchlist Monitored Search Updated
                value:
                  data:
                    referenceId: c9b1dab6-4ffd-49f4-ba02-c5f517ef00fb
                    success: true
                    message: string
      responses:
        '200':
          description: Success
