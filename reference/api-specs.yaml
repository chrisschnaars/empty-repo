    NegPosListResponse:
      title: Negative Positive List
      description: >
        Returns the corresponding reason code that indicates the current
        classification of the input unique data elements in the
        Negative/Positive List.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        negPosList:
          description: >-
            Contains the corresponding reason code that indicates the current
            classification of the input unique data elements in the
            Negative/Positive List. If the elements are not found in the
            Negative/Positive List, no reason code will be returned.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for the input unique data elements.
              type: array
              items:
                type: string
              example:
                - R142
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    PhoneRiskResponse:
      title: Phone Risk
      description: |
        Returns phone risk and correlation scores. Conditional parameters are
        mobileNumber.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        namePhoneCorrelation:
          description: Contains the phone correlation value and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I123
                - I456
                - I789
            score:
              description: >-
                Indicates the strength of the relationship between the phone
                number and the consumer's `firstName` and `surName`.
              type: number
              example: 0.9984
        phoneRisk:
          description: Contains the phone risk score and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I123
                - I456
                - I699
            score:
              description: >-
                The primary phone risk score. A higher score indicates a greater
                likelihood of fraud. Values range from 0.0 to 1.0.
              type: number
              example: 0.324
            scores:
              description: A list of risk scores for this transaction.
              type: array
              items:
                type: object
                properties:
                  name:
                    description: The risk module's name.
                    type: string
                    example: Phone Risk Model (US) Norm
                  version:
                    description: The risk module's version.
                    type: string
                    example: '7.0'
                  score:
                    description: >-
                      Represents the level of risk associated with a phone
                      number. A higher score indicates a greater likelihood of
                      fraud.
                    type: number
                    example: 0.324
            signals:
              type: object
              description: Signals returned by the Phone Risk product.
              properties:
                phone:
                  type: object
                  description: The `phone` primary key.
                  properties:
                    carrier:
                      type: string
                      description: Name of the carrier serving the phone number.
                      example: at&t
                    lineType:
                      type: string
                      description: >-
                        The type of phone line behind this phone number, e.g.
                        "landline" or "wireless".
                      example: wireless
                    areaCodeState:
                      type: string
                      description: >-
                        The state that ties to the phone number based on the
                        phone area code.
                      example: ny
                    areaCodeCities:
                      type: array
                      description: >-
                        The cities that tie to the phone number's area code.
                        Ordered alphabetically.
                      items:
                        type: string
                      example:
                        - white plains
                        - yonkers
                    country:
                      type: string
                      description: The country of the phone number.
                      example: us
                    perplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        non-sensical patterns; range 0.0–1.0.
                      example: 0.748
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the phone number matches a list of commonly used
                        filler values.
                      example: false
                    countUniqueFirstNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique first names tied to the phone number in
                        credit header data.
                      example: 2
                    countUniqueLastNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique last names tied to the phone number in
                        credit header data.
                      example: 1
                    countUniqueMiddleNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique middle names tied to the phone number
                        in credit header data.
                      example: 0
                    countUniqueNationalIdCreditHeader:
                      type: integer
                      description: >-
                        Number of unique national IDs tied to the phone number
                        in credit header data.
                      example: 2
                    countActiveMilitaryCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        assigned to active-military members.
                      example: 3
                    countActiveMilitaryExtendedFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        assigned to active-military members and flagged as
                        having extended fraud alerts.
                      example: 0
                    countActiveMilitaryInitialFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        assigned to active-military members and flagged as
                        having initial fraud alerts.
                      example: 1
                    countExtendedFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        flagged as having extended fraud alerts.
                      example: 1
                    countInitialFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        flagged as having initial fraud alerts.
                      example: 1
                    countInquiryRecords:
                      type: integer
                      description: Number of inquiry data records tied to the phone number.
                      example: 6
                    timeBetweenInquiriesAverage:
                      type: integer
                      description: >-
                        Average time period (in days) between inquiry records
                        associated with the phone number.
                      example: 189
                    timeBetweenInquiriesMax:
                      type: integer
                      description: >-
                        Longest time period (in days) between inquiry records
                        associated with the phone number.
                      example: 412
                    timeBetweenInquiriesMin:
                      type: integer
                      description: >-
                        Shortest time period (in days) between inquiry records
                        associated with the phone number.
                      example: 15
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    DigitalIntelligenceObjectResponse:
      description: >
        Contains additional information about the request.

        > **Note:** All DocV v5 integrations include the `digitalIntelligence`
        object in the response.
      type: object
      properties:
        device:
          type: object
          description: Contains device data.
          properties:
            id:
              type: string
              description: Unique UUID for the device.
              example: 234ac3ff-3ed1-42de-8f33-8f332febfa54
            sessionCreatedAt:
              type: string
              format: date-time
              description: The time at which the session was created
              example: '2024-12-23T18:06:52.248985937Z'
            deviceCaptureAt:
              type: string
              format: date-time
              description: >
                The time at which device metadata was captured. If multiple
                captures were made against the 

                given session, this is the most recent timestamp.
              example: '2024-12-23T18:09:12.735992851Z'
            computed:
              $ref: '#/components/schemas/DeviceComputed'
            network:
              type: object
              description: Contains device network attributes.
              properties:
                connectionIp:
                  type: string
                  description: >-
                    The IP address detected by the connection to the ingestion
                    service.
                  example: 38.48.122.126
                forwardedForIps:
                  type: array
                  items:
                    type: string
                  description: >-
                    The collection of IP addresses in the `X-Forwarded-For`
                    header during the ingestion request.
                  example:
                    - 78.32.11.221
                    - 70.45.2.1
                webRtcPublicIp:
                  type: string
                  description: >-
                    The public facing IP address as detected by WebRTC when
                    available.
                  example: 176.124.54.12
                webRtcInternalIp:
                  type: string
                  description: >-
                    The internal facing IP address as detected by WebRTC when
                    available.
                  example: 192.168.1.85
                realIp:
                  type: string
                  description: >-
                    Real IP address detected in association with the lastSeen
                    time. This address is computed to be the most specific
                    address associated with the user. All attributes are
                    relative to this address.
                  example: 38.48.122.126
                isTor:
                  type: boolean
                  description: Set to `true` if the IP is a TOR exit node.
                isProxy:
                  type: boolean
                  description: Set to `true` if a Proxy is detected.
                isVpn:
                  type: boolean
                  description: >-
                    Set to `true` if the device appears to be connected via a
                    VPN.
                isConsumerPrivacy:
                  type: boolean
                  description: >-
                    Set to `true` if the device is detected to be using a
                    consumer privacy relay such as iCloud Private Relay or
                    Google One VPN.
                isRiskyNetwork:
                  type: boolean
                  description: >-
                    Set to `true` if the device appears to be associated with a
                    known high-risk IP address or IP block. The value is
                    computed by Socure based on proprietary methods.
                isp:
                  type: string
                  description: >-
                    Name of the Internet Service Provider associated with the IP
                    address.
                  example: comcast
                ispType:
                  type: string
                  description: >-
                    Returns the type of ISP connection. Possible values can be
                    'home' or 'business'.
                  example: home
                asn:
                  type: integer
                  description: Unique ASN (Autonomous System Numbers) identifier.
                  example: 27364
                asnName:
                  type: string
                  description: Name associated to the ASN identifier.
                  example: armstrong
                domainName:
                  type: string
                  description: Domain name associated with the IP address.
                  example: zoominternet.net
                org:
                  type: string
                  description: Name of the organization associated with the IP address.
                  example: comcast
                isMobileCarrier:
                  type: boolean
                  description: >-
                    Set to `true` if IP appears to be associated with a mobile
                    carrier.
                speed:
                  type: string
                  description: Provides connection type and speed information.
                  example: cable
                networkLocation:
                  type: object
                  required:
                    - countryCode
                  properties:
                    countryCode:
                      type: string
                      description: ISO 3166-1 alpha-2 country code.
                      example: US
                      minLength: 2
                      maxLength: 2
                    region:
                      type: string
                      description: State, Province, or Region 2 Char code.
                      example: WA
                    city:
                      type: string
                      description: City Name
                      example: Tacoma
                    postalCode:
                      type: string
                      description: Postal or ZIP code.
                      example: '98401'
                    latitude:
                      type: number
                      format: float
                      description: Latitude
                      example: 47.2529001
                    longitude:
                      type: number
                      format: float
                      description: Longitude
                      example: -122.4443
                    metroCode:
                      type: integer
                      description: Metro Code
                      example: 819
                    continentCode:
                      type: string
                      description: ISO 2 Char (ISO-3166) Continent Codes.
                      example: na
                    timezoneName:
                      type: string
                      description: >-
                        The unique name of the timezone in the form
                        "Area/Location".
                      example: America/New_York
                    gmtOffset:
                      type: string
                      description: >-
                        The UTC offset is the difference in hours and minutes
                        between Coordinated Universal Time (UTC) and local solar
                        time, at a particular place. This difference is
                        expressed with respect to UTC and is generally shown in
                        the format ±[hh]:[mm], ±[hh][mm], or ±[hh].
                      example: '-0400'
            attributes:
              type: object
              description: Contains device attribute data.
              properties:
                sdkVersion:
                  type: string
                  description: The version of the Socure SDK reporting the data.
                  example: 3.0.1
                platform:
                  type: string
                  enum:
                    - Android
                    - iOS
                    - Web
                  description: The SDK platform used to create the platform.
                  example: iOS
                os:
                  type: string
                  description: The operating system in use.
                  example: iOS
                osVersion:
                  type: string
                  description: The version of the operating system in use.
                  example: '17.0'
                deviceModel:
                  type: string
                  description: The model of the device being used.
                  example: iphone14,7
                deviceManufacturer:
                  type: string
                  description: The manufacturer of the device.
                  example: Apple
                deviceType:
                  type: string
                  description: The format of the device being used.
                  example: tablet
                viewportWidth:
                  type: number
                  description: >-
                    The logical width of the viewport on native devices and the
                    logical innerWidth of the window on web.
                  example: 600
                viewportHeight:
                  type: number
                  description: >-
                    The logical height of the viewport on native devices and the
                    logical innerHeight of the window on web.
                  example: 400
                screenHeight:
                  type: number
                  description: The logical height of the screen.
                  example: 1080
                screenWidth:
                  type: number
                  description: The logical width of the screen.
                  example: 1920
                devicePixelRatio:
                  type: number
                  description: >-
                    The number of physical pixels for each logical pixel on the
                    screen.
                  example: 1.5
                network:
                  type: object
                  description: >
                    General network information about the device. Note that this
                    is different from the mobile network cellular information
                    contained in `mobileNetwork`.
                  properties:
                    vpnStatus:
                      type: boolean
                      description: >-
                        true if the vpn is enabled, false otherwise. Note that
                        is value is not available for web.
                      example: true
                location:
                  type: object
                  description: >-
                    The GPS coordinates of the device as reported by the devices
                    location services.
                  properties:
                    latitude:
                      type: number
                      description: The latitude of the location in degrees.
                      example: 41.50854591662628
                    longitude:
                      type: number
                      description: The longitude of the location in degrees.
                      example: -81.69534315646631
                    horizontalAccuracy:
                      type: number
                      description: >-
                        The radius of uncertainty of the reported location in
                        meters.
                      example: 2.1
                    altitude:
                      type: number
                      description: The altitude above the WGS 84 ellipsoid in meters.
                      example: 998.2
                    verticalAccuracy:
                      type: number
                      description: The accuracy of the reported altitude in meters.
                    bearing:
                      type: number
                      description: The bearing of the device in degrees.
                      example: 32
                    bearingAccuracy:
                      type: number
                      description: >-
                        The accuracy of the reported bearing in degrees. Not
                        reported on web.
                      example: 2.1
                    speed:
                      type: number
                      description: The speed of the device in meters per second.
                      example: 1.3
                    speedAccuracy:
                      type: number
                      description: >-
                        The accuracy of the reported speed in meters per second.
                        Not reported on web.
                      example: 0.2
                battery:
                  type: object
                  description: Information regarding the battery for the device.
                  properties:
                    batteryState:
                      type: string
                      enum:
                        - charging
                        - unplugged
                        - full
                        - unknown
                      description: >
                        The charging status for the battery. Definitions map
                        directly to
                        https://developer.apple.com/documentation/uikit/uidevice/batterystate
                      example: charging
                    batteryLevel:
                      type: number
                      description: >-
                        The level of the battery charge with 0 being empty and 1
                        being full.
                      example: 0.47
                timeZone:
                  type: string
                  description: The name of the time zone the device is set to.
                  example: America/New_York
                timeZoneOffset:
                  type: number
                  description: >-
                    The number of minutes the device is offset from the UTC time
                    zone.
                  example: -480
                language:
                  type: string
                  description: >-
                    The primary language configured for the device, formatted as
                    a BCP 47 language tag. On Android and web, the value
                    conforms to BCP 47 unless the device has been tampered with;
                    on iOS it follows the same format but may not pass strict
                    parsers. Casing can vary by browser and version, so parse
                    the value case-insensitively.
                  example: en-US
                deviceArchitecture:
                  type: string
                  description: |
                    Describes the architecture of the device.
                  example: arm64
                applicationType:
                  type: string
                  enum:
                    - native
                    - react
                    - reactNative
                    - flutter
                    - unknown
                  description: Corresponds to the type of application that uses the SDK.
                  example: native
                isEmulator:
                  type: boolean
                  description: Set to `true` if the device is detected to be an emulator.
                  example: true
                deviceContext:
                  type: string
                  description: >-
                    Corresponds to the context passed into `processDevice(...)`
                    in the SDK. Expected possible values from `deviceContext`
                    include `homepage`, `signup`, `login`, `password`,
                    `checkout`, `profile`, `transaction` or any custom value the
                    customer may provide. Value of `default` is used on
                    initialization and is `unknown` if a value isn't passed to
                    `processDevice(...)`.
                  example: homepage
                androidAttributes:
                  type: object
                  description: Android specific attributes.
                  properties:
                    isRooted:
                      type: boolean
                      description: >-
                        Set to `true` if the device is detected to have been
                        rooted.
                      example: true
                    mobileNetwork:
                      type: array
                      description: >-
                        Contains the cellular network info for a single or dual
                        sim device.
                      items:
                        type: string
                        example: T-Mobile
                iOSAttributes:
                  type: object
                  description: iOS specific attributes.
                  properties:
                    isRooted:
                      type: boolean
                      description: >-
                        Set to `true` if the device is detected to have been
                        jailbroken.
                      example: true
                    mobileNetwork:
                      type: array
                      description: >-
                        Contains the cellular network info for a single or dual
                        sim device.
                      items:
                        type: string
                        example: T-Mobile
                webAttributes:
                  type: object
                  description: Web specific attributes
                  properties:
                    userAgent:
                      type: string
                      description: The userAgent being used to make the request.
                      example: >-
                        Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)
                        AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/21A5291h
                        [FBAN/FBIOS;FBDV/iPhone15,3;FBMD/iPhone;FBSN/iOS;FBSV/17.0;FBSS/3;FBID/phone;FBLC/fr_FR;FBOP/5]
                    userAgentExtractionRequired:
                      type: boolean
                      description: >-
                        If true, User Agent Client Hints were not available and
                        the device information had to be extracted from the User
                        Agent, therefore it may be less precise. Extracted
                        fields are the following: `os`, `osVersion`,
                        `deviceModel`, `deviceManufacturer`
                      example: true
                    browser:
                      type: string
                      description: The browser being used to make the request.
                      example: Google Chrome
                    browserVersion:
                      type: string
                      description: >-
                        The version of the browser being used to make the
                        request.
                      example: '116'
                    pixelDepth:
                      type: number
                      description: The bit depth of the screen.
                      example: 24
                    hardwareConcurrency:
                      type: number
                      description: >-
                        The number of logical processors available to run
                        threads on the device.
                      example: 8
                    maxTouchPoints:
                      type: number
                      description: >-
                        The maximum number of touch points supported by the
                        device.
                      example: 1
                    colorDepth:
                      type: number
                      description: The color depth of the screen.
                      example: 24
                    webGlUnmaskedVendor:
                      type: string
                      description: The vendor string of the graphics driver.
                      example: Google Inc. (Apple)
                    webGlUnmaskedRenderer:
                      type: string
                      description: The renderer string of the graphics driver.
                      example: >-
                        ANGLE (Apple, ANGLE Metal Renderer: Apple M1 Pro,
                        Unspecified Version)
                    viewportScale:
                      type: number
                      description: >-
                        The pinch-zoom scaling factor applied to the visual
                        viewport.
                      example: 2.7
            history:
              type: object
              description: Object of historic data aggregated for the device profile.
              properties:
                firstSeen:
                  type: string
                  format: date-time
                  description: The time the device profile was first seen as an ISO Date.
                lastSeen:
                  type: string
                  format: date-time
                  description: The last time the device profile was seen as an ISO Date.
                ips:
                  type: array
                  description: >
                    Last 20 unique IPs, sorted from oldest to newest. Note if an
                    IP was observed multiple times then only the most recent
                    occurrence of the IP will be recorded.
                  example:
                    - 78.32.11.221
                    - 70.45.2.1
                  items:
                    type: string
                isps:
                  type: array
                  description: >-
                    Last 20 unique isps, sorted from oldest to newest. Note if
                    an isp was observed multiple times then only the most recent
                    occurrence of the isp will be recorded.
                  example:
                    - RogersCable
                    - T-Mobile
                  items:
                    type: string
                daysSeen:
                  type: array
                  description: >-
                    Dates corresponding to the last 20 times the device was
                    seen, sorted from oldest to newest. If a device was observed
                    multiple times during a day then only one record for the day
                    will be recorded.
                  items:
                    type: string
                    format: date
                networkLocations:
                  type: array
                  description: >
                    Last 20 unique city/region level location trail based on ip
                    geo data. Note if a location was  observed multiple times
                    then only the most recent occurrence of the location will be
                    recorded.
                  example:
                    - chicago, il
                    - new york, ny
                    - paris, fr
                  items:
                    type: string
              example:
                firstSeen: '2023-10-24T15:55:16.368Z'
                lastSeen: '2023-10-24T15:55:16.368Z'
                ips:
                  - 78.32.11.221
                  - 70.45.2.1
                isps:
                  - RogersCable
                  - T-Mobile
                daysSeen:
                  - '2023-10-24'
                networkLocations:
                  - chicago, il
                  - new york, ny
                  - paris, fr
        behavioral:
          type: object
          description: Contains behavioral aggregations from one session.
          properties:
            sessionId:
              type: string
              description: >-
                Session ID generated by Device utilized to identify a unique
                user session.
              example: d34304a6-a726-4dec-b1cd-9c4a3c192a0d
            serverCreated:
              type: string
              format: date-time
              description: >-
                The ISO datetime for when the server first processed an event
                for this session.
              example: '2021-09-01T11:19:58.796Z'
            serverUpdated:
              type: string
              format: date-time
              description: >-
                The ISO datetime for when the server last processed an event for
                this session.
              example: '2021-09-11T16:19:58.796Z'
            duration:
              type: integer
              description: The entire duration of the session in milliseconds.
              example: 120910
            source:
              type: string
              description: >-
                Where the user originated from when the session began also known
                as the referrer.
              example: https://example.com/
            aggregations:
              type: object
              description: Collection of aggregate counts for each event type.
              properties:
                totalEventCount:
                  type: integer
                  description: >-
                    The combined number of events that occurred during the
                    session.
                  example: 26
                focusCount:
                  type: integer
                  description: >-
                    The number of times a form field gained focus (became the
                    active element) during the session.
                blurCount:
                  type: integer
                  description: >-
                    The number of times a form field lost focus (no longer the
                    active element) during the session.
                  example: 3
                inputChangeCount:
                  type: integer
                  description: >-
                    The number of times the value of a form input field was
                    changed during the session.
                  example: 6
                submissionCount:
                  type: integer
                  description: >-
                    The number of times an HTML form was submitted during the
                    session. Only occurs on Web.
                  example: 1
                clickCount:
                  type: integer
                  description: >-
                    The number of times a form element was clicked during the
                    session.
                  example: 3
                pasteCount:
                  type: integer
                  description: >-
                    The number of times a value was pasted into a form field
                    during the session.
        latestNavigationContexts:
          type: array
          description: >-
            Contains a summary of behavioral data for the latest occurrence of
            each navigation context.
          items:
            $ref: '#/components/schemas/BehavioralNavigationContextSummary'
        entityProfiler:
          type: array
          items:
            $ref: '#/components/schemas/EntityProfile'
          example:
            - entity: '12223334444'
              entityType: phone
              profile:
                seenCount: 2
                firstSeen: '2019-08-24T14:15:22Z'
                lastSeen: '2019-08-24T14:15:22Z'
                deviceTypes:
                  - phone
                  - tablet
                deviceModels:
                  - iphone14,7
                  - GT70053G
                deviceIsps:
                  - comcast
                  - t-mobile
                deviceLanguages:
                  - en-us
                  - es-us
                deviceTimezones:
                  - america/new_york
                  - america/los_angeles
                networkLocationStates:
                  - ca
                  - az
                networkLocationPostalCodes:
                  - '12345'
                  - '56789'
            - entity: john@doe.com
              entityType: email
              profile:
                seenCount: 5
                firstSeen: '2020-09-10T10:22:45Z'
                lastSeen: '2020-09-15T13:45:32Z'
                deviceTypes:
                  - phone
                  - desktop
                deviceModels:
                  - moto g
                deviceIsps:
                  - at&t
                deviceLanguages:
                  - en-us
                deviceTimezones:
                  - america/los_angeles
                networkLocationStates:
                  - or
                networkLocationPostalCodes:
                  - '56789'
            - entity: '111223333'
              entityType: nationalId
              profile:
                seenCount: 3
                firstSeen: '2023-01-15T09:30:00Z'
                lastSeen: '2023-09-10T14:45:00Z'
                deviceTypes:
                  - phone
                  - tablet
                deviceModels:
                  - GT70053G
                deviceIsps:
                  - comcast
                deviceLanguages:
                  - de_us
                deviceTimezones:
                  - america/chicago
                networkLocationStates:
                  - il
                networkLocationPostalCodes:
                  - '12345'
        velocityMetrics:
          type: object
          description: >-
            Contains historical metrics based on the number of unique email
            addresses, phone numbers, first names, and surnames that have been
            included in API calls to ID+ with a given `deviceSessionId`.
          properties:
            historicalCount:
              type: object
              description: Historical metrics for the device.
              properties:
                firstName:
                  type: object
                  description: >-
                    Contains historical first name information associated with
                    the device.
                  properties:
                    uniqueCount:
                      type: integer
                      description: The number of unique first names seen with the device.
                      example: 1
                    uniqueSharePercent:
                      type: integer
                      description: >-
                        The percentage of transactions seen for this device that
                        match on the first name.
                      example: 100
                surName:
                  type: object
                  description: >-
                    Contains historical surname information associated with the
                    device.
                  properties:
                    uniqueCount:
                      type: integer
                      description: The number of unique surnames seen with the device.
                      example: 1
                    uniqueSharePercent:
                      type: integer
                      description: >-
                        The percentage of transactions seen for this device that
                        match on the surname.
                      example: 100
                email:
                  type: object
                  description: >-
                    Contains historical email information associated with the
                    device.
                  properties:
                    uniqueCount:
                      type: integer
                      description: The number of unique emails seen with the device.
                      example: 2
                    uniqueSharePercent:
                      type: integer
                      description: >-
                        The percentage of transactions seen for this device that
                        match on the email.
                      example: 87
                mobileNumber:
                  type: object
                  description: >-
                    Contains historical mobile number information associated
                    with the device.
                  properties:
                    uniqueCount:
                      type: integer
                      description: >-
                        The number of unique mobile numbers seen with the
                        device.
                      example: 1
                    uniqueSharePercent:
                      type: integer
                      description: >-
                        The percentage of transactions seen for this device that
                        match on the mobile number.
                      example: 100
    DocVObjectResponse:
      type: object
      description: Contains the ID+ response.
      properties:
        transactionGroupId:
          type: string
          example: 86f4a42e-04a7-5f12-c970-32b58dc31952
          format: uuid
          description: >-
            A unique identifier assigned to a Multiple Document Capture
            transaction. This ID helps in tracking and managing related document
            submissions as part of the same workflow.
        reasonCodes:
          description: A list of reason codes for this transaction.
          type: array
          items:
            type: string
          example:
            - I831
            - R810
        documentType:
          type: object
          description: Contains the ID type and its origin of issue.
          properties:
            type:
              type: string
              example: Drivers License
              description: >
                The type of document. Possible values include:

                - `Drivers License`

                - `Identification Card`

                - `Passport`

                - `Passport Card`

                - `Permanent Resident Card`

                - `Unknown`


                > **Note**: `Unknown` may be returned if the document cannot be
                classified due to poor image quality. 
            country:
              type: string
              example: USA
              description: The issuing country.
            state:
              type: string
              example: NY
              description: The issuing state.
        decision:
          type: object
          description: >-
            Contains the name of the account strategy used and the result of the
            verification tests.
          properties:
            name:
              type: string
              maxLength: 7
              description: The risk strategy for the verification.
              example: lenient
            value:
              type: string
              maxLength: 8
              description: >
                The result for the verification test. Possible values are:
                `accept`, `resubmit`, `review`, or

                `reject`.
              example: review
        documentData:
          type: object
          description: Contains the information extracted from the ID.
          properties:
            firstName:
              type: string
              example: Dwayne
              description: The first name extracted from the ID.
            surName:
              type: string
              example: Denver
              description: The last name extracted from the ID.
            fullName:
              type: string
              example: Dwayne Denver
              description: The full name extracted from the ID.
            address:
              type: string
              example: 123 Example Street, New York City, NY 10001
              description: The full address extracted from the ID.
            parsedAddress:
              type: object
              description: Contains the individual address fields extracted from the ID.
              properties:
                physicalAddress:
                  type: string
                  description: The street address extracted from the ID.
                  example: 123 Example Street
                physicalAddress2:
                  type: string
                  description: The city, state, and ZIP code extracted from the ID.
                  example: New York City NY 10001
                city:
                  type: string
                  description: The city extracted from the ID.
                  example: New York City
                state:
                  type: string
                  description: The state extracted from the ID.
                  example: NY
                country:
                  type: string
                  description: The country extracted from the ID.
                  example: US
                zip:
                  type: string
                  description: The postal code extracted from the ID.
                  example: '10001'
            documentNumber:
              type: string
              example: '000000000'
              description: The document number extracted from the ID.
            dob:
              type: string
              example: YYYY-MM-DD
              description: The date of birth extracted from the ID.
            issueDate:
              type: string
              maxLength: 10
              example: YYYY-MM-DD
              description: The issue date extracted from the ID.
            expirationDate:
              type: string
              maxLength: 10
              example: YYYY-MM-DD
              description: The expiration date extracted from the ID.
        digitalIntelligence:
          $ref: '#/components/schemas/DigitalIntelligenceObjectResponse'
    DocVResponse:
      title: Predictive Document Verification
      description: >
        In the Predictive Document Verification call, pass the UUID to the ID+
        API. The API will return a recommendation if the documents should be
        accepted as authentic. This section contains information about the
        Predictive Document Verification Module. 
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        previousReferenceId:
          type: string
          format: uuid
          maxLength: 36
          description: >-
            The `previousReferenceID` entered in the API request. Allows you to
            link multiple transactions together. See [Transaction
            Linkage](/docs/transaction_linkage) for more information.
          example: e9c170f2-b3e4-423b-a373-5d6e1e9b23f8
        documentVerification:
          $ref: '#/components/schemas/DocVObjectResponse'
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    PrefillResponse:
      title: Prefill
      type: object
      example:
        referenceId: 36ec3429-5bb1-4e37-9b82-cad5afdcc6ba
        prefill:
          socureId: 9f2fa139-c6e4-32cf-2f3c-19b6d89b579a
          firstName: Mayuri
          surName: Lai
          suffix: ''
          nationalId: '123001234'
          dob: '2004-02-27'
          mobileNumber: '+12065550123'
          aliases:
            - Mayuri Lai
            - Mayuri O Lai
            - Mayu Lai
          associatedAddresses:
            - streetAddress: 108 Smokerise Blvd
              city: Longwood
              state: FL
              zip: 32779-3315
              firstSeenDate: '2022-03-01'
          associatedPhoneNumbers:
            - phoneNumber: '+12063588927'
              firstSeenDate: '2010-03-01'
              lastSeenDate: '2023-05-08'
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        prefill:
          type: object
          description: >
            Contains the first five digits of the consumer's Social Security
            Number (SSN) or Tax Identification Number (ITIN).


            > **Note**: There are certain eligibility requirements to purchase
            the Prefill address feature enhancements

            > related to minimum total contract value and specific use cases.
          properties:
            socureId:
              type: string
              description: |
                A persistent unique identifier for the transaction.
              example: ab06216f-b88b-4be8-8075-933bb5c2303c
            firstName:
              type: string
              description: The consumer's first name.
              example: Mayuri
            surName:
              type: string
              description: The consumer's last name.
              example: Lai
            suffix:
              type: string
              description: >
                The suffix associated with the consumer’s name, such as "Jr.",
                "Sr.", "II", or "III". This field is optional and may be empty
                if no suffix is provided.
              example: Jr.
            dob:
              type: string
              format: YYYY-MM-DD, YYYYMMDD, YYYY/MM/DD
              description: |
                The consumer's date of birth.      
              example: '2004-02-27'
            nationalId:
              type: string
              description: >
                The national identification number of the consumer. In the U.S.,
                this is either the nine-digit Social Security Number (SSN) or
                the Individual Tax Identification Number (ITIN). For
                international consumers, this is their national ID.         
              example: '123001234'
            mobileNumber:
              type: string
              example: '+13475550100'
              description: |
                The consumer’s phone number.      
            aliases:
              type: array
              description: >
                A list of name variations or alternate names associated with the
                consumer. This may include nicknames, maiden names, middle names
                or initials, and other common variants used in records or
                identity sources.

                > **Note**: The `aliases` field reflects different names tied to
                the same identity based on available signals. In some cases,
                especially when only a phone number and name are provided, those
                signals may be weak or ambiguous. If you’re seeing very
                different names, it’s likely because the phone number has been
                used by more than one person over time. With limited input, we
                resolve to the best-matched identity, but historical data tied
                to that number may still surface as aliases. Our system always
                returns a single identity, but alias diversity is a reflection
                of real-world complexity in how identities evolve and overlap.
              items:
                type: string
              example:
                - Mayuri Lai
                - Mayuri O Lai
                - Mayu Lai
            associatedAddresses:
              type: array
              description: >
                A list of physical mailing addresses associated with the
                consumer. Includes the address details and the date each address
                was first seen. This field is always an array of objects, even
                when only one address is on file.
              items:
                type: object
                properties:
                  streetAddress:
                    type: string
                    description: >-
                      The street address, including house number and street
                      name.
                    example: 108 Smokerise Blvd
                  city:
                    type: string
                    description: The city in which the address is located.
                    example: Longwood
                  state:
                    type: string
                    description: The two-letter U.S. state abbreviation.
                    example: FL
                  zip:
                    type: string
                    description: The ZIP code or postal code for the address.
                    example: 32779-3315
                  county:
                    type: string
                    description: >-
                      The county associated with the best-matched entity’s
                      address.
                    example: US
                  firstSeenDate:
                    type: string
                    format: date
                    description: The date the address was first observed.
                    example: '2022-03-01'
                  lastSeenDate:
                    type: string
                    format: date
                    description: The timestamp of the most recent presentation of the data.
                    example: '2024-11-18'
                  isMatched:
                    type: boolean
                    description: >-
                      Indicates whether the address was matched to the
                      best-matched entity.
                    example: true
                  isLatest:
                    type: boolean
                    description: >-
                      Indicates whether this address is the most recent
                      (current) address associated with the best-matched entity.
                    example: false
            associatedPhoneNumbers:
              type: array
              description: >
                A list of phone numbers associated with the consumer, including
                when each number was first and most recently seen in available
                records.
              items:
                type: object
                properties:
                  phoneNumber:
                    type: string
                    description: The phone number in E.164 format, including country code.
                    example: '+12063588927'
                  firstSeenDate:
                    type: string
                    format: date
                    description: The date the phone number was first observed.
                    example: '2010-03-01'
                  lastSeenDate:
                    type: string
                    format: date
                    description: The timestamp of the most recent presentation of the data.
                    example: '2023-05-08'
                  isMatched:
                    type: boolean
                    description: >-
                      Indicates whether the phone number was matched to the
                      best-matched entity.
                    example: true
                  isLatest:
                    type: boolean
                    description: >-
                      Indicates whether this phone number is the most recent
                      (current) number associated with the best-matched entity.
                    example: true
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    AdvancedPrefillResponse:
      title: Advanced Prefill
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        prefill:
          type: object
          description: >
            Contains the first five digits of the consumer's Social Security
            Number (SSN) or Tax Identification Number (ITIN).


            > **Note**: There are certain eligibility requirements to purchase
            the Prefill address feature enhancements

            > related to minimum total contract value and specific use cases.
          properties:
            firstName:
              type: string
              description: The consumer’s first name.
              example: Dwayne
            middleName:
              type: string
              description: The consumer’s middle name.
              example: ''
            lastName:
              type: string
              description: The consumer’s last name.
              example: Denver
            suffix:
              type: string
              description: The suffix of the consumer.
              example: ''
            dob:
              type: string
              description: The consumer's date of birth.
              example: '1975-04-02'
            mobileNumber:
              type: string
              description: The consumer’s phone number.
              example: '+15034700244'
            aliases:
              type: array
              items:
                type: string
              description: Alternative names associated with the consumer.
              example:
                - Duane
            associatedPhoneNumbers:
              description: >
                Contains up to three prior phone numbers for the consumer, if
                available. 

                  Phone numbers are listed in reverse chronological order.
              type: array
              items:
                type: object
                properties:
                  phoneNumber:
                    type: string
                    description: A prior phone number associated with the consumer.
                    example: '+13475551234'
                  firstSeenDate:
                    type: string
                    description: The timestamp of the initial presentation of the data.
                    example: '2020-01-12'
                  lastSeenDate:
                    type: string
                    description: >-
                      The timestamp indicating the last presentation of the
                      data.
                    example: '2022-01-18'
            associatedAddresses:
              description: >
                Contains up to three prior addresses for the consumer, if
                available.

                Addresses are listed in reverse chronological order. This field
                is

                always an array of objects, even when only one address is on
                file.
              type: array
              items:
                type: object
                properties:
                  streetAddress:
                    type: string
                    description: >-
                      The street address associated with the consumer's prior
                      address.
                    example: 208 W University St
                  city:
                    type: string
                    description: The city associated with the consumer's prior address.
                    example: Brownsville
                  state:
                    type: string
                    description: The state associated with the consumer's prior address.
                    example: TN
                  zip:
                    type: string
                    description: The ZIP code associated with the consumer's prior address.
                    example: '38012'
                  firstSeenDate:
                    type: string
                    description: The timestamp of the initial presentation of the data.
                    example: '2020-01-01'
            associatedEmails:
              description: >
                Contains up to three email addresses for the consumer, if
                available. 
              type: array
              items:
                type: string
                example: dwayne.denver@hotmail.com
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    SecondaryDocumentCaptureResponse:
