    AccountIntelligenceResponse:
      title: Account Intelligence
      description: >
        Validates a bank account's availability and ownership. Conditional
        parameters are

        physicalAddress, city, state, country, zip, nationalId, ein,
        mobileNumber, dob.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        accountIntelligence:
          description: Contains the `account` object and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I301
                - I304
                - I316
                - I319
            account:
              description: Contains the availability and ownership results.
              type: object
              properties:
                availabilityScore:
                  description: >
                    Results of the bank account availability confirmation. A
                    higher score represents a greater likelihood that the
                    account is open (and not in a closed state).         
                  type: number
                  example: 0.59
                ownershipScore:
                  description: >
                    Results of the bank account ownership validation. A higher
                    score indicates a greater corroboration between the provided
                    PII and the known information on the account. 
                  type: number
                  example: 0.59
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    AccountIntelligencePremierResponse:
      title: Account Intelligence Premier
      description: >
        Validates a bank account's availability and ownership. Conditional
        parameters are

        physicalAddress, city, state, country, zip, nationalId, ein,
        mobileNumber, dob.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        accountIntelligencePremier:
          description: Contains the `account` object and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I328
            account:
              description: Contains the availability and ownership results.
              type: object
              properties:
                availabilityScore:
                  description: >
                    Results of the bank account availability confirmation. A
                    higher score represents a greater likelihood that the
                    account is open (and not in a closed state).         
                  type: number
                  example: 0.5
                ownershipScore:
                  description: >
                    Results of the bank account ownership validation. A higher
                    score indicates a greater corroboration between the provided
                    PII and the known information on the account. 
                  type: number
                  example: 0.99
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    AddressRiskResponse:
      title: Address Risk
      description: |
        Returns address risk and correlation scores. Conditional parameters are
        physicalAddress, city, state, zip.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        nameAddressCorrelation:
          description: Contains the address correlation value and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I123
                - I456
                - I789
            score:
              description: >-
                Indicates the strength of the relationship between the address
                and the consumer's `firstName` and `surName`.
              type: number
              example: 0.999
        addressRisk:
          description: Contains the address risk score and reason codes.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I123
                - I456
            score:
              description: >-
                The primary address risk score. A higher score indicates a
                greater likelihood of fraud. Values range from 0.0 to 1.0.
              type: number
              example: 0.436
            scores:
              description: A list of risk scores for this transaction.
              type: array
              items:
                type: object
                properties:
                  name:
                    description: The risk module's name.
                    type: string
                    example: Address Risk Model (US) Norm
                  version:
                    description: The risk module's version.
                    type: string
                    example: '7.0'
                  score:
                    description: >-
                      Represents the level of risk associated with an address. A
                      higher score indicates a greater likelihood of fraud.
                    type: number
                    example: 0.436
            signals:
              type: object
              description: Signals returned by the Address Risk product.
              properties:
                address:
                  type: object
                  description: The `address` primary key.
                  properties:
                    correctedPostalCode:
                      type: string
                      description: >-
                        If address standardization resulted in a correction to
                        the input postal code, the corrected value is returned
                        here. Otherwise, this value will be null.
                      example: '10001'
                    postalExtension:
                      type: string
                      description: >-
                        Postal code extension. In the US, this is the last 4
                        digits of a 9-digit ZIP code.
                      example: '5294'
                    latitude:
                      type: number
                      description: Latitude of the address.
                      example: 49.03
                    longitude:
                      type: number
                      description: Longitude of the address.
                      example: -81.32
                    timezone:
                      type: string
                      description: >-
                        The regional timezone associated with where the address
                        is located. As a regional indicator of the timezone,
                        this value does not change based on Daylight Savings
                        Time.
                      example: america/new york
                    timezoneOffset:
                      type: integer
                      description: >-
                        The current offset of the address's timezone compared to
                        GMT. Multiples of 100 are hours and the last two digits
                        are minutes (e.g., 530 = +5:30). Changes with DST.
                      example: -400
                    isDST:
                      type: boolean
                      description: >-
                        Whether the timezone the address is located in is
                        currently observing Daylight Savings Time (DST).
                      example: true
                    localHour:
                      type: integer
                      description: >-
                        The current hour of the day at the location of the IP
                        expressed in 24-hour format, ranging from 0 to 23.
                      example: 13
                    buildingType:
                      type: string
                      description: >-
                        The type of building at this address, specified as
                        "single-unit", "multi-unit", "p.o. box" or "general
                        delivery".
                      example: single-unit
                    purpose:
                      type: string
                      description: >-
                        The purpose of this address, including whether the
                        address is commercial, residential, or relates to
                        educational, military, or correctional purposes.
                        Possible values are: "university", "university housing",
                        "military", "correctional", "p.o. box", "commercial",
                        "residential".
                      example: residential
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the address matches a list of commonly used
                        filler values.
                      example: false
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    AlertListResponse:
      title: Alert List
      description: >
        Socure maintains an Alert List of known fraudulent users and specific
        identifying traits, as reported by Socure and its customers. Submitted
        data is checked against that list according to variable matching logic
        and processing. Any potential matching fields are then displayed in the
        JSON response, along with associated reason codes.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        alertList:
          type: object
          description: >-
            Contains applicable reason codes and a `matches` array listing
            matching elements and related info across all Alert List datasets.
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
                example: R111
            matches:
              description: >-
                Contains information for each hit on a source list that matches
                the input entity.
              type: array
              items:
                type: object
                properties:
                  element:
                    type: string
                    description: The submitted data parameter where a match was found.
                    example: ssn
                  datasetName:
                    type: string
                    description: The name of the dataset used.
                    example: consortium
                  reason:
                    type: string
                    description: The reason for the inclusion on the Alert List.
                    example: Identity Fraud
                  industryName:
                    type: string
                    description: >
                      The business or industry type that performed the Alert
                      Listing. Below are the possible values. 

                      - `Aviation`

                      - `Banking`

                      - `Credit Bureau`

                      - `E-Commerce`

                      - `Information Technology`

                      - `Insurance`

                      - `Lending`

                      - `Marketplace`

                      - `Payments`
                    example: E-Commerce
                  lastReportedDate:
                    type: string
                    description: >-
                      The most recent Alert List entry made for the matched PII
                      element.
                    example: '2018-12-20'
                  reportedCount:
                    type: integer
                    description: >
                      The number of times the PII element has been reported or
                      seen as part of a fraudulent transaction.
                    example: 3
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    DeceasedCheckResponse:
      title: Deceased Check
      type: object
      example:
        referenceId: ed8af82d-c063-4483-89dc-1248a8b212a5
        deceasedCheck:
          socureId: ab06216f-b88b-4be8-8075-933bb5c2303c
          reasonCodes:
            - R907
            - R909
          firstName: Dwayne
          middleName: Middlenametest
          surName: Denver
          nationalId: '999887777'
          dob: '1975-04-02'
          dod: '2024-01-31'
          age: '48'
          sourceAttribution:
            - Probate
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        deceasedCheck:
          description: Contains the vital record and reason codes.
          type: object
          properties:
            socureId:
              type: string
              description: |
                A persistent unique identifier for the transaction.
              example: ab06216f-b88b-4be8-8075-933bb5c2303c
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
            firstName:
              type: string
              description: The consumer's first name, as appeared in the vital record.
              example: Dwayne
            middleName:
              type: string
              description: The consumer's middle name, as appeared in the vital record.
            surName:
              type: string
              description: The consumer's last name, as appeared in the vital record.
              example: Denver
            nationalId:
              type: string
              description: >
                The national identification number of the consumer, as appeared
                in the vital record. For the US, it's the nine-digit Social
                Security Number (SSN) or Individual Tax Identification Number
                (ITIN). The last four digits of the SSN are also accepted.
                Hyphens are optional.
            dob:
              type: string
              format: YYYY-MM-DD, YYYYMMDD, YYYY/MM/DD
              description: |
                The consumer's date of birth, as appeared in the vital record.
            dod:
              type: string
              format: YYYY-MM-DD, YYYYMMDD, YYYY/MM/DD
              description: |
                The consumer's date of death, as appeared in the vital record.
            age:
              type: string
              description: The consumer's age at the time of death.
              example: '48'
            sourceAttribution:
              type: array
              items:
                type: string
              example:
                - Probate
              description: >-
                The specific categories of data sources utilized to resolve an
                identity, such as Government, Obituary, Credit Bureau, Probate,
                Consortium Feedback.
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    DecisionResponse:
      title: Decision
      type: object
      description: Contains the Decision module recommendation.
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        decision:
          type: object
          description: >-
            Contains the overall decision outcome for the transaction, along
            with individual module outcomes and the reason codes or scores that
            influenced each decision.
          properties:
            value:
              type: string
              description: The recommended decision for the transaction.
              enum:
                - accept
                - review
                - resubmit
                - refer
                - reject
            modelName:
              type: string
              description: The name of the logic model used in the decision.
            modelVersion:
              type: string
              description: The version of the logic model used in the decision.
            details:
              type: object
              description: >
                The triggers that led to the recommended decision outcome for
                the transaction.


                > **Note**: If a module returns an `accept` decision, no other
                information is shown.
              properties:
                alertlist:
                  type: object
                  description: >-
                    Checks an identify against Socure's list of known fraudulent
                    consumers.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                addressrisk:
                  type: object
                  description: Provides a risk analysis of an address.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    scores:
                      type: array
                      items:
                        type: number
                      description: The score that triggered the decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                    scoresMultiple:
                      type: object
                      description: >
                        The models included in the Decision Logic that triggered
                        the decision.


                        > **Note**: This field is only present if your logic is
                        configured in Decision Engine to use more than one model
                        version of the module. 
                      properties:
                        name:
                          type: string
                          description: The name of the model used in the decision.
                        version:
                          type: string
                          description: The version of the model used in the decision.
                        score:
                          type: number
                          description: >-
                            The score returned by the model used in the
                            decision.
                devicerisk:
                  type: object
                  description: >-
                    Provides a risk analysis of a device to identity
                    relationship.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                documentverification:
                  type: object
                  description: >-
                    Confirms the authenticity of government-issued
                    identification cards.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                fraud:
                  type: object
                  description: Indicates the likelihood an identity is fraudulent.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    scores:
                      type: array
                      items:
                        type: number
                      description: The scores that triggered the decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                    scoresMultiple:
                      type: object
                      description: >
                        The models included in the Decision Logic that triggered
                        the decision.


                        > **Note**: This field is only present if your logic is
                        configured in Decision Engine to use more than one model
                        version of the module. 
                      properties:
                        name:
                          type: string
                          description: The name of the model used in the decision.
                        version:
                          type: string
                          description: The version of the model used in the decision.
                        score:
                          type: number
                          description: >-
                            The score returned by the model used in the
                            decision.
                kyc:
                  type: object
                  description: >-
                    Indicates whether the information entered by a consumer
                    matches a known identity.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                    fieldValidations:
                      type: object
                      description: The scores that triggered the decision for the module.
                emailrisk:
                  type: object
                  description: Provides a risk analysis of an email address.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    scores:
                      type: array
                      items:
                        type: number
                      description: The scores that triggered the decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                    scoresMultiple:
                      type: object
                      description: >
                        The models included in the Decision Logic that triggered
                        the decision.


                        > **Note**: This field is only present if your logic is
                        configured in Decision Engine to use more than one model
                        version of the module. 
                      properties:
                        name:
                          type: string
                          description: The name of the model used in the decision.
                        version:
                          type: string
                          description: The version of the model used in the decision.
                        score:
                          type: number
                          description: >-
                            The score returned by the model used in the
                            decision.
                phonerisk:
                  type: object
                  description: Provides a risk analysis of a phone number.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    scores:
                      type: array
                      items:
                        type: number
                      description: The scores that triggered the decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                    scoresMultiple:
                      type: object
                      description: >
                        The models included in the Decision Logic that triggered
                        the decision.


                        > **Note**: This field is only present if your logic is
                        configured in Decision Engine to use more than one model
                        version of the module. 
                      properties:
                        name:
                          type: string
                          description: The name of the model used in the decision.
                        version:
                          type: string
                          description: The version of the model used in the decision.
                        score:
                          type: number
                          description: >-
                            The score returned by the model used in the
                            decision.
                prefill:
                  type: object
                  description: >-
                    Returns the first five digits of a consumer's social
                    security number.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                synthetic:
                  type: object
                  description: Indicates the likelihood an identity is synthetic.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    scores:
                      type: array
                      items:
                        type: number
                      description: The scores that triggered the decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                    scoresMultiple:
                      type: object
                      description: >
                        The models included in the Decision Logic that triggered
                        the decision.


                        > **Note**: This field is only present if your logic is
                        configured in Decision Engine to use more than one model
                        version of the module. 
                      properties:
                        name:
                          type: string
                          description: The name of the model used in the decision.
                        version:
                          type: string
                          description: The version of the model used in the decision.
                        score:
                          type: number
                          description: >-
                            The score returned by the model used in the
                            decision.
                watchliststandard:
                  type: object
                  description: >-
                    Checks an identity against government and law enforcement
                    watch lists.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                watchlistplus:
                  type: object
                  description: >-
                    Checks an identity against government and law enforcement
                    watch lists.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                watchlistpremier:
                  type: object
                  description: >-
                    Checks an identity against government and law enforcement
                    watch lists.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the module.
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The reason codes that triggered the decision for the
                        module.
                compositeTriggers:
                  type: object
                  description: Represents combinatorial logic rules.
                  properties:
                    decision:
                      type: string
                      description: The recommended decision for the combined logic rule.
                      enum:
                        - accept
                        - review
                        - resubmit
                        - refer
                        - reject
                    triggers:
                      type: array
                      items:
                        type: string
                      description: >-
                        The decision codes that triggered the decision for the
                        combined logic rule.
          example:
            value: reject
            modelName: Baseline Decision Logic
            modelVersion: '4.0'
            details:
              prefill:
                decision: accept
              synthetic:
                decision: reject
                triggers:
                  - R901
              devicerisk:
                decision: accept
              compositeTriggers:
                decision: reject
                triggers:
                  - D001
              documentverification:
                decision: accept
              fraud:
                decision: resubmit
                triggers:
                  - R703
              watchlistpremier:
                decision: accept
              addressrisk:
                decision: resubmit
                triggers:
                  - R703
              alertlist:
                decision: accept
              phonerisk:
                decision: accept
              emailrisk:
                decision: accept
              kyc:
                decision: reject
                triggers:
                  - R901
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    SigmaDeviceResponse:
      title: Device Risk
      description: Contains reason codes and historical metrics for the device.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        deviceRisk:
          type: object
          description: Contains Device Risk reason codes and risk score.
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I417
                - I401
                - I423
                - I424
        deviceIdentityCorrelation:
          type: object
          description: Device-to-identity correlation reason codes.
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I406
                - I405
                - I404
                - I415
                - I407
                - I408
        deviceData:
          type: object
          description: Information about a device.
          properties:
            information:
              type: object
              description: >-
                Information on the device manufacturer, operating system, and
                browser.
              properties:
                deviceManufacturer:
                  type: string
                  maxLength: 36
                  description: >
                    The device manufacturer.

                    > **Note**: The maximum length of this property is based on
                    past observations by Socure. Longer values are possible.
                  example: Apple
                deviceModelNumber:
                  type: string
                  maxLength: 255
                  description: >
                    The device model number.

                    > **Note**: The maximum length of this property is based on
                    past observations by Socure. Longer values are possible.
                  example: SM-T290
                operatingSystem:
                  type: string
                  maxLength: 16
                  description: >
                    The device operating system.

                    > **Note**: The maximum length of this property is based on
                    past observations by Socure. Longer values are possible.
                  example: Mac OS X
                operatingSystemVersion:
                  type: string
                  maxLength: 25
                  description: >
                    The device operating system version.

                    > **Note**: The maximum length of this property is based on
                    past observations by Socure. Longer values are possible.
                  example: 10.15.7
                browserType:
                  type: string
                  maxLength: 42
                  description: >
                    The device browser.

                    > **Note**: The maximum length of this property is based on
                    past observations by Socure. Longer values are possible.
                  example: Chrome
                browserVersion:
                  type: string
                  maxLength: 36
                  description: >
                    The device browser version. 

                    > **Note**: The maximum length of this property is based on
                    past observations by Socure. Longer values are possible.
                  example: 98.0.4758.80
            geolocation:
              type: object
              description: >-
                Information on the device location based on the IP address and
                GPS data.
              properties:
                ipGeolocation:
                  type: object
                  description: Device location data based on the IP address.
                  properties:
                    coordinates:
                      type: string
                      maxLength: 14
                      description: The latitude and longitude coordinates of the device.
                      example: 42.74,-72.99
                    city:
                      type: string
                      maxLength: 255
                      description: The city in which the device is located.
                      example: new york
                    state:
                      type: string
                      maxLength: 9
                      description: The state in which the device is located.
                      example: ny
                    zip:
                      type: string
                      maxLength: 10
                      description: The zip code in which the device is located.
                      example: '10027'
                    country:
                      type: string
                      maxLength: 2
                      description: The country in which the device is located.
                      example: us
                gpsGeolocation:
                  type: object
                  description: Device location data based on GPS data.
                  properties:
                    coordinates:
                      type: string
                      maxLength: 35
                      description: The latitude and longitude coordinates of the device.
                      example: 42.741574,-72.989559
            observations:
              type: object
              description: >-
                Information on when a device was first seen and last seen by
                Socure.
              properties:
                firstSeen:
                  type: string
                  format: date-time
                  description: >-
                    The date and time when the device was first seen, specified
                    in UTC non-ISO format.
                  example: '2022-01-24T13:29:31Z'
                lastSeen:
                  type: string
                  format: date-time
                  description: >-
                    The date and time when the device was last seen, specified
                    in UTC non-ISO format.
                  example: '2022-01-30T11:14:56Z'
            velocityMetrics:
              type: object
              properties:
                historicalCount:
                  type: object
                  description: Historical metrics for the device.
                  properties:
                    firstName:
                      type: object
                      properties:
                        uniqueCount:
                          type: integer
                          description: >-
                            The number of unique first names seen with the
                            device.
                          example: 1
                        uniqueSharePercent:
                          type: integer
                          description: >-
                            The percentage of transactions seen for this device
                            that match on the first name.
                          example: 100
                    surName:
                      type: object
                      properties:
                        uniqueCount:
                          type: integer
                          description: The number of unique surnames seen with the device.
                          example: 1
                        uniqueSharePercent:
                          type: integer
                          description: >-
                            The percentage of transactions seen for this device
                            that match on the surname.
                          example: 100
                    email:
                      type: object
                      properties:
                        uniqueCount:
                          type: integer
                          description: The number of unique emails seen with the device.
                          example: 2
                        uniqueSharePercent:
                          type: integer
                          description: >-
                            The percentage of transactions seen for this device
                            that match on the email.
                          example: 87
                    mobileNumber:
                      type: object
                      properties:
                        uniqueCount:
                          type: integer
                          description: >-
                            The number of unique mobile numbers seen with the
                            device.
                          example: 1
                        uniqueSharePercent:
                          type: integer
                          description: >-
                            The percentage of transactions seen for this device
                            that match on the mobile number.
                          example: 100
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    DeviceComputed:
      title: DeviceComputed
      type: object
      properties:
        statisticalId:
          type: string
          description: |
            Statistical ID used for statistical relinking. 
            > **Note**: DO NOT USE as a unique identifier.
          example: 9349d69fef75cd356744293487462f8cd912
        isVirtualMachine:
          type: boolean
          description: >-
            Set to `true` if the server believes the fingerprint to be sent by a
            virtual machine.
          example: false
        isTamperedAndroidBuild:
          type: boolean
          description: >-
            Set to `true` if the Android OS build is suspected to be modified or
            tampered with (e.g., the device is not running the standard
            manufacturer-provided Android build). This may occur when custom
            ROMs or altered OS images are installed. This flag is only reported
            for Android devices.
          example: true
        sessionAgeMinutes:
          type: integer
          format: int64
          description: >-
            The age of the session in minutes, calculated from when the session
            was created to now.
          example: 45
        deviceNetworkTimezoneOffsetDiffMinutes:
          type: integer
          description: >-
            The difference in minutes between the device's timezone offset and
            the network location's timezone offset.
          example: 60
        hasBatteryFullStateMismatch:
          type: boolean
          description: >-
            Set to `true` if the device reports a battery level of 100% but the
            battery state is not `full`.
          example: false
        hasLowEntropyUserAgentClientHints:
          type: boolean
          description: >-
            Set to `true` if the browser provides low entropy User-Agent Client
            Hints. Reported for web sessions only.
          example: false
    BehavioralNavigationContextSummary:
      type: object
      description: >
        Contains a summary of the events that are part of a single navigation
        context contained by a single Window.
      properties:
        tabId:
          type: string
          description: >
            The ID of the tab that the user is currently on. This is a web
            specific feature and will be

            null for mobile devices.
          example: 2b708463-9ef4-4166-ad47-5cb2309c1adc
        combinedContext:
          type: string
          description: >
            The combined navigation context for a given application. On web,
            this is the combination of the

            context and hash. On native, this is just the context.
          example: /checkout#step1
        estimatedStartTimestamp:
          type: string
          format: date-time
          description: >
            An estimation of the real world clock time when the context started.
            This is a

            best effort to combine the monotonic clock time with the real world
            clock time to 

            create a continuous timeline of events.
          example: '2023-10-24T15:55:16.368Z'
        timeInContext:
          type: number
          description: >
            The estimated total amount of time spent in the given navigation
            context in milliseconds.
        timeInForeground:
          type: number
          description: >
            The amount of time the given context was in the foreground. I.e.,
            the application or tab was

            not backgrounded.
        ipAddresses:
          type: array
          description: >
            The list of IP addresses that were used by the user during the given
            navigation context.
          items:
            type: string
            example: 127.0.0.1
        submissionCount:
          type: number
          description: >
            The number of times a form was submitted during the given navigation
            context. This is a web specific feature.
        backgroundCount:
          type: number
          description: >
            The number of times the application or tab was backgrounded during
            the given navigation context.
    EntityProfile:
      type: object
      properties:
        entity:
          type: string
          description: The unique identifier for the entity (e.g., email or phone number).
          example: john@doe.com
        entityType:
          type: string
          description: The type of the entity.
          example: phone
          enum:
            - phone
            - email
            - nationalId
        profile:
          type: object
          description: The profile details corresponding to the entity.
          properties:
            seenCount:
              type: integer
              description: The number of times the entity has been seen in the system.
              example: 5
            firstSeen:
              type: string
              format: date-time
              description: The first time the entity was observed in the system.
              example: '2019-08-24T14:15:22Z'
            lastSeen:
              type: string
              format: date-time
              description: The last time the entity was observed in the system.
              example: '2019-08-24T14:15:22Z'
            deviceTypes:
              type: array
              description: The most recent device types associated with the entity.
              items:
                type: string
              example:
                - phone
                - tablet
            deviceModels:
              type: array
              description: The most recent device models associated with the entity.
              items:
                type: string
              example:
                - iphone14,7
                - GT70053G
            deviceIsps:
              type: array
              description: >-
                The most recent ISPs (Internet Service Providers) associated
                with the entity.
              items:
                type: string
              example:
                - comcast
                - t-mobile
            deviceLanguages:
              type: array
              description: >-
                The most recent device languages associated with the entity.
                Values can mix BCP 47 (hyphenated, such as `en-US`) and POSIX
                (underscored, such as `de_US`) formats, reflecting how each
                device stores its locale.
              items:
                type: string
              example:
                - en-us
                - es-us
            deviceTimezones:
              type: array
              description: The most recent timezones associated with the entity.
              items:
                type: string
              example:
                - America/New_York
                - Asia/Kolkata
            networkLocationStates:
              type: array
              description: >-
                The most recent states inferred from the entity's network
                location.
              items:
                type: string
              example:
                - ca
                - az
            networkLocationPostalCodes:
              type: array
              description: >-
                The most recent postal codes inferred from the entity's network
                location.
              items:
                type: string
              example:
                - '12345'
                - '56789'
    DigitalIntelligenceResponse:
      title: Digital Intelligence
      description: |
        Provides access to the Digital Intelligence API through ID+
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        digitalIntelligence:
          description: Contains additional information about the request.
          type: object
          properties:
            device:
              type: object
              description: Contains device data.
              properties:
                id:
                  type: string
                  description: Unique UUID for the device.
                  example: 234ac3ff-3ed1-42de-8f33-8f332febfa54
                globalDeviceId:
                  type: string
                  format: uuid
                  description: The unique identifier assigned to the device.
                  example: 8e74d510-92c6-4b51-8648-d19ab4d997a8
                sessionCreatedAt:
                  type: string
                  format: date-time
                  description: The time at which the session was created
                  example: '2024-12-23T18:06:52.248985937Z'
                deviceCaptureAt:
                  type: string
                  format: date-time
                  description: >
                    The time at which device metadata was captured. If multiple
                    captures were made against the 

                    given session, this is the most recent timestamp.
                  example: '2024-12-23T18:09:12.735992851Z'
                computed:
                  $ref: '#/components/schemas/DeviceComputed'
                network:
                  type: object
                  description: Contains device network attributes.
                  properties:
                    connectionIp:
                      type: string
                      description: >-
                        The IP address detected by the connection to the
                        ingestion service.
                      example: 38.48.122.126
                    forwardedForIps:
                      type: array
                      description: >-
                        The collection of IP addresses in the `X-Forwarded-For`
                        header during the ingestion request.
                      items:
                        type: string
                      example:
                        - 78.32.11.221
                        - 70.45.2.1
                    webRtcPublicIp:
                      type: string
                      description: >-
                        The public facing IP address as detected by WebRTC when
                        available.
                      example: 176.124.54.12
                    webRtcInternalIp:
                      type: string
                      description: >-
                        The internal facing IP address as detected by WebRTC
                        when available.
                      example: 192.168.1.85
                    realIp:
                      type: string
                      description: >-
                        Real IP address detected in association with the
                        lastSeen time. This address is computed to be the most
                        specific address associated with the user. All
                        attributes are relative to this address.
                      example: 38.48.122.126
                    isTor:
                      type: boolean
                      description: Set to `true` if the IP is a TOR exit node.
                    isProxy:
                      type: boolean
                      description: Set to `true` if a Proxy is detected.
                    isVpn:
                      type: boolean
                      description: >-
                        Set to `true` if the device appears to be connected via
                        a VPN.
                    isConsumerPrivacy:
                      type: boolean
                      description: >-
                        Set to `true` if the device is detected to be using a
                        consumer privacy relay such as iCloud Private Relay or
                        Google One VPN.
                    isRiskyNetwork:
                      type: boolean
                      description: >-
                        Set to `true` if the device appears to be associated
                        with a known high-risk IP address or IP block. The value
                        is computed by Socure based on proprietary methods.
                    isp:
                      type: string
                      description: >-
                        Name of the Internet Service Provider associated with
                        the IP address.
                      example: comcast
                    ispType:
                      type: string
                      description: >-
                        Returns the type of ISP connection. Possible values can
                        be 'home' or 'business'.
                      example: home
                    asn:
                      type: integer
                      description: Unique ASN (Autonomous System Numbers) identifier.
                      example: 27364
                    asnName:
                      type: string
                      description: Name associated to the ASN identifier.
                      example: armstrong
                    domainName:
                      type: string
                      description: Domain name associated with the IP address.
                      example: zoominternet.net
                    org:
                      type: string
                      description: Name of the organization associated with the IP address.
                      example: comcast
                    isMobileCarrier:
                      type: boolean
                      description: >-
                        Set to `true` if IP appears to be associated with a
                        mobile carrier.
                    speed:
                      type: string
                      description: Provides connection type and speed information.
                      example: cable
                    networkLocation:
                      type: object
                      required:
                        - countryCode
                      properties:
                        countryCode:
                          type: string
                          description: ISO 3166-1 alpha-2 country code.
                          example: US
                          minLength: 2
                          maxLength: 2
                        region:
                          type: string
                          description: State, Province, or Region 2 Char code.
                          example: WA
                        city:
                          type: string
                          description: City Name
                          example: Tacoma
                        postalCode:
                          type: string
                          description: Postal or ZIP code.
                          example: '98401'
                        latitude:
                          type: number
                          format: float
                          description: Latitude
                          example: 47.2529001
                        longitude:
                          type: number
                          format: float
                          description: Longitude
                          example: -122.4443
                        metroCode:
                          type: integer
                          description: Metro Code
                          example: 819
                        continentCode:
                          type: string
                          description: ISO 2 Char (ISO-3166) Continent Codes.
                          example: na
                        timezoneName:
                          type: string
                          description: >-
                            The unique name of the timezone in the form
                            "Area/Location".
                          example: America/New_York
                        gmtOffset:
                          type: string
                          description: >-
                            The UTC offset is the difference in hours and
                            minutes between Coordinated Universal Time (UTC) and
                            local solar time, at a particular place. This
                            difference is expressed with respect to UTC and is
                            generally shown in the format ±[hh]:[mm], ±[hh][mm],
                            or ±[hh].
                          example: '-0400'
                attributes:
                  type: object
                  description: Contains device attribute data.
                  properties:
                    sdkVersion:
                      type: string
                      description: The version of the Socure SDK reporting the data.
                      example: 3.0.1
                    platform:
                      type: string
                      enum:
                        - Android
                        - iOS
                        - Web
                      description: The SDK platform used to create the platform.
                      example: iOS
                    os:
                      type: string
                      description: The operating system in use.
                      example: iOS
                    osVersion:
                      type: string
                      description: The version of the operating system in use.
                      example: '17.0'
                    deviceModel:
                      type: string
                      description: The model of the device being used.
                      example: iphone14,7
                    deviceManufacturer:
                      type: string
                      description: The manufacturer of the device.
                      example: Apple
                    deviceType:
                      type: string
                      description: The format of the device being used.
                      example: tablet
                    viewportWidth:
                      type: number
                      description: >-
                        The logical width of the viewport on native devices and
                        the logical innerWidth of the window on web.
                      example: 600
                    viewportHeight:
                      type: number
                      description: >-
                        The logical height of the viewport on native devices and
                        the logical innerHeight of the window on web.
                      example: 400
                    screenHeight:
                      type: number
                      description: The logical height of the screen.
                      example: 1080
                    screenWidth:
                      type: number
                      description: The logical width of the screen.
                      example: 1920
                    devicePixelRatio:
                      type: number
                      description: >-
                        The number of physical pixels for each logical pixel on
                        the screen.
                      example: 1.5
                    network:
                      type: object
                      description: >
                        General network information about the device. Note that
                        this is different from the mobile network cellular
                        information contained in `mobileNetwork`.
                      properties:
                        vpnStatus:
                          type: boolean
                          description: >-
                            true if the vpn is enabled, false otherwise. Note
                            that is value is not available for web.
                          example: true
                    location:
                      type: object
                      description: >-
                        The GPS coordinates of the device as reported by the
                        devices location services.
                      properties:
                        latitude:
                          type: number
                          description: The latitude of the location in degrees.
                          example: 41.50854591662628
                        longitude:
                          type: number
                          description: The longitude of the location in degrees.
                          example: -81.69534315646631
                        horizontalAccuracy:
                          type: number
                          description: >-
                            The radius of uncertainty of the reported location
                            in meters.
                          example: 2.1
                        altitude:
                          type: number
                          description: The altitude above the WGS 84 ellipsoid in meters.
                          example: 998.2
                        verticalAccuracy:
                          type: number
                          description: The accuracy of the reported altitude in meters.
                        bearing:
                          type: number
                          description: The bearing of the device in degrees.
                          example: 32
                        bearingAccuracy:
                          type: number
                          description: >-
                            The accuracy of the reported bearing in degrees. Not
                            reported on web.
                          example: 2.1
                        speed:
                          type: number
                          description: The speed of the device in meters per second.
                          example: 1.3
                        speedAccuracy:
                          type: number
                          description: >-
                            The accuracy of the reported speed in meters per
                            second. Not reported on web.
                          example: 0.2
                    battery:
                      type: object
                      description: Information regarding the battery for the device.
                      properties:
                        batteryState:
                          type: string
                          enum:
                            - charging
                            - unplugged
                            - full
                            - unknown
                          description: >
                            The charging status for the battery. Definitions map
                            directly to
                            https://developer.apple.com/documentation/uikit/uidevice/batterystate
                          example: charging
                        batteryLevel:
                          type: number
                          description: >-
                            The level of the battery charge with 0 being empty
                            and 1 being full.
                          example: 0.47
                    timeZone:
                      type: string
                      description: The name of the time zone the device is set to.
                      example: America/New_York
                    timeZoneOffset:
                      type: number
                      description: >-
                        The number of minutes the device is offset from the UTC
                        time zone.
                      example: -480
                    language:
                      type: string
                      description: >-
                        The primary language configured for the device,
                        formatted as a BCP 47 language tag. On Android and web,
                        the value conforms to BCP 47 unless the device has been
                        tampered with; on iOS it follows the same format but may
                        not pass strict parsers. Casing can vary by browser and
                        version, so parse the value case-insensitively.
                      example: en-US
                    deviceArchitecture:
                      type: string
                      description: |
                        Describes the architecture of the device.
                      example: arm64
                    applicationType:
                      type: string
                      enum:
                        - native
                        - react
                        - reactNative
                        - flutter
                        - unknown
                      description: >-
                        Corresponds to the type of application that uses the
                        SDK.
                      example: native
                    isEmulator:
                      type: boolean
                      description: >-
                        Set to `true` if the device is detected to be an
                        emulator.
                      example: true
                    deviceContext:
                      type: string
                      description: >-
                        Corresponds to the context passed into
                        `processDevice(...)` in the SDK. Expected possible
                        values from `deviceContext` include `homepage`,
                        `signup`, `login`, `password`, `checkout`, `profile`,
                        `transaction` or any custom value the customer may
                        provide. Value of `default` is used on initialization
                        and is `unknown` if a value isn't passed to
                        `processDevice(...)`.
                      example: homepage
                    androidAttributes:
                      type: object
                      description: Android specific attributes.
                      properties:
                        isRooted:
                          type: boolean
                          description: >-
                            Set to `true` if the device is detected to have been
                            rooted.
                          example: true
                        mobileNetwork:
                          type: array
                          description: >-
                            Contains the cellular network info for a single or
                            dual sim device.
                          items:
                            type: string
                            example: T-Mobile
                    iOSAttributes:
                      type: object
                      description: iOS specific attributes.
                      properties:
                        isRooted:
                          type: boolean
                          description: >-
                            Set to `true` if the device is detected to have been
                            jailbroken.
                          example: true
                        mobileNetwork:
                          type: array
                          description: >-
                            Contains the cellular network info for a single or
                            dual sim device.
                          items:
                            type: string
                            example: T-Mobile
                    webAttributes:
                      type: object
                      description: Web specific attributes
                      properties:
                        userAgent:
                          type: string
                          description: The userAgent being used to make the request.
                          example: >-
                            Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS
                            X) AppleWebKit/605.1.15 (KHTML, like Gecko)
                            Mobile/21A5291h
                            [FBAN/FBIOS;FBDV/iPhone15,3;FBMD/iPhone;FBSN/iOS;FBSV/17.0;FBSS/3;FBID/phone;FBLC/fr_FR;FBOP/5]
                        userAgentExtractionRequired:
                          type: boolean
                          description: >-
                            If true, User Agent Client Hints were not available
                            and the device information had to be extracted from
                            the User Agent, therefore it may be less precise.
                            Extracted fields are the following: `os`,
                            `osVersion`, `deviceModel`, `deviceManufacturer`
                          example: true
                        browser:
                          type: string
                          description: The browser being used to make the request.
                          example: Google Chrome
                        browserVersion:
                          type: string
                          description: >-
                            The version of the browser being used to make the
                            request.
                          example: '116'
                        pixelDepth:
                          type: number
                          description: The bit depth of the screen.
                          example: 24
                        hardwareConcurrency:
                          type: number
                          description: >-
                            The number of logical processors available to run
                            threads on the device.
                          example: 8
                        maxTouchPoints:
                          type: number
                          description: >-
                            The maximum number of touch points supported by the
                            device.
                          example: 1
                        colorDepth:
                          type: number
                          description: The color depth of the screen.
                          example: 24
                        webGlUnmaskedVendor:
                          type: string
                          description: The vendor string of the graphics driver.
                          example: Google Inc. (Apple)
                        webGlUnmaskedRenderer:
                          type: string
                          description: The renderer string of the graphics driver.
                          example: >-
                            ANGLE (Apple, ANGLE Metal Renderer: Apple M1 Pro,
                            Unspecified Version)
                        viewportScale:
                          type: number
                          description: >-
                            The pinch-zoom scaling factor applied to the visual
                            viewport.
                          example: 2.7
                history:
                  type: object
                  description: Object of historic data aggregated for the device profile.
                  properties:
                    firstSeen:
                      type: string
                      format: date-time
                      description: >-
                        The time the device profile was first seen as an ISO
                        Date.
                    lastSeen:
                      type: string
                      format: date-time
                      description: >-
                        The last time the device profile was seen as an ISO
                        Date.
                    ips:
                      type: array
                      description: >
                        Last 20 unique IPs, sorted from oldest to newest. Note
                        if an IP was observed multiple times then only the most
                        recent occurrence of the IP will be recorded.
                      example:
                        - 78.32.11.221
                        - 70.45.2.1
                      items:
                        type: string
                    isps:
                      type: array
                      description: >-
                        Last 20 unique isps, sorted from oldest to newest. Note
                        if an isp was observed multiple times then only the most
                        recent occurrence of the isp will be recorded.
                      example:
                        - RogersCable
                        - T-Mobile
                      items:
                        type: string
                    daysSeen:
                      type: array
                      description: >-
                        Dates corresponding to the last 20 times the device was
                        seen, sorted from oldest to newest. If a device was
                        observed multiple times during a day then only one
                        record for the day will be recorded.
                      items:
                        type: string
                        format: date
                    networkLocations:
                      type: array
                      description: >
                        Last 20 unique city/region level location trail based on
                        ip geo data. Note if a location was  observed multiple
                        times then only the most recent occurrence of the
                        location will be recorded.
                      example:
                        - chicago, il
                        - new york, ny
                        - paris, fr
                      items:
                        type: string
                  example:
                    firstSeen: '2023-10-24T15:55:16.368Z'
                    lastSeen: '2023-10-24T15:55:16.368Z'
                    ips:
                      - 78.32.11.221
                      - 70.45.2.1
                    isps:
                      - RogersCable
                      - T-Mobile
                    daysSeen:
                      - '2023-10-24'
                    networkLocations:
                      - chicago, il
                      - new york, ny
                      - paris, fr
            behavioral:
              type: object
              description: Contains behavioral aggregations from one session.
              properties:
                sessionId:
                  type: string
                  description: >-
                    Session ID generated by Device utilized to identify a unique
                    user session.
                  example: d34304a6-a726-4dec-b1cd-9c4a3c192a0d
                serverCreated:
                  type: string
                  format: date-time
                  description: >-
                    The ISO datetime for when the server first processed an
                    event for this session.
                  example: '2021-09-01T11:19:58.796Z'
                serverUpdated:
                  type: string
                  format: date-time
                  description: >-
                    The ISO datetime for when the server last processed an event
                    for this session.
                  example: '2021-09-11T16:19:58.796Z'
                duration:
                  type: integer
                  description: The entire duration of the session in milliseconds.
                  example: 120910
                source:
                  type: string
                  description: >-
                    Where the user originated from when the session began also
                    known as the referrer.
                  example: https://example.com/
                aggregations:
                  type: object
                  description: Collection of aggregate counts for each event type.
                  properties:
                    totalEventCount:
                      type: integer
                      description: >-
                        The combined number of events that occurred during the
                        session.
                      example: 26
                    focusCount:
                      type: integer
                      description: >-
                        The number of times a form field gained focus (became
                        the active element) during the session.
                    blurCount:
                      type: integer
                      description: >-
                        The number of times a form field lost focus (no longer
                        the active element) during the session.
                      example: 3
                    inputChangeCount:
                      type: integer
                      description: >-
                        The number of times the value of a form input field was
                        changed during the session.
                      example: 6
                    submissionCount:
                      type: integer
                      description: >-
                        The number of times an HTML form was submitted during
                        the session. Only occurs on Web.
                      example: 1
                    clickCount:
                      type: integer
                      description: >-
                        The number of times a form element was clicked during
                        the session.
                      example: 3
                    pasteCount:
                      type: integer
                      description: >-
                        The number of times a value was pasted into a form field
                        during the session.
            latestNavigationContexts:
              type: array
              description: >-
                Contains a summary of behavioral data for the latest occurrence
                of each navigation context.
              items:
                $ref: '#/components/schemas/BehavioralNavigationContextSummary'
            entityProfiler:
              type: array
              items:
                $ref: '#/components/schemas/EntityProfile'
