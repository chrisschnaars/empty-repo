          $ref: '#/components/schemas/Surname'
        dob:
          $ref: '#/components/schemas/DOB'
        mobileNumber:
          type: string
          description: >
            The consumer’s phone number in E.164 format, which includes the
            country code (e.g., `+` followed by international dialing code and
            number).

            Hyphens are optional. A mobile phone number is preferred.


            Example formats:

            - United States: `+13475550100`

            - United Kingdom: `+447911123456`

            - Brazil: `+5511987654321`

            - India: `+919876543210`

            - Australia: `+61412345678`


            > **Note**: `mobileNumber` is required for `verificationLevel` `3`.
          example: '+13475550100'
        physicalAddress:
          $ref: '#/components/schemas/PhysicalAddress'
        physicalAddress2:
          $ref: '#/components/schemas/PhysicalAddress2'
        city:
          type: string
          description: |
            The consumer's city of residence in valid postal address format.

            > **Note**: `city` is required for international requests.
          example: Brownsville
        state:
          $ref: '#/components/schemas/State'
        zip:
          $ref: '#/components/schemas/Zip'
        country:
          type: string
          description: >
            The country where the consumer resides, specified in ISO 3166-1
            alpha-2 format.


            > **Note**: `country` is required for international requests.
          example: US
      additionalProperties: false
    DocumentRequestResponseV3:
      type: object
      title: Capture Request Response
      description: Contains additional information about the request.
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        data:
          type: object
          description: Contains details for the document request.
          properties:
            referenceId:
              $ref: '#/components/schemas/ReferenceID'
            eventId:
              type: string
              description: The event ID for the first event of the process.
              example: 20517507-7d9d-40d4-b330-d21a9ef226ab
            status:
              type: string
              description: The name of the current event.
              example: WAITING_FOR_REDIRECT_METHOD
            customerUserId:
              type: string
              description: The customer reference ID for the transaction.
              example: '121212'
            verificationLevel:
              type: integer
              description: The verification process workflow for the transaction.
              example: 1
            qrcode:
              type: string
              description: The base64-encoded value of the QR code.
              example: >-
                iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
            url:
              type: string
              description: The URL that initiates the Capture App flow on a mobile device.
              example: >-
                https://verify.socure.com/#/t/c5e71062-26d5-478c-8441-b434fcc565d0
      additionalProperties: false
    Error401ImageRequest:
      type: object
      properties:
        referenceId:
          description: A unique identifier for this error.
          type: string
          example: 23743dc9-bc18-4fd7-8c81-c061c0e951fb
        msg:
          description: Contains a list of parameters that describe the error.
          type: object
          properties:
            status:
              type: integer
              description: The error code associated with the request.
              example: 401
            msg:
              type: string
              description: A short description of the error.
              example: No Account Associated
    Error400-invalidToken:
      title: Missing or Invalid Parameters
      type: object
      description: >
        There are invalid parameters in the request. See the 'msg' object for a
        description of the parameter that caused the error. May or may not
        return additional objects parameters or permissions, based on where the
        error occurs.
      properties:
        status:
          description: The status of the request.
          type: string
        msg:
          type: string
          description: A short description of the error.
      example:
        status: Error
        msg: Invalid token
    Error400-tokenExpired:
      title: Expired docvTransactionToken
      type: object
      description: >
        The documents were already uplaoded and the `documents_uploaded` event
        was sent to your webhook endpoint or if you have already invalidated the
        token and you call the endpoint a second time. 
      properties:
        status:
          description: The status of the request.
          type: string
        msg:
          type: string
          description: A short description of the error.
      example:
        status: Error
        msg: The docvTransactionToken has already been expired.
    OtpSendResponse:
      title: Generate a one-time code
      type: object
      properties:
        verificationId:
          description: >-
            A unique identifier for this OTP session. This identifier must be
            stored and used when verifying the OTP. It has a UUID format.
          type: string
          example: dba3c613-0310-4176-aee6-ab22249aa013
    OtpVerifyResponse:
      title: Verify an input one-time passcode
      type: object
      properties:
        verificationId:
          description: >-
            The same verification ID that was used in the request, confirming
            which OTP session this response belongs to.
          type: string
          example: dba3c613-0310-4176-aee6-ab22249aa013
        status:
          description: >-
            The result of the verification attempt. Possible values are
            approved, pending, or reject. See Status Definitions below for
            details.
          type: string
          example: approved
        attemptCount:
          description: >-
            The number of verification attempts made for this verification ID.
            Maximum of 5 attempts are allowed before automatic rejection.
          type: number
          example: 1
    FeedbackRequestSAI:
      title: Account Intelligence
      type: object
      required:
        - transactionId
        - inquiryUsecase
        - decisionDateTime
        - finalDecision
      properties:
        transactionId:
          type: string
          description: >
            The unique identifier assigned to the original transaction.

            > **Note**: PII will be excluded from the file returned by Socure,
            and results will be merged using the unique identifier. 
          example: c9b1dab6-4ffd-49f4-ba02-c5f517ef00fb
        inquiryUsecase:
          type:
            - string
            - 'null'
          description: |
            The Account Intelligence use case details.
          example: 'null'
        decisionDateTime:
          type:
            - 'null'
            - string
          format: date-time
          description: |
            The time when the final decision was taken.
        finalDecision:
          type: string
          description: >-
            The final decision for the application as returned by the
            auto-decision system or manual review process.
          example: approve
          enum:
            - approve
            - reject
        paymentOutcome:
          type:
            - string
            - 'null'
          description: >
            The time when the final decision was taken.


            > **Note**: `paymentOutcome` is required for Account Intelligence
            payment use cases.
          example: payment processed
        paymentReturnCode:
          type:
            - string
            - 'null'
          description: >
            The ACH return reason code.


            > **Note**: `paymentReturnCode` is required for Account Intelligence
            payment use cases.
          example: null
        paymentReturnDate:
          type:
            - 'null'
            - string
          format: date-time
          description: >
            Use this field to note the date if a payment is returned.

            > **Note**: 

            > - This should originate from an ACH return file.

            > - `paymentReturnDate` is required for Account Intelligence payment
            use cases.
          example: '2023-12-13T10:15:19Z'
        paymentReturnReason:
          type:
            - 'null'
            - string
          description: >
            If a payment is returned, specify the reason for the return (e.g.,
            account closed, insufficient funds, unauthorized).

            > **Note**: 

            > - The info should indicate the ACH return reason.

            > - `paymentReturnReason` is required for Account Intelligence
            payment use cases.
        paymentDate:
          type: string
          format: datetime
          description: >
            Date of the payment for which account validation is requested.

            > **Note**: 

            > - The date must be in the format `yyyyMMdd`. Dashes, slashes, and
            separators are optional.

            > - `paymentDate` is required for Account Intelligence payment use
            cases.
          example: '2023-12-13T10:15:19Z'
        paymentType:
          type: string
          description: >-
            Specify the type of payment for which account validation is
            requested, such as ACH debit or ACH credit.
        paymentAmount:
          type: number
          format: double
          description: >
            Specify the amount of the payment for which account validation is
            requested.

            > **Note**: 

            > - The dollar amount must be in the format of $X.

            > - `paymentAmount` is required for Account Intelligence payment use
            cases.
        accountValidationDate:
          type: string
          format: date-time
          description: >
            If the account was validated, provide the date when the bank account
            was initially validated.
          example: '2023-12-13T10:15:19Z'
        accountValidationMethod:
          type: string
          description: >
            If the account was validated, specify the method used (e.g.,
            micro-deposits, data-driven, consumer-permissioned).
          example: consumer-permissioned
        accountValidationOutcome:
          type: string
          description: >
            The outcome from the validation method used above.

            > **Note**: The info must represent the output from the utilized
            validation services, such as validated, not validated, verified, or
            not verified.
          example: validated
        ownerValidationDate:
          type: string
          format: date-time
          description: >-
            If the account owner was validated, provide the date when the owner
            was initially validated.
          example: '2023-12-13T10:15:19Z'
        ownerValidationMethod:
          type: string
          description: >-
            If the account owner was validated, specify the method used (e.g.,
            manual, data-driven, consumer-permissioned).
          example: consumer-permissioned
        ownerValidationOutcome:
          type: string
          description: >
            The outcome from the owner validation method used above.

            > **Note**: The info must represent the output from the utilized
            validation services, such as validated, not validated, verified, or
            not verified.
          example: validated
        channel:
          type: string
          description: The channel in which the transaction was initiated.
          example: mobile
        accountCreationDate:
          type:
            - 'null'
            - string
          format: date-time
          description: >
            The account creation date for the transaction. Use `-1` for
            cancelled accounts and `T00:00:00Z` 

            if the account creation time is unknown.
          example: '2020-09-15T21:11:02Z'
        orderAmount:
          type: number
          format: double
          description: >-
            The requested credit limit, loan amount, or funding amount for the
            transaction.
          example: 10000.01
    FeedbackRequestDeviceRisk:
      title: Device Risk
      type: object
      required:
        - transactionId
        - initialDecision
        - finalDecision
        - fraudOutcome
        - fraudType
      properties:
        transactionId:
          type: string
          description: |
            The unique identifier assigned to the original transaction. 
          example: c9b1dab6-4ffd-49f4-ba02-c5f517ef00fb
        initialDecision:
          type: string
          description: >-
            The initial decision for the application as returned by the
            auto-decision system.
          example: auto approve
          enum:
            - auto approve
            - auto reject
            - manual review
        finalDecision:
          type: string
          description: >-
            The final decision for the application as returned by the
            auto-decision system or manual review process.
          example: approve
          enum:
            - approve
            - reject
        fraudOutcome:
          type: string
          description: >-
            Identifies whether a transaction was determined to be fraudulent
            based on the application's current status.
          example: fraud
          enum:
            - fraud
            - suspected fraud
            - not fraud
        fraudType:
          type: string
          description: |
            The fraud type. 
              >**Note**: Only pass `null` if the `fraudOutcome` equals `not fraud`.
          example: third party fraud
          enum:
            - first party fraud
            - synthetic fraud
            - third party fraud
            - account takeover
            - 'null'
        fraudSubtype:
          type:
            - 'null'
            - string
          description: >-
            A free-form text field that you can leverage to map the fraud type
            labels used in your system to the `fraudType` and
            `docVOutcomeReasons` labels used by Socure. Examples of the subtype
            string might include embezzlement, false claim, compromised
            credential, impersonated authorized party, digital payment,
            forgery/counterfeit, relationship and trust fraud, physical
            alteration, etc.
          example: compromised credentials
        eventDate:
          type:
            - 'null'
            - string
          format: date-time
          description: >
            The date an event occurred for the account, such as delinquency,
            fraud, charge-off, or bankruptcy. 


            > **Note**: Only pass `null` if the `fraudOutcome` equals `not
            fraud`.
          example: '2023-12-13T23:11:12Z'
        lossAmount:
          type:
            - 'null'
            - number
          format: double
          description: >
            The total amount recorded as a gross loss as a result of fraud, not
            including recovered funds.
          example: 596.23
        customerUserId:
          type: string
          description: |
            The client-specified reference ID for the transaction.
        channel:
          type: string
          description: The channel in which the transaction was initiated.
          example: mobile
