              > - The following special characters are not supported: ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

              > - The field accepts backslashes to prevent HTTP 400 errors; these are removed during preprocessing to guard against injection attacks and ensure consistent data storage, resulting in an HTTP 200 response. If a backslash is the only input, it returns an empty string.
          example: Denver
          maxLength: 240
        fullName:
          description: >
            Allows you to search for non-person entities, such as businesses,
            aircraft, and ships.

            > **Note**:

            > - The following special characters are not supported:
            ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

            > - This field is required if `firstName`, `surName`, `entityName`,
            and `entityType` are not provided.  > - The field accepts
            backslashes to prevent HTTP 400 errors; these are removed during
            preprocessing to guard against injection attacks and ensure
            consistent data storage, resulting in an HTTP 200 response. If a
            backslash is the only input, it returns an empty string.
          type: string
