components:
  securitySchemes:
    SocureApiKey:
      type: apiKey
      in: header
      name: SocureApiKey
      description: >
        Authenticate your requests by including your API key in the
        Authorization header with the prefix `SocureApiKey`.
  schemas:
    EIN:
      type: string
      description: >
        Employer Identification Number (EIN) value used to identify a business
        entity. Recommended when `businessName` is present. 
      example: '123456789'
      maxLength: 9
    AccountNumber:
      type: string
      example: '61231234335'
      description: |
        The account number for which account validations are being performed. 
      maxLength: 17
      minLength: 4
    RoutingNumber:
      type: string
      example: '122199983'
      description: >
        The account routing number for which account validations are being
        performed.  
      maxLength: 9
      minLength: 9
    Inquiries:
      description: |
        The inquiry type. Below are the possible values. 
        - `AVAILABILITY`: Used to confirm a bank account's availability. 
        - `OWNERSHIP`: Used to verify a bank account's ownership. 
      type: array
      items:
        type: string
      example:
        - AVAILABILITY
        - OWNERSHIP
    Account:
      title: Account
      type: object
      description: >
        The bank account information and inquiry types associated with the
        transaction. 
      required:
        - accountNumber
        - routingNumber
        - inquiries
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        routingNumber:
          $ref: '#/components/schemas/RoutingNumber'
        inquiries:
          $ref: '#/components/schemas/Inquiries'
    CustomerUserID:
      type: string
      maxLength: 100
      description: |
        A client-specified unique identifier for the transaction.  
      example: '129'
    UserID:
      type: string
      maxLength: 100
      description: >
        Contains a unique partner or integrator-specified identifier for the
        end-user. Only partners or integrators should use this field.
      example: dwanyedever1975
    Segmentation:
      type: object
      description: >
        Supports traffic segmentation and categorization when included in the
        request.    
      properties:
        eventType:
          type: string
          description: >
            Specifies an event type used for this transaction to allow for
            better customization for transaction processing and billing.
            Available values include: `payment`, `fundsMovement`, `login`,
            `accountOpen`, `accountChange`, and `other`.

            > **Note**: 
              > - This parameter is required for `segmentation`. 
              > - This field is not case-sensitive.
          example: accountOpen
          enum:
            - payment
            - fundsMovement
            - login
            - accountOpen
            - accountChange
            - other
        eventSubType:
          type: string
          maxLength: 255
          description: >
            Free-form field that allows for a more descriptive value for the
            event.

            > **Note**: This field is not needed for a vast majority of clients
            and is optional. Clients should only implement this field if asked
            to do so by the Account Manager, who will also advise on what value
            to use.
          example: ...
        channel:
          type: string
          description: >
            Specifies the mode of interaction on the consumer's end. Available
            values include: `web`, `mobile`, `pos`, and `other`. 

            > **Note**: 
              > - This parameter is required for `segmentation`. 
              > - This field is not case-sensitive.
          example: mobile
          enum:
            - web
            - mobile
            - pos
            - other
    AccountIntelligence:
      title: Account Intelligence
      type: object
      required:
        - modules
        - payments
      properties:
        modules:
          type: array
          description: >
            The name of the ID+ module. 

            Note: You must specify the inquiry request type for Account
            Intelligence in the `inquiries` parameter within the `payments`
            object.
          items:
            type: string
            enum:
              - accountintelligence
        firstName:
          type: string
          maxLength: 240
          example: Johnny
          description: >
            The consumer’s first name. Supports UTF-8 single byte latin
            characters. Required for `OWNERSHIP` inquiries.
        surName:
          type: string
          maxLength: 240
          example: Aiken
          description: |
            The consumer’s last name. Required for `OWNERSHIP` inquiries.
        entityName:
          type: string
          maxLength: 87
          example: Online Gaming
          writeOnly: true
          description: >
            The business entity name. Required for `OWNERSHIP` if `firstName`
            and `surName` are not provided.
        physicalAddress:
          type: string
          example: 2 Moran Ave
          description: The first line of the address.
        physicalAddress2:
          type: string
          example: Apt. 5
          writeOnly: true
          description: An optional second line for the address.
        city:
          type: string
          example: Danbury
          description: The city of residence.
        state:
          type: string
          minLength: 2
          maxLength: 2
          example: CT
          description: The state code in ISO 3166-2 format.
        zip:
          type: string
          example: '068100000'
          description: The five or nine-digit ZIP code.
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: US
          description: The country code in ISO 3166-1 alpha-2 format.
        nationalId:
          type: string
          example: 700-01-3784
          description: The consumer's SSN or ITIN (9 digits or last 4).
        ein:
          $ref: '#/components/schemas/EIN'
        mobileNumber:
          type: string
          maxLength: 16
          example: '+12037986508'
          description: The consumer’s phone number in E.164 format.
        businessPhone:
          type: string
          maxLength: 16
          description: The business's phone in E.164 format.
        dob:
          type: string
          format: date
          example: '1958-01-31'
          description: >
            The consumer's date of birth. Accepts YYYY-MM-DD, YYYYMMDD, or
            YYYY/MM/DD formats.
        payments:
          type: object
          required:
            - account
          description: The bank account information associated with the transaction.
          properties:
            account:
              $ref: '#/components/schemas/Account'
        customerUserId:
          $ref: '#/components/schemas/CustomerUserID'
        userId:
          $ref: '#/components/schemas/UserID'
        countryOfOrigin:
          type: string
          example: US
          description: ISO-2 country code where the transaction originates.
        segmentation:
          $ref: '#/components/schemas/Segmentation'
    AccountIntelligencePremier:
      title: Account Intelligence Premier
      type: object
      required:
        - modules
        - payments
      example:
        modules:
          - accountintelligencepremier
        firstName: Michal
        surName: ''
        physicalAddress: 400 East South Water Street APT 3104
        city: Chicago
        state: IL
        zip: '60601'
        country: US
        nationalId: ''
        mobileNumber: ''
        dob: '1993-05-05'
        payments:
          account:
            accountNumber: '105062217'
            routingNumber: '071000013'
            inquiries:
              - AVAILABILITY
              - OWNERSHIP
        segmentation:
          eventType: other
          eventSubType: ''
          channel: web
      properties:
        modules:
          description: >
            The name of the ID+ module.

            > **Note**: You must specify the inquiry request type for Account
            Intelligence in the `inquiries` parameter. The inquiry type will
            determine which other parameters are required.
          type: array
          items:
            type: string
            enum:
              - accountintelligencepremier
        firstName:
          description: >
            The consumer’s first name. 

            > **Note**: 

            > - UTF-8 single byte latin characters are supported.

            > - The following special characters are not supported:
            ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

            > - This parameter is required for `OWNERSHIP` inquiries of a
            consumer account.

            > - The field accepts backslashes to prevent HTTP 400 errors; these
            are removed during preprocessing to guard against injection attacks
            and ensure consistent data storage, resulting in an HTTP 200
            response. If a backslash is the only input, it returns an empty
            string.
          type: string
          example: Black
          maxLength: 240
        surName:
          type: string
          description: >
            The consumer’s last name.

            > **Note**:  

            > - The following special characters are not supported:
            ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

            > - This parameter is required for `OWNERSHIP` inquiries of a
            consumer account.
          example: Frank
          maxLength: 240
        entityName:
          type: string
          description: >
            The business entity name. 

            > **Note**: 

            > - The following special characters are not supported:
            ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

            > - This parameter is required for `OWNERSHIP` if `firstName` and
            `surName` are not provided. 
          maxLength: 87
          example: Online Gaming
          writeOnly: true
        physicalAddress:
          type: string
          description: |
            The first line of the consumer or business's address.
          example: 936 Shorebird Cir
        physicalAddress2:
          type: string
          example: Apt. 5
          description: |
            An optional second line for the address.
          writeOnly: true
        city:
          type: string
          description: |
            The city where the consumer or business resides.
          example: Redwood City
        state:
          type: string
          description: >
            The state, province, or region where the consumer or business
            resides, specified in ISO 3166-2 format.

            > **Note**: If the physical address is in a country or state that
            does not require `state`, do not include this field in the API call.
          example: CA
          minLength: 2
          maxLength: 2
        zip:
          type: string
          description: >
            The consumer or business's five or nine-digit ZIP code in valid
            postal address format. Hyphens and spaces are optional. <br />

            If the physical address is in a country or state that does not
            require `zip`, do not include this field in the API call.

            > **Note**: This field accepts a 9-digit zip code, with spaces
            allowed in place of hyphens (e.g., `94502 1397` instead of
            `94502-1397`).
          example: '940655108'
        country:
          type: string
          description: >
            The country where the consumer or business resides, specified in ISO
            3166-1 alpha-2 format.

            > **Note**: This field is not case-sensitive.
          example: US
          minLength: 2
          maxLength: 2
        nationalId:
          type: string
          description: >
            The consumer's nine-digit Social Security number (SSN) or Individual
            Tax Identification Number (ITIN). The last four digits of the SSN
            are also accepted. Hyphens and spaces are optional.
          example: 473-56-6116
        ein:
          $ref: '#/components/schemas/EIN'
        mobileNumber:
          type: string
          description: >
            The consumer’s phone number, preferably in E.164 format. Hyphens are
            optional. A mobile phone number is preferred. Recommended when
            `firstName` and `surName` are present.

            > **Note**: If the country code is missing, the system will default
            to a North American phone number.
          example: '+16505762653'
          maxLength: 16
        businessPhone:
          type: string
          description: >
            The business's phone in E.164 format. Hyphens are optional.
            Recommended when `entityName` is present.
          maxLength: 16
        dob:
          type: string
          example: '1978-06-24'
          format: YYYY-MM-DD, YYYYMMDD, YYYY/MM/DD
          description: >
            The consumer's date of birth, preferably in YYYY-MM-DD, YYYYMMDD, or
            YYYY/MM/DD format.
        payments:
          description: |
            The bank account information associated with the transaction. 
          type: object
          required:
            - account
          properties:
            account:
              $ref: '#/components/schemas/Account'
        customerUserId:
          $ref: '#/components/schemas/CustomerUserID'
        userId:
          $ref: '#/components/schemas/UserID'
        countryOfOrigin:
          type: string
          description: >
            The country or jurisdiction from where the transaction originates,
            specified in ISO-2 country codes format.

            > **Note**: 
              > - This field explicitly refers to the originating country for the transaction passed into ID+, and does not bear any relation to the origin of an applicant’s residential history.
              > - This field is not case-sensitive.
          example: US
        segmentation:
          $ref: '#/components/schemas/Segmentation'
    ReturnSignals:
      type: boolean
      example: true
      default: false
      description: >
        When set to `true`, returns Signals in the response alongside standard
        scores

        and reason codes. If omitted or false, Signals are not returned.
    FirstName:
      description: >
        The consumer’s first name. 

        > **Note**: 

        > - UTF-8 single byte latin characters are supported.

        > - The following special characters are not supported:
        ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

        > - The field accepts backslashes to prevent HTTP 400 errors; these are
        removed during preprocessing to guard against injection attacks and
        ensure consistent data storage, resulting in an HTTP 200 response. If a
        backslash is the only input, it returns an empty string.
      type: string
      example: Dwayne
      maxLength: 240
    Surname:
      type: string
      description: >
        The consumer’s last name. 

        > **Note**: 

        > - UTF-8 single byte latin characters are supported.

        > - The following special characters are not supported:
        ^±!@£$%&*_+¡€#¢§¶•ªº«<>?\\/:;|=

        > - The field accepts backslashes to prevent HTTP 400 errors; these are
        removed during preprocessing to guard against injection attacks and
        ensure consistent data storage, resulting in an HTTP 200 response. If a
        backslash is the only input, it returns an empty string.
      example: Denver
      maxLength: 240
    PhysicalAddress:
      type: string
      maxLength: 255
      example: 200 Key Square St
      description: |
        The first line of the consumer's address. Maximum 255 characters.
    PhysicalAddress2:
      type: string
      maxLength: 255
      example: Apt 5
      description: |
        An optional second line for the address. Maximum 255 characters.
    City:
      type: string
      example: Brownsville
      description: |
        The city where the consumer resides.
    State:
      type: string
      minLength: 2
      maxLength: 2
      example: TN
      description: >
        The state, province, or region where the consumer resides, specified in
        ISO 3166-2 format.

        > **Note**: 

        > - If the physical address is within a U.S. territory, you can pass the
        territory name in either the `state` or `country` field.

        > - If the physical address is in a country or state that does not
        require `state`, do not include this field in the API call.
    Zip:
      type: string
      example: '38012'
      description: >
        The consumer's five or nine-digit ZIP code must be in a valid postal
        address format. Hyphens or spaces are optional.

        > **Note**: 
          > - If the physical address is in a country or state that does not require `zip`, do not include this field in the API call.
          > - This field accepts a 9-digit zip code, with spaces allowed in place of hyphens (e.g., `94502 1397` instead of `94502-1397`).
    Country:
      type: string
      minLength: 2
      maxLength: 2
      description: >
        The country where the consumer resides, specified in ISO 3166-1 alpha-2
        format.

        > **Note**: 
          > - If the physical address is within a U.S. territory, you can pass the territory name in either the `state` or `country` field.
          > - This field is not case-sensitive.
      example: US
    ShippingDetails:
      type: object
      description: |
        Shipping details for the transaction.
      properties:
        firstName:
          type: string
          maxLength: 240
          description: |
            The shipping recipient's first name.
          example: Dwayne
        surName:
          type: string
          maxLength: 240
          description: |
            The shipping recipient's last name.
          example: Denver
        phone:
          type: string
          maxLength: 14
          description: |
            The shipping recipient's phone number in E.164 format. 
            A mobile phone number is preferred.
          example: '+13475550100'
        email:
          type: string
          description: |
            The shipping recipient's email address.
          example: dwayne.denver@example.com
    AddressRisk:
      title: Address Risk
      type: object
      required:
        - modules
        - firstName
        - surName
        - physicalAddress
        - country
      properties:
        modules:
          description: >
            The name of the ID+ module.


            > **Note**: In addition to the required parameters, you must also
            include at least 

            one of the following sets of conditional parameters in the request.

            > 1. `city`, `state`

            > 2. `zip`
          type: array
          items:
            type: string
            enum:
              - addressrisk
        returnSignals:
          $ref: '#/components/schemas/ReturnSignals'
        firstName:
          $ref: '#/components/schemas/FirstName'
        surName:
          $ref: '#/components/schemas/Surname'
        physicalAddress:
          $ref: '#/components/schemas/PhysicalAddress'
        physicalAddress2:
          $ref: '#/components/schemas/PhysicalAddress2'
        city:
          $ref: '#/components/schemas/City'
        state:
          $ref: '#/components/schemas/State'
        zip:
          $ref: '#/components/schemas/Zip'
        country:
          $ref: '#/components/schemas/Country'
        shippingDetails:
          $ref: '#/components/schemas/ShippingDetails'
        customerUserId:
          $ref: '#/components/schemas/CustomerUserID'
        userId:
          $ref: '#/components/schemas/UserID'
        countryOfOrigin:
          type: string
          description: >
            The country or jurisdiction from where the transaction originates,
            specified in ISO-2 country codes format.

            > **Note**: 
              > - This field explicitly refers to the originating country for the transaction passed into ID+, and does not bear any relation to the origin of an applicant’s residential history.
              > - This field is not case-sensitive.
          example: US
        segmentation:
          $ref: '#/components/schemas/Segmentation'
    AlertList:
      title: Alert List
      type: object
      required:
        - modules
      properties:
        modules:
          description: >
            The name of the ID+ module.


            > **Note**: In addition to the `modules` array, you must also
            include at least 

            one of the following parameters in the request.

            > 1. `nationalId`

            > 2. `email`

            > 3. `mobileNumber`
          type: array
          items:
            type: string
            enum:
              - alertlist
        nationalId:
          type: string
          description: >
            The consumer's nine-digit Social Security number (SSN) or Individual
            Tax Identification Number (ITIN). 


            > **Note**: A match is only returned on full 9-digit numbers with no
            dashes, dots, or spaces.
          example: '461118208'
        email:
          type: string
          description: >
            The consumer's email address.


            > **Note**: 

            > - Must conform to RFC 5322 format and contain a valid top-level
            domain.

            > - Emails are internally converted to lowercase and special
            characters are removed where applicable to avoid potential
            mismatches. 
          example: janedoe@example.com
        mobileNumber:
          type: string
          example: '+13475550100'
          description: >
            The consumer’s phone number, preferably in E.164 format. Hyphens are
            optional. A mobile phone number is preferred.

            > **Note**: If the country code is missing, the system will default
            to a North American phone number.
          maxLength: 16
        customerUserId:
          $ref: '#/components/schemas/CustomerUserID'
        userId:
          $ref: '#/components/schemas/UserID'
        countryOfOrigin:
          type: string
          description: >
            The country or jurisdiction from where the transaction originates,
            specified in ISO-2 country codes format.

            > **Note**: 
              > - This field explicitly refers to the originating country for the transaction passed into ID+, and does not bear any relation to the origin of an applicant’s residential history.
              > - This field is not case-sensitive.
          example: US
        segmentation:
          $ref: '#/components/schemas/Segmentation'
    NationalID:
      type: string
      description: >
        The national identification number of the consumer. For the US, it's the
        nine-digit Social Security Number (SSN) or Individual Tax Identification
        Number (ITIN). The last four digits of the SSN are also accepted.
        Hyphens are optional.
      example: '461118208'
    MobileNumber:
      type: string
      example: '+13475550100'
      description: >
        The consumer’s phone number in E.164 format, which includes the country
        code (e.g., `+` followed by international dialing code and number).

        Hyphens are optional. A mobile phone number is preferred.


        Example formats:

        - United States: `+13475550100`

        - United Kingdom: `+447911123456`

        - Brazil: `+5511987654321`

        - India: `+919876543210`

        - Australia: `+61412345678`


        > **Note**: If the country code is omitted, the system will default to a
        North American number format.
      maxLength: 16
    DeceasedCheck:
      title: Deceased Check
      type: object
      required:
        - modules
        - firstName
        - surName
        - country
