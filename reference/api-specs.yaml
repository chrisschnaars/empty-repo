    KYC:
      title: Socure Verify (KYC)
      type: object
      required:
        - modules
        - country
      properties:
        modules:
          description: >
            The name of the ID+ module.


            **Note:** One of the following PII combinations is required along
            with the `modules` array:
              - `firstName` + `surName` + `country` + `nationalId`
              - `firstName` + `surName` + `country` + `dob`
              - `firstName` + `surName` + `country` + `driverLicense` + `driverLicenseState`
              - `firstName` + `surName` + `country` + `physicalAddress` + `zip`
              - `firstName` + `surName` + `country` + `physicalAddress` + `city` + `state`
              - `firstName` + `surName` + `country` + `email`
              - `firstName` + `surName` + `country` + `mobileNumber`
              - `mobileNumber` + `country`
              - `email` + `country`
              - `nationalId` + `country`
          type: array
          items:
            type: string
            enum:
              - kyc
        firstName:
          $ref: '#/components/schemas/FirstName'
        surName:
          $ref: '#/components/schemas/Surname'
        gender:
          type: string
          enum:
            - Male
            - Female
            - Self Identify
          description: |
            The consumer's gender.
            > **Note**: This field is applicable only to the eKYC workflow.
          example: Male
        dob:
          $ref: '#/components/schemas/DOB'
        nationalId:
          $ref: '#/components/schemas/NationalID'
        driverLicense:
          type: string
          description: >
            The driver's license ID number as it appears on the consumer's
            driver's license card.
          example: '457345340'
        driverLicenseState:
          type: string
          description: >
            The driver's license state as it appears on the consumer's driver's
            license card.
          example: NY
          maxLength: 255
        mobileNumber:
          $ref: '#/components/schemas/MobileNumber'
        homeNumber:
          $ref: '#/components/schemas/HomeNumber'
        physicalAddress:
          $ref: '#/components/schemas/PhysicalAddress'
        physicalAddress2:
          $ref: '#/components/schemas/PhysicalAddress2'
        city:
          $ref: '#/components/schemas/City'
        state:
          $ref: '#/components/schemas/State'
        zip:
          $ref: '#/components/schemas/Zip'
        country:
          $ref: '#/components/schemas/Country'
        userConsent:
          type: boolean
          description: >
            Indicates if the consumer has provided consent.

            > **Note**: `userConsent` is required and must be set to `true` when
            implicitly calling eCBSV with the `kyc` module. To skip the eCBSV
            module and still process the transaction with the `kyc` module, set
            the field value to `null`.
