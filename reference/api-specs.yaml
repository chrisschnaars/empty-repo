          $ref: '#/components/schemas/CustomerProfile'
    SigmaSyntheticFraudResponse:
      title: Sigma Synthetic
      description: >
        Contains reason codes and a score indicating the likelihood an identity
        is synthetic.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        synthetic:
          type: object
          description: Contains the synthetic risk score and reason codes.
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I912
                - R557
                - R615
            scores:
              type: array
              items:
                type: object
                properties:
                  name:
                    description: >-
                      The name of the fraud classification model mapped to your
                      account.
                    type: string
                    example: synthetic
                  version:
                    description: >-
                      The version number of the fraud classification model
                      mapped to your account.
                    type: string
                    example: '4.5'
                  score:
                    description: >-
                      A probabilistic value between `0.001` and `0.999` that
                      predicts the probability that the combination of PII
                      provided at the input corresponds to a fictitious person.
                    type: number
                    example: 0.911
            signals:
              type: object
              description: Signals returned by the Sigma Identity Fraud product.
              properties:
                fullName:
                  type: object
                  description: The `fullName` primary key.
                  properties:
                    firstNamePerplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        gibberish or non-sensical patterns in the first name.
                        Range: 0.0–1.0.
                      example: 0.964
                    lastNamePerplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        gibberish or non-sensical patterns in the last name.
                        Range: 0.0–1.0.
                      example: 0.505
                    perplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        gibberish or non-sensical patterns. Range: 0.0–1.0.
                      example: 0.272
                nationalId:
                  type: object
                  description: The `nationalId` primary key.
                  properties:
                    type:
                      type: string
                      description: The type of national ID, specified as "ssn" or "itin".
                      example: ssn
                    isRandomized:
                      type: boolean
                      description: Whether the national ID follows randomized issuance.
                      example: false
                    issueState:
                      type: string
                      description: >-
                        The state where the national ID was issued. If the state
                        cannot be resolved, such as for randomized SSNs, the
                        value will be "unknown".
                      example: new york
                    issueYearStart:
                      type: integer
                      description: >-
                        The earliest year during which the national ID may have
                        been issued. Issue start years can only be resolved for
                        national IDs of type "ssn" that do not follow randomized
                        issuance.
                      example: 2009
                    issueYearEnd:
                      type: integer
                      description: >-
                        The last year during which the national ID may have been
                        issued. Issue end years can only be resolved for
                        national IDs of type "ssn" that do not follow randomized
                        issuance.
                      example: 2010
                    issueStateMatchesPhoneState:
                      type: boolean
                      description: >-
                        Whether the issue state of the national ID is the same
                        as the state that corresponds to the phone number’s area
                        code. Can only be true for national IDs of type "ssn"
                        that do not follow randomized issuance. Depends on
                        mobileNumber.
                      example: true
                    perplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        non-sensical patterns. Range: 0.0–1.0.
                      example: 0.043
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the national ID matches a list of commonly used
                        filler values.
                      example: false
                    countUniqueFirstNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique first names tied to the national ID in
                        credit header data.
                      example: 2
                    countUniqueLastNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique last names tied to the national ID in
                        credit header data.
                      example: 1
                    countUniqueMiddleNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique middle names tied to the national ID in
                        credit header data.
                      example: 0
                    countUniqueCurrentPhoneCreditHeader:
                      type: integer
                      description: >-
                        Number of unique phone numbers currently tied to the
                        national ID in credit header data.
                      example: 2
                    countUniqueAddressCreditHeader:
                      type: integer
                      description: >-
                        Number of unique addresses tied to the national ID in
                        credit header data.
                      example: 1
                    countUniqueDobCreditHeader:
                      type: integer
                      description: >-
                        Number of unique dates of birth tied to the national ID
                        in credit header data.
                      example: 1
                    countActiveMilitaryCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the national ID that
                        are assigned to active-military members.
                      example: 3
                    countActiveMilitaryExtendedFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the national ID that
                        are assigned to active-military members and flagged as
                        having extended fraud alerts.
                      example: 0
                    countActiveMilitaryInitialFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the national ID that
                        are assigned to active-military members and flagged as
                        having initial fraud alerts.
                      example: 1
                    countExtendedFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the national ID that
                        are flagged as having extended fraud alerts.
                      example: 1
                    countInitialFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the national ID that
                        are flagged as having initial fraud alerts.
                      example: 1
                    countDeceasedCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files marked as deceased tied to the
                        national ID.
                      example: 0
                    countInquiryRecords:
                      type: integer
                      description: Number of inquiry data records tied to the national ID.
                      example: 6
                    timeBetweenInquiriesAverage:
                      type: integer
                      description: >-
                        Average time period (in days) between inquiry records
                        associated with the national ID.
                      example: 189
                    timeBetweenInquiriesMax:
                      type: integer
                      description: >-
                        Longest time period (in days) between inquiry records
                        associated with the national ID.
                      example: 412
                    timeBetweenInquiriesMin:
                      type: integer
                      description: >-
                        Shortest time period (in days) between inquiry records
                        associated with the national ID.
                      example: 15
