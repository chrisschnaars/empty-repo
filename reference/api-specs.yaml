      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        globalWatchlist:
          type: object
          description: >-
            Contains reason codes and information about matches on monitored
            lists.
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
            matches:
              type: object
              description: >
                This object contains one or more source list keys relevant to
                the input entity. For each retrieved source list key, the
                associated data is presented in an array of objects.

                > **Note**: The details contained within the `matches` object
                will be dynamic based on the source information.
              additionalProperties:
                type: array
                items:
                  type: object
              properties:
                source-list-key:
                  description: >-
                    An array of objects that contain match details of the input
                    entity to this specific source list.
                  type: array
                  items:
                    type: object
                    properties:
                      entityId:
                        description: A 30 character ID representative of an entity.
                        type: string
                      matchFields:
                        description: >
                          Array containing the name and DOB match type. Below
                          are the possible values. 
                            * `nameExact`: Exact name match.
                            * `nameFuzzy`: Fuzzy name match.
                            * `nameEquivalent`: Name match based on the same name meaning.
                            * `removedPersonalTitle`: Partial name match due to the removal of an honorary title within the input name such as (Dr, Mr, Queen, etc.).
                            * `nameInitialized`: Name match based on initials.
                            * `namePhonetic`: Name match based on phonetic similarity.
                            * `akaExact`: Exact alias match.
                            * `akaFuzzy`: Fuzzy alias match.
                            * `akaEquivalent`: Alias match based on the same alias meaning.
                            * `akaPhonetic`: Alias name match based on phonetic similarity.
                            * `dobExact`: DOB matches year, month, and day.
                            * `dobFuzzy`: DOB is within one year (+/-) from the entered DOB.
                            * `dobNotOnRecord`: The source either does not contain a DOB for the matched entity, or the entered DOB does not match the data on the file.                 
                        type: array
                        items:
                          type: string
                      sourceUrls:
                        description: >-
                          Link to the source/ article where the matched entity
                          was listed/found.
                        type: array
                        items:
                          type: string
                      comments:
                        description: >
                          The `comments` object contains dynamic data that
                          varies based on the source. It may include personal
                          details, sanctions information, identifiers, and
                          aliases, but the keys and values can differ depending
                          on the data source.


                          A general JSON schema for the `comments` object is as
                          follows:


                          - Keys are dynamic and can vary by source.

                          - Values can be strings, arrays, or serialized
                          objects.


                          **Example structure**:


                          ```json

                          "comments": {
                            "key1": ["value1", "value2"],
                            "key2": "value3",
                            "key3": [
                              "{'nestedKey': 'value'}",
                              "{'nestedKey2': 'value2'}"
                            ]
                          }

                          ```

                          **Note**:
                            - Key behaviors: 
                              - Missing keys are handled by being omitted or set to `null`.
                              - Unexpected keys are either ignored or passed through.
                            - We recommend dynamically handling the `comments` object by:
                              - Iterating over key-value pairs.
                              - Conditionally parsing serialized or nested values.

                          **Payload example: OFAC source**

                          ```json title="Example 1: OFAC source"

                          "comments": {
                            "listName": ["SDN List"],
                            "program": ["GLOMAG"],
                            "name": ["Olesya Anatolevna Mendeleeva"],
                            "countries": ["RU"],
                            "aka": ["Alias1", "Alias2"]
                          }

                          ```  

                          **Payload example: Another source**
                            ```json title="Example 2: Another source"
                            "comments": {
                              "sanctionsType": ["Entity"],
                              "identifier": ["12345"],
                              "programCode": ["ABC"],
                              "additionalInfo": [
                                "{'infoType': 'Notes', 'content': 'Additional details here'}"
                              ]
                            }                        
                            ```
                          **Mapping table**:
                            | Key               | Source (Example)      | Description                                 |
                            |-------------------|-----------------------|---------------------------------------------|
                            | `listName`        | OFAC                  | Represents the sanction list name (e.g., SDN List). |
                            | `sanctionsType`   | Another Source        | Describes the type of sanction (e.g., Entity). |
                            | `identifier`      | Another Source        | A unique identifier for the entity.        |
                            | `aka`             | OFAC                  | Alias names for the entity or individual.   |
                            | `programCode`     | Another Source        | Code for the sanction program (e.g., ABC).   |
                            | `countries`       | OFAC                  | Countries associated with the sanctions.    |
                        type: object
                        properties:
                          name:
                            description: >-
                              The full name of an individual according to the
                              data source.
                            type: array
                            items:
                              type: string
                          offense:
                            description: >-
                              Lists all the watchlist sub-categories for which
                              the entity matched.
                            type: array
                            items:
                              type: string
                          aka:
                            description: >-
                              Also known as. Other names used by the individual
                              according to the data source.
                            type: array
                            items:
                              type: string
                          dateOfBirth:
                            description: The listed entity's date of birth.
                            type: array
                            items:
                              type: string
                              format: date
                              pattern: ^\d{4}-\d{2}-\d{2}$
                          country:
                            description: >-
                              The nation associated with the individual's place
                              of residence, origin or citizenship according to
                              the data source.
                            type: array
                            items:
                              type: string
                          originalCountryText:
                            description: >-
                              The country where the individual was originally
