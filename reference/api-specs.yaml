                    deviceModels:
                      - moto g
                    deviceIsps:
                      - at&t
                    deviceLanguages:
                      - en-us
                    deviceTimezones:
                      - america/los_angeles
                    networkLocationStates:
                      - or
                    networkLocationPostalCodes:
                      - '56789'
                - entity: '111223333'
                  entityType: nationalId
                  profile:
                    seenCount: 3
                    firstSeen: '2023-01-15T09:30:00Z'
                    lastSeen: '2023-09-10T14:45:00Z'
                    deviceTypes:
                      - phone
                      - tablet
                    deviceModels:
                      - GT70053G
                    deviceIsps:
                      - comcast
                    deviceLanguages:
                      - de_us
                    deviceTimezones:
                      - america/chicago
                    networkLocationStates:
                      - il
                    networkLocationPostalCodes:
                      - '12345'
            velocityMetrics:
              type: object
              description: >-
                Contains historical metrics based on the number of unique email
                addresses, phone numbers, first names, and surnames that have
                been included in API calls to ID+ with a given
                `deviceSessionId`.
              properties:
                historicalCount:
                  type: object
                  description: Historical metrics for the device.
                  properties:
                    firstName:
                      type: object
                      description: >-
                        Contains historical first name information associated
                        with the device.
