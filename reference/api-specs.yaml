    KYCPlusResponse:
      title: Socure Verify Plus (KYC Plus)
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        kycPlus:
          description: Contains the field validations and reason codes.
          type: object
          properties:
            socureId:
              type: string
              description: A persistent unique identifier for the transaction.
              example: ab06216f-b88b-4be8-8075-933bb5c2303c
            nationalId:
              type: string
              description: >-
                The consumer's nine-digit Social Security number (SSN) or
                Individual Tax Identification Number (ITIN).
              example: '123456789'
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I919
                - I351
            fieldValidations:
              $ref: '#/components/schemas/FieldValidationsKycPlus'
            sourceAttribution:
              type: array
              items:
                type: string
              example:
                - Credit
                - Alternative Credit
                - Education
                - Property Tax
                - Government
                - Familial Confirmation
              description: >-
                The specific categories of data sources utilized to resolve an
                identity, such as Credit, Alternative Credit, Education,
                Property Tax, and Government.
            transactionScope:
              type: string
              description: >-
                Indicates the scope of the transaction (domestic or
                international).
              example: domestic
            sportLeague:
              description: The sports league associated with the entity.
              type: array
              items:
                type: string
              example:
                - NBA
            connections:
              description: >-
                A list of entities connected to the best-matched entity, each
                identified by its Socure ID and full name.
              type: array
              items:
                type: object
                properties:
                  socureId:
                    type: string
                    description: The persistent unique identifier of the connected entity.
                    example: ff6bc013-5cd9-44d5-9da4-bdb04b4003ee
                  fullName:
                    type: string
                    description: The full name of the connected entity.
                    example: Melissa Smith
            bestMatchedEntity:
              description: >
                Contains the resolved PII of the best-matched entity, the
                normalized input address,

                and up to three prior addresses associated with the best-matched
                entity, if available.
              type: object
              properties:
                firstName:
                  description: The first name of the best-matched entity.
                  type: string
                  example: Dwayne
                middleName:
                  description: The middle name of the best-matched entity.
                  type: string
                  example: Denver
                surName:
                  description: The surname of the best-matched entity.
                  type: string
                  example: Twain
                suffix:
                  description: The suffix of the best-matched entity.
                  type: string
                  example: Jr
                ssn:
                  description: >-
                    The national identification number of the best-matched
                    entity. For the US, it's the nine-digit Social Security
                    Number.
                  type: string
                  example: '461118208'
                ssnIssued:
                  description: The date the above Social Security Number was issued.
                  type: string
                  format: datetime
                dob:
                  description: The date of birth of the best-matched entity.
                  type: string
                  example: '1975-04-02'
                mobileNumber:
                  description: The phone number for the best-matched entity.
                  type: string
                  example: '12063588927'
                emailAddress:
                  description: The primary email address for the best-matched entity.
                  type: string
                  example: denver@example.com
                deceasedDate:
                  description: The date on which the person died.
                  type: string
                  example: '2021-10-01'
                normalizedAddress:
                  description: >
                    The input address fields formatted in the standard approved
                    by the postal body of the input country. 

                    For US addresses, the address will be formatted according to
                    USPS standards.
                  type: object
                  properties:
                    streetAddress:
                      description: The street address of the normalized input address.
                      type: string
                      example: 200 Key Square St
                    city:
                      description: >-
                        The city in which the normalized input address is
                        located.
                      type: string
                      example: Brownsville
                    state:
                      description: >-
                        The state in which the normalized input address is
                        located.
                      type: string
                      example: TN
                    zip:
                      description: >-
                        The ZIP code in which the normalized input address is
                        located.
                      type: string
                      example: '38012'
                    county:
                      type: string
                      description: >-
                        The county in which the normalized input address is
                        located.
                      example: US
                associatedPhoneNumbers:
                  type: array
                  description: >
                    A list of phone numbers associated with the consumer,
                    including when each number was first and most recently seen
                    in available records.
                  items:
                    type: object
                    properties:
                      phoneNumber:
                        type: string
                        description: >-
                          The phone number in E.164 format, including country
                          code.
                        example: '+12063588927'
                      firstSeenDate:
                        type: string
                        format: date
                        description: The date the phone number was first observed.
                        example: '2010-03-01'
                      lastSeenDate:
                        type: string
                        format: date
                        description: >-
                          The timestamp of the most recent presentation of the
                          data.
                        example: '2023-05-08'
                      isMatched:
                        type: boolean
                        description: >-
                          Indicates whether the phone number was matched to the
                          best-matched entity.
                        example: true
                      isLatest:
                        type: boolean
                        description: >-
                          Indicates whether this phone number is the most recent
                          (current) number associated with the best-matched
                          entity.
                        example: true
                associatedAddresses:
                  type: array
                  description: >
                    A list of physical mailing addresses associated with the
                    consumer. Includes the address details and the date each
                    address was first seen.
                  items:
                    type: object
                    properties:
                      streetAddress:
                        type: string
                        description: >-
                          The street address, including house number and street
                          name.
                        example: 108 Smokerise Blvd
                      city:
                        type: string
                        description: The city in which the address is located.
                        example: Longwood
                      state:
                        type: string
                        description: The two-letter U.S. state abbreviation.
                        example: FL
                      zip:
                        type: string
                        description: The ZIP code or postal code for the address.
                        example: 32779-3315
                      county:
                        type: string
                        description: >-
                          The county associated with the best-matched entity’s
                          address.
                        example: US
                      firstSeenDate:
                        type: string
                        format: date
                        description: The date the address was first observed.
                        example: '2022-03-01'
                      lastSeenDate:
                        type: string
                        format: date
                        description: >-
                          The timestamp of the most recent presentation of the
                          data.
                        example: '2024-11-18'
                      lastSeenDateTrx:
                        type: string
                        format: date
                        description: >-
                          The date the address most recently appeared in a
                          transaction.
                        example: '2024-11-20'
                      isMatched:
                        type: boolean
                        description: >-
                          Indicates whether the address was matched to the
                          best-matched entity.
                        example: true
                      isLatest:
                        type: boolean
                        description: >-
                          Indicates whether this address is the most recent
                          (current) address associated with the best-matched
                          entity.
                        example: false
                associatedEmails:
                  description: >
                    Contains up to three email addresses for the best-matched
                    entity, if available.
                  type: array
                  items:
                    type: object
                    properties:
                      emailAddress:
                        type: string
                        description: >-
                          The email address associated with the best-matched
                          entity.
                        example: denver@example.com
                      firstSeenDate:
                        format: date
                        type: string
                        description: The timestamp of the initial presentation of the data.
                        example: '1999-09-12'
                      lastSeenDate:
                        type: string
                        format: date
                        description: >-
                          The timestamp of the most recent presentation of the
                          data.
                        example: '2010-09-13'
                      isMatched:
                        type: boolean
                        description: >-
                          Indicates whether the email was matched to the
                          best-matched entity.
                        example: true
                      isLatest:
                        type: boolean
                        description: >-
                          Indicates whether this email is the most recent
                          (current) email associated with the best-matched
                          entity.
                        example: false
                driverLicense:
                  description: >-
                    The driver's license number of the best-matched entity, as
                    it appears on the consumer's driver's license card.
                  type: string
                  example: S1234-56789-01234
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    Error400-missingParameters:
      title: 400 - Missing or Invalid Parameters
      description: >
        Invalid request. Please check for missing required parameters and
        resubmit the transaction.
      type: object
      properties:
        status:
          type: string
          example: Error
        referenceId:
          type: string
          format: uuid
          description: A unique identifier for this error.
          example: e68600b1-0fae-4098-8c86-bc0748ed513d
        data:
          properties:
            parameters:
              type: array
              description: List of missing parameters or required parameters.
              items:
                type: string
        msg:
          type: string
          description: A short description of the error.
          example: Missing required field.
    Error400-missingPermissions:
      title: 400 - Missing Permissions
      description: |
        The ID+ key isn't provisioned to serve the request.
      type: object
      properties:
        status:
          type: string
          example: Error
        referenceId:
          type: string
          format: uuid
          description: A unique identifier for this error.
          example: e68600b1-0fae-4098-8c86-bc0748ed513d
        data:
          description: |
            Contains an object or array that describes the error.  
          properties:
            permissions:
              type: array
              description: List of missing permissions
              items:
                type: string
        msg:
          type: string
          description: A short description of the error.
          example: Missing required field.
    Error400-missingModules:
      title: 400 - Missing or mutually exclusive modules
      description: |
        Missing modules or mutually exclusive modules
      type: object
      properties:
        status:
          type: string
          example: Error
        referenceId:
          type: string
          format: uuid
          description: A unique identifier for this error.
          example: e68600b1-0fae-4098-8c86-bc0748ed513d
        data:
          description: |
            Contains an object or array that describes the error.
          type: array
          items:
            type: string
        msg:
          type: string
          description: A short description of the error.
          example: Missing required field.
    Error401:
      title: 401 - Unauthorized
      type: object
      description: >
        There are invalid parameters in the request. See the 'msg' object for a
        description of the parameter that caused the error. May or may not
        return additional objects parameters or permissions, based on where the
        error occurs.
      properties:
        status:
          description: The status of the request.
          type: string
          example: Error
        referenceId:
          description: A unique identifier for this error.
          type: string
          format: uuid
          example: 7ff0cdc5-395e-45d1-8467-0ff1b41c11dc
        msg:
          type: string
          description: A short description of the error.
          example: No active account is associated with this request.
    Error403-invalidKey:
      title: 403 - Invalid ID+ Key
      description: |
        The ID+ key isn't provisioned to serve the request.
      type: object
      properties:
        status:
          type: string
          example: Error
        referenceId:
          type: string
          format: uuid
          description: A unique identifier for this error.
          example: d507b12e-515c-44c9-a55b-8a27144ba574
        msg:
          type: string
          description: A short description of the error.
          example: The API key isn't provisioned to serve the request.
    Error403-invalidDomain:
      title: 403 - Invalid Domain
      description: |
        Invalid domain. The domain making the request isn't authorized.
      type: object
      properties:
        referenceId:
          type: string
          format: uuid
          example: 01b6b639-83a7-4036-bd22-fcae65185490
        msg:
          type: string
          example: Invalid domain. The domain making the request isn't authorized.
    Error404:
      title: 404 - The requested resource doesn't exist.
      type: object
      description: |
        The requested resource doesn't exist.
    Error429:
      title: 429 - Too Many Requests
      type: object
      description: >
        You've hit a rate limit. Contact Technical Support to see how we can
        help you scale responsibly. We default all clients to a rate limit of 10
        transactions per second (TPS) per ID+ key (except the Image Request
        endpoint, which has a rate limit of 1 TPS).
      properties:
        status:
          description: The status of the request.
          type: string
          example: Error
        referenceId:
          description: A unique identifier for this error.
          type: string
          format: uuid
          example: 7ff0cdc5-395e-45d1-8467-0ff1b41c11dc
        msg:
          type: string
          description: A short description of the error.
          example: >-
            You've hit a rate limit. Contact our support group at
            support@socure.com to see how we can help you scale responsibly.
    UpdateCustomWatchlist:
      title: Update a Custom Watchlist
      type: object
      required:
        - actionType
        - customListName
        - customWatchlistRecord
      properties:
        actionType:
          type: string
          description: >-
            The type of action being performed on the record included in the
            request.
          enum:
            - add
            - change
            - delete
          example: change
        customListName:
          type: string
          description: The custom watchlist to be updated.
          example: Self Exclusion Alerts
        customWatchlistRecord:
          type: object
          description: >-
            Details about the record that will be added, updated, or removed
            from the custom Global Watchlist.
          required:
            - recordId
            - entityName
          properties:
            recordId:
              type: string
              description: A unique identifier of the record. Must be a unique value.
            listOrigin:
              type: string
              description: The list origin.
            entityType:
              type: string
              description: >-
                The entity type. Possible values are `Individual`,
                `Organisation`, `Vessel`, `Aircraft`, `Others`.
            entityName:
              type: string
              description: The entity's full name. Must not contain special characters.
            akas:
              type: array
              items:
                type: string
              description: A list of known aliases that are associated with the entity.
            streetAddress:
              type: string
              description: The entity's street address.
            city:
              type: string
              description: The city where the entity resides.
            state:
              type: string
              description: The state, province, or region where the entity resides.
            country:
              type: string
              description: >-
                The country where the entity resides, specified in ISO 3166-1
                alpha-2 format.
            zip:
              type: string
              description: The entity's ZIP code in valid postal address format.
            nationalIds:
              type: array
              items:
                type: string
              description: >-
                A list of the entity's government-issued identification
                documents.
            drivingLicenseNumbers:
              type: array
              items:
                type: string
              description: A list of the entity's driver's license numbers.
            passports:
              type: array
              items:
                type: string
              description: A list of the entity's passport numbers.
            otherIdentifiers:
              type: array
              items:
                type: string
              description: >-
                A list of other identifiers that can be used to identify the
                entity.
            nationalities:
              type: array
              items:
                type: string
              description: A list of the entity's nationalities.
            dateOfBirth:
              type: array
              items:
                type: string
              description: >-
                A list of birth dates that are associated with the entity,
                specified as YYYY-MM-DD, YYYY-MM, or YYYY.
            placeOfBirth:
              type: array
              items:
                type: string
              description: A list of birth places that are associated with the entity.
            phoneNumbers:
              type: array
              items:
                type: string
              description: >-
                A list of phone numbers that are associated with the entity.
                Must comply with the E.164 standard. A mobile phone number is
                recommended.
            emails:
              type: array
              items:
                type: string
              description: A list of email addresses that are associated with the entity.
            occupations:
              type: array
              items:
                type: string
              description: A list of occupations that are associated with the entity.
            designation:
              type: string
              description: >-
                The description, name, or title that is associated with the
                entity.
            gender:
              type: string
              description: The entity's gender.
            relatedUrls:
              type: array
              items:
                type: string
              description: >-
                A list of URLs that are associated with the entity such as
                websites, social network accounts.
            listedOn:
              type: string
              description: >-
                The date the entity was listed on the Global Watchlist,
                specified as YYYY-MM-DD.
            isPep:
              type: string
              description: >-
                Specifies `YES` if the entity is a PEP; otherwise, specifies
                `NO`.
            dateOfDeath:
              type: array
              items:
                type: string
              description: >-
                A list of death dates that are associated with the entity,
                specified as YYYY-MM-DD, YYYY-MM, or YYYY.
            listingType:
              type: string
              description: The listing classification such as Listed, Exception, or Alert.
            officialReference:
              type: string
              description: >-
                Any internal or external reference ID or reference details
                related to the entity.
            accountNumbers:
              type: array
              items:
                type: string
              description: A list of account numbers that are associated with the entity.
            cryptoWalletIds:
              type: array
              items:
                type: string
              description: A list of crypto wallets that are associated with the entity.
            activeStartDate:
              type: string
              description: The date from which the entity is identified as risky.
            additionalInformation:
              type: string
              description: Additional information that us related to the entity.
            otherLinks:
              type: string
              description: Additional URLs that are related to the entity.
            others:
              type: string
              description: Additional data or information that is related to the entity.
    UpdateCustomWatchlistResponse:
      title: Updated Custom Watchlist
      type: object
      properties:
        status:
          type: string
          description: The request status.
          example: Ok
        referenceId:
          type: string
          description: A unique reference ID for the request.
          example: 5e1c9e83-a3a8-45b5-9d1d-8d0426ee2bbc
        data:
          type: object
          properties:
            recordId:
              type: string
              description: >-
                The unique identifier of the record in the custom Global
                Watchlist.
              example: '1234554443456'
            success:
              type: boolean
              description: >-
                Returns `true` if the request was successfully executed;
                otherwise, returns `false`.
              example: true
        msg:
          type: string
          description: Additional message from the system.
          example: Custom watchlist record successfully added
    data:
      title: Missing or Invalid Parameters
      type: object
      properties:
        parameters:
          type: array
          description: List of missing parameters or required parameters
          items:
            type: string
        referenceId:
          description: A unique identifier for this error.
          type: string
          format: uuid
    data-2:
      title: Missing Permissions
      type: object
      properties:
        permissions:
          type: array
          description: List of missing permissions
          items:
            type: string
        referenceId:
          description: A unique identifier for this error.
          type: string
          format: uuid
    Error400:
      type: object
      description: >
        There are invalid parameters in the request. See the 'msg' object for a
        description of the parameter that caused the error. May or may not
        return additional objects parameters or permissions, based on where the
        error occurs.
      properties:
        status:
          description: The status of the request.
          type: string
        referenceId:
          description: A unique identifier for this error.
          type: string
          format: uuid
        data:
          description: |
            Contains an object or array that describes the error.
          oneOf:
            - $ref: '#/components/schemas/data'
            - $ref: '#/components/schemas/data-2'
        msg:
          type: string
          description: A short description of the error.
      example:
        status: Error
        referenceId: 7ff0cdc5-395e-45d1-8467-0ff1b41c11dc
        msg: >-
          Invalid request. Please check for missing required parameters and
          resubmit the transaction.
    ReasonCodesResponse:
      title: Reason Code Response
      type: object
      description: |
        Reason Code Response object.
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        reasonCodes:
          type: object
          description: A list of reason codes available in ID+.
    TransactionDetailsResponse:
      title: Transaction Details Response
      type: object
      description: |
        Transaction Details Response object.
      properties:
        referenceId:
          type: string
          description: A unique reference ID for this transaction.
          example: 123ab45d-2e34-46f3-8d17-6f540ae90303
        data:
          type: object
          description: >
            An object that contains the transaction details.

            > **Note**: The data included in the response is based on the
            modules selected during transaction creation.
          properties:
            referenceId:
              $ref: '#/components/schemas/ReferenceID'
            accountIntelligence:
              description: Contains the `account` object and reason codes.
              type: object
            alertList:
              description: >-
                Contains applicable reason codes and a `matches` array listing
                matching elements and related info across all Alert List
                datasets.
              type: object
            deceasedCheck:
              description: Contains the vital record and reason codes.
              type: object
            decision:
              type: object
              description: >-
                Contains the overall decision outcome for the transaction, along
                with individual module outcomes and the reason codes or scores
                that influenced each decision.
            digitalIntelligence:
              description: Contains additional information about the request.
              type: object
            documentVerification:
              description: Contains the ID+ response.
              type: object
            selfieReverification:
              description: Contains the selfie reverification results and reason codes.
              type: object
            addressRisk:
              description: Contains the address risk score and reason codes.
              type: object
            emailRisk:
              description: Contains the email risk score and reason codes.
              type: object
            deviceRisk:
              type: object
              description: Device Risk reason codes and risk score.
            deviceIdentityCorrelation:
              type: object
              description: Device-to-identity correlation reason codes.
            deviceData:
              type: object
              description: Information about a device.
            phoneRisk:
              description: Contains the phone risk score and reason codes.
              type: object
            kyc:
              description: Contains the field validations and reason codes.
              type: object
            eCBSV:
              type: object
              description: >-
                Contains actionable reason codes based on the information
                received from the Social Security Administration.
            prefill:
              type: object
              description: >
                Contains the first five digits of the consumer's Social Security
                Number (SSN) or Tax Identification Number (ITIN).
            fraud:
              description: >-
                Contains the fraud risk score, reason codes, and fraud
                classification model details.
              type: object
            firstPartyFraud:
              description: Contains the `signals` object and reason codes.
              type: object
            synthetic:
              type: object
              description: Contains the synthetic risk score and reason codes.
            globalWatchlist:
              type: object
              description: >-
                Contains reason codes and information about matches on monitored
                lists.
    DocumentRequestEndpointV5:
      title: Document Request Endpoint v5
      type: object
      properties:
        config:
          type: object
          description: |
            The configurations for the document request transaction.
          properties:
            sendMessage:
              type: boolean
              description: >
                Set to `true` (boolean) to enable the SMS text message
                containing the document request URL. This field is set to
                `false` by default.

                > **Note:** SMS behavior varies by region:

                > - **US & Canada**: Messages are sent from our approved short
                code `33436`.

                > - **All other countries**: Messages are sent from our long
                code `+15103301986`.
              example: false
            language:
              type: string
              description: >
                Specifies the language package for the Capture App. Below are
                the possible values.

                - Automatic (device default): `auto`

                - Arabic: `ar`

                - Arabic (Saudi Arabia): `ar-sa`

                - Armenian: `hy`

                - Bengali: `bn`

                - Chinese (Hong Kong): `zh-hk`

                - Chinese (Simplified): `zh-cn`

                - Chinese (Traditional): `zh-tw`

                - Czech: `cs-cz`

                - Danish: `da-dk`

                - Dutch: `nl-nl`

                - English: `en`

                - English (Australian): `en-au`

                - English (Canadian): `en-ca`

                - English (United Kingdom): `en-gb`

                - English (United States): `en-us`

                - Finnish: `fi-fi`

                - French: `fr`

                - French (Canada): `fr-ca`

                - German: `de-de`

                - Haitian Creole: `ht`

                - Hebrew: `he-il`

                - Hindi: `hi-in`

                - Hungarian: `hu-hu`

                - Indonesian: `id-id`

                - Italian: `it`

                - Italian (Switzerland): `it-ch`

                - Japanese: `ja-jp`

                - Korean: `ko`

                - Malay: `ms-my`

                - Norwegian: `no-no`

                - Polish: `pl-pl`

                - Portuguese (Brazil): `pt-br`

                - Portuguese (Portugal): `pt-pt`

                - Romanian (Moldova): `ro-mo`

                - Romanian (Romania): `ro-ro`

                - Russian: `ru`

                - Slovak: `sk-sk`

                - Spanish: `es`

                - Spanish (Argentina): `es-ar`

                - Spanish (International): `es-001`

                - Spanish (Mexico): `es-mx`

                - Spanish (Spain): `es-es`

                - Spanish (US): `es-us`

                - Swedish: `sv-se`

                - Tagalog: `tl`

                - Thai: `th-th`

                - Turkish: `tr-tr`

                - Urdu: `ur`

                - Vietnamese: `vi`


                Set `language` to `auto` to use the consumer's device default
                language. If the device's default language isn't supported, the
                Capture App defaults to English (`en`).
              example: en-us
              default: en-us
              enum:
                - auto
                - ar
                - ar-sa
                - bn
                - cs-cz
                - da-dk
                - de-de
                - en
                - en-au
                - en-ca
                - en-gb
                - en-us
                - es
                - es-001
                - es-ar
                - es-es
                - es-mx
                - es-us
                - fi-fi
                - fr
                - fr-ca
                - he-il
                - hi-in
                - ht
                - hu-hu
                - hy
                - id-id
                - it
                - it-ch
                - ja-jp
                - ko
                - ms-my
                - nl-nl
                - no-no
                - pl-pl
                - pt-br
                - pt-pt
                - ro-mo
                - ro-ro
                - ru
                - sk-sk
                - sv-se
                - th-th
                - tl
                - tr-tr
                - ur
                - vi
                - zh-cn
                - zh-hk
                - zh-tw
            useCaseKey:
              type: string
              description: >
                The name of the flow (created in Admin Dashboard) to use with
                this transaction. Flow names cannot contain dashes (`-`); use
                underscores instead.

                > **Note**: Deploys a customized Capture App flow on a
                per-transaction basis. Replace the `customer_use_case_key` value
                with the name of the flow you created in Admin Dashboard. <br />
                  -  If this field is empty, the Capture App will use the flow marked as Default in Admin Dashboard.<br />
                  - If the value provided is incorrect, the SDK will return an `Invalid Request` error.
              properties:
                name:
                  type: string
                  description: The name of the flow (created in Admin Dashboard).
                  example: flow_1
            redirect:
              type: object
              description: >-
                Optional URL settings that redirect the consumer after the
                document capture and upload process is cancelled or completed on
                the Capture App.
              properties:
                url:
                  type: string
                  description: >
                    Specifies the redirect destination URL.

                    > **Note**: This field is required if `redirect` is
                    provided. 
                  example: https://www.example.com
                method:
                  type: string
                  description: >
                    The redirect method. 

                    > **Note**: This field is required if `redirect` is
                    provided. 
                  example: GET
                  default: POST
                  enum:
                    - GET
                    - POST
                headers:
                  type: object
                  description: >
                    Specifies an optional object where you can define custom
                    headers.
                  example: {}
                delay:
                  type: number
                  description: |
                    Adds a delay before redirecting, specified in milliseconds.
                  example: 3000
            documentType:
              type: string
              description: >
                Enables a simplified Capture App flow and allows you to select a
                default document type for the transaction using one of the
                values below.  

                - `license`: Driver's license / ID card 

                - `passport`: Passport


                > **Note**: Passing `documentType` with the value `license`  or
                `passport` implements a simplified Capture App flow that skips
                the Selected ID Type Screen and starts the flow on the Document
                Capture Screen.
              example: license
            multiDoc:
              type: object
              description: >-
                Configures a Multiple Document Capture transaction using your
                existing Document Verification or Secondary Document Capture
                flows.
              properties:
                documentTypes:
                  type: array
                  items:
                    type: string
                  description: >
                    Specifies the individual acceptable document types for a
                    Multiple Document Capture transaction as an array of strings
                    using the values below.

                    - `license`: Driver's license / ID card 

                    - `passport`: Passport

                    - Free-form text for secondary documents (e.g., `Bank
                    Statement` or `Utility Bill`)


                    > **Note**: The values entered in this field will be shown
                    to the consumer in the Capture App UI during the document
                    collection. The document types must be listed in the same
                    order as they are configured in the Multiple Document
                    Capture App flow in Admin Dashboard.
                  example:
                    - license
                    - Utility Bill
        previousReferenceId:
          type: string
          maxLength: 36
          description: >-
            The `referenceId` of a previous ID+ transaction. Allows you to link
            multiple transactions together. See [transaction
            linkage](/docs/transaction_linkage) for more information.
          example: e9c170f2-b3e4-423b-a373-5d6e1e9b23f8
        customerUserId:
          $ref: '#/components/schemas/CustomerUserID'
        firstName:
          $ref: '#/components/schemas/FirstName'
        surName:
          $ref: '#/components/schemas/Surname'
        dob:
          $ref: '#/components/schemas/DOB'
        mobileNumber:
          description: >
            The consumer’s phone number in E.164 format, which includes the
            country code (e.g., `+` followed by international dialing code and
            number).

            Hyphens are optional. A mobile phone number is preferred.


            Example formats:

            - United States: `+13475550100`

            - United Kingdom: `+447911123456`

            - Brazil: `+5511987654321`

            - India: `+919876543210`

            - Australia: `+61412345678`
        physicalAddress:
          $ref: '#/components/schemas/PhysicalAddress'
        physicalAddress2:
          $ref: '#/components/schemas/PhysicalAddress2'
        city:
          type: string
          description: |
            The consumer's city of residence in valid postal address format.

            > **Note**: `city` is required for international requests.
          example: Brownsville
        state:
          $ref: '#/components/schemas/State'
        zip:
          $ref: '#/components/schemas/Zip'
        country:
          type: string
          description: >
            The country where the consumer resides, specified in ISO 3166-1
            alpha-2 format.


            > **Note**: `country` is required for international requests.
          example: US
      additionalProperties: false
    DocumentRequestResponseV5:
      type: object
      title: Capture Request Response
      description: Contains additional information about the request.
      properties:
        referenceId:
          type: string
          format: uuid
          description: The reference ID for the initiation request.
        data:
          type: object
          description: Contains details for the document request.
          properties:
            eventId:
              type: string
              description: The event ID for the first event of the process.
              example: 20517507-7d9d-40d4-b330-d21a9ef226ab
            docvTransactionToken:
              type: string
              description: >
                The DocV transaction token. Use this value to complete the
                following actions: 

                - Initialize the DocV SDK v5.  

                - Fetch the verification results with the Predictive Document
                Verification module. 
              example: 78d1c86d-03a3-4e11-b837-71a31cb44142
            qrcode:
              type: string
              description: The base64-encoded value of the QR code.
              example: >-
                iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
            url:
              type: string
              description: The URL that initiates the Capture App flow on a mobile device.
              example: >-
                https://verify.socure.com/#/dv/6b17972b-b115-43fc-8759-5d887e67118b
            multiDoc:
              type: object
              description: >
                Contains a set of DocV transactions grouped under a common
                transaction identifier. 

                > **Note**: This object is only returned in Multiple Document
                Capture transactions. 
              properties:
                transactionGroupId:
                  type: string
                  format: uuid
                  description: >-
                    A unique identifier that groups the transactions in a
                    Multiple Document Capture session. To initialize the DocV
                    SDK, use the top-level `docvTransactionToken` instead.
                docvTransactions:
                  type: array
                  description: A list of DocV transactions associated with the group.
                  items:
                    type: object
                    properties:
                      docvTransactionToken:
                        type: string
                        format: uuid
                        description: >
                          The DocV transaction token for each uploaded document.
                          Use this value to fetch the verification results with
                          the Predictive Document Verification or Secondary
                          Document modules.  
                      module:
                        type: string
                        enum:
                          - documentverification
                          - secondarydocument
                        description: |
                          The module associated with each uploaded document.  
              example:
                transactionGroupId: 86f4042e-04a7-5f12-c970-32b58dc31952
                docvTransactions:
                  - docvTransactionToken: 78d1c86d-03a3-4e11-b837-71a31cb44142
                    module: documentverification
                  - docvTransactionToken: 891e1cac-ff1f-439d-8a22-11db6e35a607
                    module: secondarydocument
        customerProfile:
          type: object
          description: >-
            Contains the `customerUserId` and `userId` parameters, if included
            in the API request body.
          properties:
            customerUserId:
              type: string
              description: A client-specified unique identifier for the transaction.
              example: '111111'
            userId:
              type: string
              description: >-
                Contains a unique partner or integrator-specified identifier for
                the end-user.
