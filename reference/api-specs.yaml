              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - R1040
                - R1020
                - R1026
                - R1025
            signals:
              description: >-
                Lists the Sigma First-Party Fraud risk signals associated with
                the consumer identity. See [Sigma First-Party Fraud Risk
                Signals](/docs/risk_signals) for signal definitions.
              type: object
            scores:
              type: array
              description: >
                Lists a dedicated risk score focused on identifying repeat bad
                actors.
              items:
                type: object
                required:
                  - name
                  - version
                  - score
                properties:
                  name:
                    type: string
                    description: >
                      The name of the fraud detection model. Possible values
                      include:


                      - `Identity Manipulation` – Indicates the presence of
                      synthetic or manipulated identities.

                      - `Dispute Abuse` – Detects behavior consistent with
                      Regulation E abuse, often involving repeated claims of
                      unauthorized transactions.
                    example: Dispute Abuse
                  version:
                    type: string
                    description: The version of the model used to generate the score.
                    example: '1.0'
                  score:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    description: >
                      A normalized risk score from `0.0` to `1.00`. Higher
                      values indicate a greater likelihood that the consumer
                      exhibits behavior consistent with the model's target fraud
                      type. 


                      The range of possible values can be interpreted as
                      follows:


                      - **`0.99 – 1.00`**: Very high risk. Strong indicators of
                      dispute abuse activity across multiple signals in Socure
                      consortium data sources. Customers in this range have a
                      high likelihood of repeated or abusive dispute patterns.

                      - **`0.97 – 0.989`**: High risk. Multiple signals point
                      toward likely dispute abuse activity. Behavior patterns
                      closely resemble those of known abusers.

                      - **`0.90 – 0.969`**: Moderate to high risk. Some risk
                      indicators present, but with slightly lower certainty than
                      high-risk range.

                      - **`0.50 – 0.899`**: Moderate risk. Risk signals are
                      present but weaker or inconsistent.

                      - **`0.00 – 0.499`**: Low risk. Minimal or no clear
                      indicators of dispute abuse. Behavior aligns with typical,
                      non-abusive dispute patterns.
                    example: 0.72
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
    SigmaIdentityFraudResponse:
      title: Sigma Identity Fraud
      description: >
        The ID+ Fraud Score (fraud) is a number between 0 and 1 that helps
        predict the probability that the individual will commit a particular
        type of fraud.
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
        fraud:
          description: >-
            Contains the fraud risk score, reason codes, and fraud
            classification model details.
          type: object
          properties:
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I130
                - I129
                - I553
            scores:
              description: >-
                Contains the fraud risk score and fraud classification model
                details.
              type: array
              items:
                properties:
                  name:
                    description: >-
                      The name of the fraud classification model mapped to your
                      account.
                    type: string
                    example: Sigma
                  version:
                    description: >-
                      The version number of the fraud classification model
                      mapped to your account.
                    type: string
                    example: '4.5'
                  score:
                    description: >
                      Predicts the inherent fraud risk associated with the input
                      PII. A higher score indicates a greater likelihood of
                      fraud.
                    type: number
                    example: 0.0258
            signals:
              type: object
              description: Signals returned by the Sigma Identity Fraud product.
              properties:
                phone:
                  type: object
                  description: The `phone` primary key.
                  properties:
                    carrier:
                      type: string
                      description: Name of the carrier serving the phone number.
                      example: at&t
                    lineType:
                      type: string
                      description: >-
                        The type of phone line behind this phone number, e.g.,
                        "landline" or "wireless".
                      example: wireless
                    areaCodeState:
                      type: string
                      description: >-
                        The state that ties to the phone number based on the
                        phone area code.
                      example: ny
                    areaCodeCities:
                      type: string
                      description: >-
                        The cities that tie to the phone number's area code.
                        Ordered alphabetically, without spaces after commas.
                      example: white plains,yonkers
                    country:
                      type: string
                      description: The country of the phone number.
                      example: us
                    perplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        non-sensical patterns; range 0.0–1.0.
                      example: 0.748
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the phone number matches a list of commonly used
                        filler values.
                      example: false
                    countUniqueFirstNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique first names tied to the phone number in
                        credit header data.
                      example: 2
                    countUniqueLastNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique last names tied to the phone number in
                        credit header data.
                      example: 1
                    countUniqueMiddleNameCreditHeader:
                      type: integer
                      description: >-
                        Number of unique middle names tied to the phone number
                        in credit header data.
                      example: 0
                    countUniqueNationalIdCreditHeader:
                      type: integer
                      description: >-
                        Number of unique national IDs tied to the phone number
                        in credit header data.
                      example: 2
                    countActiveMilitaryCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        assigned to active-military members.
                      example: 3
                    countActiveMilitaryExtendedFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        assigned to active-military members and are flagged as
                        having extended fraud alerts.
                      example: 0
                    countActiveMilitaryInitialFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        assigned to active-military members and are flagged as
                        having initial fraud alerts.
                      example: 1
                    countExtendedFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        flagged as having extended fraud alerts.
                      example: 1
                    countInitialFraudAlertCreditFiles:
                      type: integer
                      description: >-
                        Number of credit files containing the phone that are
                        flagged as having initial fraud alerts.
                      example: 1
                    countInquiryRecords:
                      type: integer
                      description: Number of inquiry data records tied to the phone number.
                      example: 6
                    timeBetweenInquiriesAverage:
                      type: integer
                      description: >-
                        Average time period (in days) between inquiry records
                        associated with the phone number.
                      example: 189
                    timeBetweenInquiriesMax:
                      type: integer
                      description: >-
                        Longest time period (in days) between inquiry records
                        associated with the phone number.
                      example: 412
                    timeBetweenInquiriesMin:
                      type: integer
                      description: >-
                        Shortest time period (in days) between inquiry records
                        associated with the phone number.
                      example: 15
                email:
                  type: object
                  description: The `email` primary key.
                  properties:
                    domain:
                      type: string
                      description: The domain of the email address.
                      example: gmail.com
                    topLevelDomain:
                      type: string
                      description: The top-level part of the email domain.
                      example: com
                    isDeliverable:
                      type: boolean
                      description: >-
                        Whether the corresponding mailbox is active and emails
                        can be delivered to it.
                      example: true
                    isPrivateRelay:
                      type: boolean
                      description: Whether the email domain is a private relay domain.
                      example: false
                    perplexity:
                      type: number
                      description: >-
                        Measures unusual sequences to detect the presence of
                        non-sensical patterns in the email handle; range
                        0.0–1.0.
                      example: 0.09
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the email address matches a list of commonly
                        used filler values.
                      example: false
                    countNonEndingHandleDigits:
                      type: integer
                      description: >-
                        The number of digits in the email handle that are not at
                        the end of the handle.
                      example: 3
                    handleTypingDistance:
                      type: number
                      description: >-
                        A measure of how much distance exists between subsequent
                        keys used to type the email handle on a QWERTY keyboard.
                      example: 2.943
                    countUniqueEducationInstitutes:
                      type: integer
                      description: >-
                        The number of unique education institutes that the email
                        address is tied to.
                      example: 1
                address:
                  type: object
                  description: The `address` primary key.
                  properties:
                    correctedPostalCode:
                      type: string
                      description: >-
                        If address standardization resulted in a correction to
                        the input postal code, the corrected value is returned
                        here. Otherwise, this value will be null.
                      example: '10001'
                    postalExtension:
                      type: string
                      description: >-
                        Postal code extension. In the U.S., this is the last 4
                        digits of a 9-digit ZIP code.
                      example: '5294'
                    latitude:
                      type: number
                      description: Latitude of the address.
                      example: 49.03
                    longitude:
                      type: number
                      description: Longitude of the address.
                      example: -81.32
                    timezone:
                      type: string
                      description: >-
                        The regional timezone associated with where the address
                        is located. As a regional indicator of the timezone,
                        this value does not change based on Daylight Savings
                        Time.
                      example: america/new york
                    timezoneOffset:
                      type: integer
                      description: >-
                        The current offset of the address’s timezone compared to
                        GMT. Negative values indicate the timezone is west of
                        GMT and running behind GMT. Positive values indicate the
                        timezone is east of GMT and running ahead of GMT. The
                        offset is reported as an integer but does not indicate
                        minutes; every multiple of 100 indicates 1 hour and the
                        last two digits indicate additional minutes (e.g., 530 =
                        +5:30). This value changes with Daylight Savings Time.
                      example: -400
                    isDST:
                      type: boolean
                      description: >-
                        Whether the timezone where the address is located is
                        currently observing Daylight Savings Time (DST).
                      example: true
                    localHour:
                      type: integer
                      description: >-
                        The current hour of the day at the address location,
                        expressed in 24-hour format, ranging from 0 to 23.
                      example: 13
                    buildingType:
                      type: string
                      description: >-
                        The type of building at this address, specified as
                        "single-unit", "multi-unit", "p.o. box", or "general
                        delivery".
                      example: single-unit
                    purpose:
                      type: string
                      description: >-
                        The purpose of this address, including whether it is
                        commercial, residential, or related to educational,
                        military, or correctional purposes. Possible values are:
                        "university", "university housing", "military",
                        "correctional", "p.o. box", "commercial", "residential".
                      example: residential
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the address matches a list of commonly used
                        filler values.
                      example: false
                ip:
                  type: object
                  description: The `ipAddress` primary key.
                  properties:
                    isp:
                      type: string
                      description: >-
                        Name of the Internet Service Provider that owns this IP
                        address.
                      example: verizon
                    country:
                      type: string
                      description: Country where the IP address is located.
                      example: us
                    state:
                      type: string
                      description: State where the IP address is located.
                      example: ny
                    city:
                      type: string
                      description: City where the IP address is located.
                      example: new york
                    postalCode:
                      type: string
                      description: Postal code where the IP address is located.
                      example: '10001'
                    postalExtension:
                      type: string
                      description: >-
                        Postal code extension for the postal code where the IP
                        address is located. For U.S. addresses, this is the
                        4-digit extension to a 5-digit ZIP code.
                      example: '5203'
                    latitude:
                      type: number
                      description: >-
                        Latitude of the IP address’s location with two decimals
                        of precision.
                      example: 49.03
                    longitude:
                      type: number
                      description: >-
                        Longitude of the IP address’s location with two decimals
                        of precision.
                      example: -89.51
                    distanceToAddress:
                      type: integer
                      description: >-
                        Distance in miles between the IP address’s location and
                        the provided input address. Depends on the provided
                        address fields.
                      example: 1
                    distanceToPhone:
                      type: integer
                      description: >-
                        Distance in miles between the IP address’s location and
                        the central location for the phone number’s area code.
                        Depends on mobileNumber.
                      example: 5
                    timezone:
                      type: string
                      description: >-
                        The regional timezone associated with where the IP is
                        located. As a regional indicator, this value does not
                        change based on Daylight Savings Time.
                      example: america/new york
                    timezoneOffset:
                      type: integer
                      description: >-
                        The current offset of the IP’s timezone compared to GMT.
                        Negative values indicate the timezone is west of GMT and
                        running behind; positive values indicate the timezone is
                        east and running ahead. The offset is reported as an
                        integer but does not represent minutes; every multiple
                        of 100 indicates one hour, while the last two digits
                        represent additional minutes (e.g., 530 = +5:30). This
                        value changes with Daylight Savings Time.
                      example: -400
                    isDST:
                      type: boolean
                      description: >-
                        Whether the timezone where the IP is located is
                        currently observing Daylight Savings Time (DST).
                      example: true
                    localHour:
                      type: integer
                      description: >-
                        The current hour of the day at the IP’s location,
                        expressed in 24-hour format (0–23).
                      example: 13
                    isMobile:
                      type: boolean
                      description: >-
                        Whether the IP address is served by a mobile carrier for
                        mobile network usage.
                      example: true
                    mobileCarrier:
                      type: string
                      description: >-
                        Name of the carrier serving the mobile IP address. This
                        will always be null when ip.isMobile is false.
                      example: verizon
                    isVPN:
                      type: boolean
                      description: >-
                        Whether the IP address belongs to a Virtual Private
                        Network (VPN).
                      example: true
                    vpnProvider:
                      type: string
                      description: >-
                        Name of the VPN provider serving the IP address. This
                        will always be null when ip.isVPN is false.
                      example: surfshark.net
                    usageType:
                      type: string
                      description: >-
                        Indicates whether the IP address is designated for home
                        or business usage.
                      example: business
                    isFiller:
                      type: boolean
                      description: >-
                        Whether the IP address matches a list of commonly used
                        filler values. This usually points to an integration
                        issue.
                      example: false
