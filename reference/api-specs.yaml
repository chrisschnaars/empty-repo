              > - For individual, the following special characters are not supported: `^±!@£$%*_+¡€#¢§¶•ªº«<>?\/:;|=`
              > - For organization/vessel/aircraft/others type, the following special characters are not supported: `^±!%*_+¡¢§¶•ªº«<>?\/|=`.
              > - This field is required if `entityType` is included in the API request.
              > - To avoid errors, only use `entityName` and `entityType` fields when no additional modules are included in the request. 
        entityType:
