          example: '+13475550100'
          description: >
            The consumer’s phone number, preferably in E.164 format. Hyphens are
            optional. A mobile phone number is preferred.

            > **Note**: If the country code is missing, the system will default
            to a North American phone number.
          maxLength: 20
        email:
          type: string
          example: gem@gmail.com
          maxLength: 255
          description: |
            The consumer's email address.
        physicalAddress:
          type: string
          example: 200 Key Square St
          description: |
            The first line of the consumer's address.
          maxLength: 255
        physicalAddress2:
          $ref: '#/components/schemas/PhysicalAddress2'
        city:
          type: string
          example: Brownsville
          description: |
            The city where the consumer resides.
          maxLength: 255
        state:
          type: string
          minLength: 2
          maxLength: 2
          example: TN
          description: >
            The state, province, or region where the consumer resides, specified
            in ISO 3166-2 format.
        zip:
          type: string
          example: '38012'
          maxLength: 15
          description: >
            The consumer's five or nine-digit ZIP code in valid postal address
            format. Hyphens and spaces are optional.

            > **Note**: This field accepts a 9-digit zip code, with spaces
            allowed in place of hyphens (e.g., `94502 1397` instead of
            `94502-1397`).
        country:
          $ref: '#/components/schemas/Country'
        uniqueIdUser:
          type: string
          maxLength: 255
          example: '20688849'
          description: >
            Client provided unique User ID. This value may repeat itself across
            financial institutions by chance.
        uniqueIdAccount:
          type: string
          maxLength: 255
          example: '78456158930'
          description: >
            Client provided unique Account ID. This value may repeat itself
            across financial institutions by chance.
        previousReferenceId:
          $ref: '#/components/schemas/PreviousReferenceID'
        amount:
          type: number
          format: double
          example: 596.23
          description: >
            Transaction amount listed in US dollar and cents (negative if it's a
            debit from the account and positive if it's a credit).
        description:
          type: string
          example: money transfer to David
          maxLength: 255
          description: >
            Description associated with the transaction (for example,
            transaction details as included on a consumer's statement). 
        direction:
          type: string
          enum:
            - originator
            - receiver
          example: originator
          description: >
            The role of the account in the transaction. Possible values are
            `originator` if originating the transaction request or `receiver` if
            receiving the transaction request.
        counterPartyInstitution:
          type: string
          example: Chase
          maxLength: 255
          description: >
            The name of the institution with which the transaction is being
            completed.
        counterPartyType:
          type: string
          example: consumer
          maxLength: 255
          description: >
            The type of account with which the transaction is being completed.
            Possible values are `consumer` or `business`.
        counterPartyRouting:
          type: string
          example: 321270XXX
          maxLength: 255
          description: >
            The routing number of the external account associated with the
            transaction (entered as a string). 
        counterPartyAccount:
          type: string
          example: 750XXX
          maxLength: 255
          description: >
            The account number of the external account associated with the
            transaction (entered as a string). 
        merchant:
          type: string
          example: ''
          maxLength: 255
          description: |
            The merchant details.
        mcc:
          type: string
          example: '5411'
          maxLength: 4
          minLength: 4
          description: |
            The Merchant Category Code (MCC).
        transactionLocation:
          type:
            - string
            - 'null'
          enum:
            - domestic
            - international
          example: domestic
          description: |
            The location of the transaction.
        ipAddress:
          type: string
          example: 1.2.3.4
          description: >
            The consumer's IP address in IPv4 decimal or IPv6 hexadecimal
            format.
        channel:
          type: string
          enum:
            - web
            - mobile
            - phone
            - branch
            - offline
            - other
          example: mobile
          description: |
            The transaction origination channel.
        customerUserId:
          $ref: '#/components/schemas/CustomerUserID'
        userId:
          $ref: '#/components/schemas/UserID'
        countryOfOrigin:
          type: string
          description: >
            The country or jurisdiction from where the transaction originates,
            specified in ISO-2 country codes format.

            > **Note**: 
              > - This field explicitly refers to the originating country for the transaction passed into ID+, and does not bear any relation to the origin of an applicant’s residential history.
              > - This field is not case-sensitive.
          example: US
        segmentation:
          $ref: '#/components/schemas/Segmentation'
    Address:
      title: Addresses
      description: "The addresses associated with a transaction. Each address must be a unique type.\_Up to three addresses are allowed.\n"
      type: array
      items:
        required:
          - city
          - state
          - postalCode
          - country
          - type
        type: object
        properties:
          line1:
            example: 456 First Example Street
            type: string
            description: |
              The first line of the address.
          line2:
            example: APT 5
            type: string
            description: |
              An optional second line for the address.
          city:
            example: Albuquerque
            type: string
            description: |
              The city in which the address is located.
          state:
            minLength: 2
            maxLength: 2
            type: string
            example: NM
            description: >
              The state, province, or region in which the address is located,
              specified in ISO 3166-2 format.
          postalCode:
            type: string
            example: '07122'
            description: >
              The five or nine-digit ZIP code in valid postal address format.
              Hyphens are optional.
          country:
            minLength: 2
            maxLength: 2
            type: string
            example: US
            description: >
              The country in which the address is located, specified in ISO
              3166-1 alpha-2 format.
          type:
            type: string
            enum:
              - billing
              - shipping
              - store
            description: |
              The address type.
      additionalProperties: false
    CompanyName:
      type: string
      description: |
        The name of the consumer's employer.
      example: Corporation Corp, LLC.
    Payments:
      title: Payments
      type: object
      description: |
        Money transfer details for the transaction.
      required:
        - recipientCountry
        - paymentType
        - disbursementType
      properties:
        recipientCountry:
          minLength: 2
          maxLength: 2
          type: string
          example: US
          description: >
            The country where the recipient of the money transfer resides,
            specified in ISO 3166-1 alpha-2 format.
        paymentType:
          type: string
          enum:
            - ach
            - card
            - slice_it_by_card
            - pay_later_by_card
            - base_account
            - deferred_interest
            - fixed_amount
            - fixed_sum_credit
            - invoice
            - paypal
          example: ach
          description: The payment type.
        disbursementType:
          type: string
          enum:
            - billpay
            - delivery
            - deposit
            - pickup
            - reload
          example: billpay
          description: The disbursement type.
    MerchantDetails:
      type: object
      description: |
        Merchant details for the transaction.
      properties:
        id:
          type: string
          maxLength: 7
          description: |
