    WatchlistEvent:
      title: New Watchlist Event
      type: object
      properties:
        id:
          type: string
          description: A unique reference ID for the request.
          example: 246149b0-129d-5774-c543-45223220659d
        origId:
          type: string
          description: The reference ID of the ID+ transaction.
          example: 53048d83-d488-4dc3-aa59-b5701aabaffc
        eventGroup:
          type: string
          description: The event group.
          enum:
            - WatchlistNotification
          example: WatchlistNotification
        reason:
          type: string
          description: The event type.
          enum:
            - monitored_search_updated
          example: monitored_search_updated
        environmentName:
          type: string
          description: The environment in which the transaction took place.
          example: production
        event:
          type: object
          description: |
            Contains event details.
          properties:
            referenceId:
              type: string
              description: The reference ID of the ID+ transaction.
              example: c9b1dab6-4ffd-49f4-ba02-c5f517ef00fb
            globalWatchlist:
              type: object
              description: Contains Global Watchlist entity matches.
              properties:
                matches:
                  type: object
                  description: >-
                    Contains key-value pair of the source list name and an array
                    of details about that match.
                  properties:
                    PEP Data:
                      type: object
                      description: A list of politically exposed persons (PEP) matches.
                      properties:
                        status:
                          type: string
                          description: >-
                            Captures the date when the entity was added,
                            updated, or removed depending on the context of the
                            source list.
                          example: 'added date: 2023-01-02'
                        entityId:
                          type: string
                          description: The ID assigned to the entity.
                          example: ZaP+/U4Qa8Mmf3EjbTEKwiz+7vKZej
                        matchFields:
                          type: array
                          items:
                            type: string
                            example: dobExact
                          description: >
                            Array containing the name and DOB match type. Below
                            are the possible values.

                            * `nameExact`: Exact name match.

                            * `nameFuzzy`: Fuzzy name match.

                            * `nameEquivalent`: Name match based on the same
                            name meaning.

                            * `removedPersonalTitle`: Partial name match due to
                            the removal of an honorary title within the input
                            name such as (Dr, Mr, Queen, etc.).

                            * `nameInitialized`: Name match based on initials.

                            * `namePhonetic`: Name match based on phonetic
                            similarity.

                            * `akaExact`: Exact alias match.

                            * `akaFuzzy`: Fuzzy alias match.

                            * `akaEquivalent`: Alias match based on the same
                            alias meaning.

                            * `akaPhonetic`: Alias name match based on phonetic
                            similarity.

                            * `dobExact`: DOB matches year, month, and day.

                            * `dobFuzzy`: DOB is within one year (+/-) from the
                            entered DOB.

                            * `dobNotOnRecord`: The source either does not
                            contain a DOB for the matched entity, or the entered
                            DOB does not match the data on the file. 
                        sourceUrls:
                          type: array
                          items:
                            type: string
                          description: A list of source's URLs.
                          example:
                            - >-
                              http://www.treasury.gov/resource-center/sanctions/SDN-List/Pages/default.aspx
                        comments:
                          type: object
                          description: >
                            The `comments` object contains dynamic data that
                            varies based on the source. It may include personal
                            details, sanctions information, identifiers, and
                            aliases, but the keys and values can differ
                            depending on the data source.


                            A general JSON schema for the `comments` object is
                            as follows:


                            - Keys are dynamic and can vary by source.

                            - Values can be strings, arrays, or serialized
                            objects.


                            **Example structure**:


                            ```json

                            "comments": {
                              "key1": ["value1", "value2"],
                              "key2": "value3",
                              "key3": [
                                "{'nestedKey': 'value'}",
                                "{'nestedKey2': 'value2'}"
                              ]
                            }

                            ```

                            **Note**:
                              - Key behaviors: 
                                - Missing keys are handled by being omitted or set to `null`.
                                - Unexpected keys are either ignored or passed through.
                              - We recommend dynamically handling the `comments` object by:
                                - Iterating over key-value pairs.
                                - Conditionally parsing serialized or nested values.

                            **Payload example: OFAC source**

                            ```json title="Example 1: OFAC source"

                            "comments": {
                              "listName": ["SDN List"],
                              "program": ["GLOMAG"],
                              "name": ["Olesya Anatolevna Mendeleeva"],
                              "countries": ["RU"],
                              "aka": ["Alias1", "Alias2"]
                            }

                            ```  

                            **Payload example: Another source**
                              ```json title="Example 2: Another source"
                              "comments": {
                                "sanctionsType": ["Entity"],
                                "identifier": ["12345"],
                                "programCode": ["ABC"],
                                "additionalInfo": [
                                  "{'infoType': 'Notes', 'content': 'Additional details here'}"
                                ]
                              }                        
                              ```
                            **Mapping table**:
                              | Key               | Source (Example)      | Description                                 |
                              |-------------------|-----------------------|---------------------------------------------|
                              | `listName`        | OFAC                  | Represents the sanction list name (e.g., SDN List). |
                              | `sanctionsType`   | Another Source        | Describes the type of sanction (e.g., Entity). |
                              | `identifier`      | Another Source        | A unique identifier for the entity.        |
                              | `aka`             | OFAC                  | Alias names for the entity or individual.   |
                              | `programCode`     | Another Source        | Code for the sanction program (e.g., ABC).   |
                              | `countries`       | OFAC                  | Countries associated with the sanctions.    |
                          properties:
                            activeStartDate:
                              type: array
                              items:
                                type: string
                              description: The dates when the PEP took office.
                              example:
                                - '2015-03-03T00:00:00.000Z'
                                - '2020-01-01T00:00:00.000Z'
                            name:
                              type: array
                              items:
                                type: string
                              description: >-
                                The entity's names as they appear in the Global
                                Watchlist.
                              example:
                                - Mayuri Celestin
                                - Mayuri R. Celestin
                                - M. Celestin
                            dateOfBirth:
                              type: array
                              items:
                                type: string
                              description: The listed entity's dates of birth.
                              example:
                                - '1975-12-05'
                                - '1975-01-01'
                            originalCountryText:
                              type: array
                              items:
                                type: string
                              description: The entity's birth countries.
                              example:
                                - Haiti
                                - Dominican Republic
                                - Jamaica
                            aka:
                              type: array
                              items:
                                type: string
                              description: Other known aliases the entity has been using.
                              example:
                                - Maya
                                - Maaya
                                - May
                                - Mary
                            politicalPosition:
                              type: array
                              items:
                                type: string
                              description: The entity's political positions.
                              example:
                                - Child of Rony Celestin
                                - Relative of prominent politician
                                - Member of influential family
                            offense:
                              type: array
                              items:
                                type: string
                              description: The entity's PEP classes or related offenses.
                              example:
                                - Pep
                                - Pep Class 2
                                - Pep Class 4
                                - Involvement in financial irregularities
                        matchScore:
                          description: >-
                            A value between 1 and 100 that represents how
                            closely the individual name matches the name or
                            alias on the source list. 1 indicates that the name
                            is not likely a match, while 100 indicates that the
                            name exactly matches the name of the returned
                            entity.
                          type: integer
                          minimum: 1
                          maximum: 100
                          example: 87
                        entityCorrelationScore:
                          description: >-
                            A value between 1 and 100 representing the
                            likelihood of a potential hit being a true match
                            with the provided PII. A score of 1 indicates that
                            the entity is unlikely to be a match, while a score
                            of 100 indicates a high likelihood that the entity
                            matches the returned hit. 
                          type: integer
                          minimum: 1
                          maximum: 100
                          example: 89
