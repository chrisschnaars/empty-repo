    KYCResponse:
      title: Socure Verify (KYC)
      type: object
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceID'
          example: ab06216f-b88b-4be8-8075-933bb5c2303c
        kyc:
          description: Contains the field validations and reason codes.
          type: object
          properties:
            socureId:
              type: string
              description: >
                A persistent unique identifier for the transaction.

                > **Note**: This feature needs provisioning for the Socure
                Verify tier. 
            nationalId:
              type: string
              description: >
                The consumer's nine-digit Social Security number (SSN) or
                Individual Tax Identification Number (ITIN). 
            reasonCodes:
              description: A list of reason codes for this transaction.
              type: array
              items:
                type: string
              example:
                - I919
                - I351
            fieldValidations:
              $ref: '#/components/schemas/FieldValidations'
            sourceAttribution:
              type: array
              items:
                type: string
              description: >-
                A list of data sources that contributed to the verification
                result.
              example:
                - Government1
            fieldSourceAttribution:
              type: object
              description: >-
                Maps each verified field to the data sources that matched it.
                Available for international transactions only.
              example:
                firstName:
                  - Government1
                surName:
                  - Government1
                ssn:
                  - Government1
            matchCounts:
              type: object
              description: >-
                Contains match counts by category. Available for international
                transactions in the United Kingdom only when 2X2 is turned on.
              example:
                tradelines: 3
            creditFileNumber:
              type: string
              description: >-
                The credit file number returned for the consumer when a credit
                bureau in Canada validates the transaction. Requires special
                provisioning and is applicable to Canada only.
              example: '00512123456'
            creditFileMethod:
              type: object
              description: >-
                Credit file method details returned when a credit bureau
                validates the transaction. Applicable to international
                transactions only.
              properties:
                numberOfTrades:
                  type: string
                  description: Number of tradelines reported in the consumer's credit file.
                  example: '000'
                category:
                  type: string
                  description: >-
                    Category of the data source used to validate the credit
                    file.
                  example: credit
                creditFile3Years:
                  type: boolean
                  description: >-
                    Indicates whether the consumer has a credit file spanning at
                    least three years.
                  example: false
            additionalInfo:
              type: object
              description: >-
                Contains additional match information, such as the number of
                tradelines in the bureau that matched the entity. Applicable to
                2X2 transactions in the United Kingdom only.
              properties:
                tradelines:
                  type: number
                  description: Number of tradelines matched by the credit source.
                  example: 3
              example:
                tradelines: 3
            transactionScope:
              type: string
              description: >-
                Indicates the scope of the transaction (domestic or
                international).
              example: international
        sourceAttribution:
          type: array
          items:
            type: string
          description: A list of data sources used across the transaction.
          example:
            - Alternative Credit
            - Global Watchlist
        internationalFlagEnabled:
          type: boolean
          description: >-
            Indicates whether the international flag is enabled for this
            transaction, meaning Verify can be used for countries other than the
            US.
          example: true
        callType:
          type: string
          description: >-
            Indicates the verification call type used. Returns "2X2" when 2X2 is
            enabled for the transaction.
          example: 2X2
        transactionScope:
          type: string
          description: Indicates the scope of the transaction.
          example: international
        customerProfile:
          $ref: '#/components/schemas/CustomerProfile'
