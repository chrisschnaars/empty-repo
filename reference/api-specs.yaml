                  example: cbb45641-5072-43a3-bd48-6ab41248880d
                transactionId:
                  type: string
                  format: uuid
                  description: Identifier of the transaction associated with the case.
                  example: e0d96a57-a3d3-4f99-aeca-e021a72e4c49
